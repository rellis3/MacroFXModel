# Keeps js/infoMapDerived.js and plans/INFO_MAP.md (generated by scripts/build_info_map.mjs) fresh on main without anyone remembering to.
#
# Why: the Tests job used to fail whenever the checked-in copy was a commit behind, and several sessions push at once, so main was red on
# almost every run (2026-11-16). The test now judges the repo against its own facts and only WARNS about a stale copy; this job commits the
# fresh copy once a day (and on demand), with [skip ci] so it does not start another run.
name: Info map refresh

on:
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: info-map-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate
        run: node scripts/build_info_map.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- js/infoMapDerived.js plans/INFO_MAP.md; then echo "info map already fresh"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/infoMapDerived.js plans/INFO_MAP.md
          git commit -m "Info map: nightly refresh of the derived file [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
