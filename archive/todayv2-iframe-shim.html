<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Trading Brief V2</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0d1117}
#frame{border:0;width:100%;height:100%;display:block}
#status{position:fixed;right:12px;bottom:12px;z-index:9999;background:rgba(22,27,34,.94);color:#9da7b3;border:1px solid #30363d;border-radius:7px;padding:6px 9px;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:.8}
</style>
</head>
<body>
<iframe id="frame" src="today.html" title="Daily Trading Brief V2"></iframe>
<div id="status">TODAY V2 · presentation layer</div>
<script>
(function(){
  const frame=document.getElementById('frame');
  frame.addEventListener('load',()=>{
    try{
      const d=frame.contentDocument, h=d.head, b=d.body;
      if(!d||!b)return;
      const css=d.createElement('style');
      css.id='today-v2-presentation';
      css.textContent=`
        /* V2: keep all existing data/API/JS. Presentation only. */
        :root{
          --v2-accent:#4f7df0;--v2-good:#10b981;--v2-warn:#d29922;--v2-bad:#f85149;
        }
        body{scroll-behavior:smooth}
        .hdr{padding:11px 20px!important}
        .hdr h1{font-size:18px!important}
        .wrap{max-width:1540px!important}
        /* Make the existing Market Read unmistakably the context layer. */
        .mread{box-shadow:0 1px 0 rgba(79,125,240,.10)}
        .mread:before{
          content:"CONTEXT · WHAT KIND OF MARKET IS THIS?";
          display:block;color:var(--text3);font-size:9px;font-weight:800;
          letter-spacing:.09em;margin-bottom:6px;
        }
        /* Stronger visual hierarchy for existing instrument cards. */
        .pcard{
          transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;
          box-shadow:0 1px 2px rgba(0,0,0,.12);
        }
        .pcard:hover{transform:translateY(-1px);border-color:var(--blue)!important;box-shadow:0 5px 18px rgba(0,0,0,.18)}
        .pcard.prox{
          border-color:var(--amber)!important;
          box-shadow:0 0 0 1px rgba(210,153,34,.08),0 4px 18px rgba(210,153,34,.08);
        }
        /* The range/level area becomes the primary location visual. */
        .rmap{height:22px!important;border-radius:11px!important;margin-top:12px!important}
        .levels{margin-top:12px!important}
        .lvl{padding:4px 6px!important}
        .lvl.now{font-weight:800}
        /* Existing "Decision Engine" / decision content gets stronger hierarchy. */
        [class*="decision"],[id*="decision"]{--v2-decision-border:rgba(79,125,240,.45)}
        /* Research / explanatory sections should visually recede. */
        .macro,.news{border-radius:12px}
        .macro-hd,.news-hd{min-height:38px}
        .macro-body,.news-body{font-size:12px}
        /* Emphasise actionable chips without changing their values. */
        .pill,.state{letter-spacing:.01em}
        .state.fade{font-weight:850}
        .state.cont{font-weight:850}
        /* Drawer becomes a focused decision workspace. */
        .drawer{box-shadow:0 20px 70px rgba(0,0,0,.45)}
        .dhead{padding-top:5px!important}
        /* Small explanatory footer: context → location → behaviour → trigger. */
        .wrap:after{
          content:"TODAY V2 · Context → Location → Behaviour → Trigger";
          display:block;text-align:center;margin:18px 0 4px;color:var(--text3);
          font-size:10px;letter-spacing:.06em;text-transform:uppercase;
        }
      `;
      h.appendChild(css);

      // Add a compact V2 orientation strip without touching existing data.
      const wrap=d.querySelector('.wrap');
      if(wrap && !d.getElementById('today-v2-orientation')){
        const bar=d.createElement('div');
        bar.id='today-v2-orientation';
        bar.innerHTML=`
          <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 14px">
            <div class="stile"><div class="k">01 · Context</div><div class="s">Macro · risk · session · volatility</div></div>
            <div class="stile"><div class="k">02 · Location</div><div class="s">Forecast extremes · structure · OI</div></div>
            <div class="stile"><div class="k">03 · Behaviour</div><div class="s">Continuation vs fade</div></div>
            <div class="stile"><div class="k">04 · Trigger</div><div class="s">Wait for confirmation</div></div>
          </div>`;
        const first=wrap.firstElementChild;
        if(first)wrap.insertBefore(bar,first);
      }

      // Add a visible label above the existing instrument area.
      const grid=d.querySelector('#grid');
      if(grid && !d.getElementById('today-v2-opplabel')){
        const label=d.createElement('div');
        label.id='today-v2-opplabel';
        label.style.cssText='display:flex;align-items:center;gap:10px;margin:2px 0 8px;padding:0 2px;';
        label.innerHTML='<strong style="font-size:12px;text-transform:uppercase;letter-spacing:.07em">Opportunity Scan</strong><span style="font-size:11px;color:var(--text3)">Find the best locations first — use the C/F ticker for behaviour.</span>';
        grid.parentNode.insertBefore(label,grid);
      }
      document.getElementById('status').textContent='TODAY V2 · live existing endpoints';
      setTimeout(()=>document.getElementById('status').style.display='none',3500);
    }catch(e){
      document.getElementById('status').textContent='TODAY V2 · same-origin styling unavailable';
      console.error(e);
    }
  });
})();
</script>
</body>
</html>
