# Explicit multi-provider build config.
#
# Root `requirements.txt` (added 2026-08-11 for AnalogML's Railway wiring)
# is enough for Nixpacks' Python provider to self-detect -- but Nixpacks
# does NOT automatically combine multiple self-detected providers; without
# this file it silently picked only the Node provider (package.json), so
# Python was never installed in the image at all. Every AnalogML/level*/
# Regime*/Gold/bot Python process has been failing with "command not
# found" as a result -- not a typo in which interpreter name to call.
#
# "..." keeps whatever Nixpacks auto-detects (Node, via package.json) and
# explicitly adds the Python provider alongside it. The Python provider's
# own auto-detection then picks up the root requirements.txt and generates
# its own install phase (pip install -r requirements.txt) same as it
# always would for a Python-only app -- nothing else needs to be
# hand-written here.
providers = ["...", "python"]
