<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desk Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Desk Terminal (plans/DESK_ANALYST_PIPELINE.md §9r, Phase 17): the owner's private terminal over the desk's own book,
   agents and data. Never in the newsletter. A design of its own in the spirit of modern macro terminals: deep navy,
   purple for anything you can press, gold for theses and grades, green and red only for direction. */
:root{
  --bg:#070a17;--bg1:#0c1124;--bg2:#111833;--bg3:#18203f;--line:#1f2950;--line2:#2c3866;
  --tx:#eef0fb;--tx2:#a9b0d0;--tx3:#6d7599;
  --pur:#8b7cf6;--pur2:#b4a9ff;--purbg:rgba(139,124,246,.12);
  --gold:#e8b85a;--goldbg:rgba(232,184,90,.10);
  --up:#2fd39a;--upbg:rgba(47,211,154,.12);--dn:#ff5d78;--dnbg:rgba(255,93,120,.12);--flat:#8a93b8;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--sans:Inter,ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 var(--sans)}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(139,124,246,.10),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(232,184,90,.05),transparent 60%),var(--bg);min-height:100vh}
a{color:var(--pur2)}
button{font:inherit}
.lbl{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
.mono{font-family:var(--mono)}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(7,10,23,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:700 15px var(--mono);letter-spacing:.18em}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--pur);box-shadow:0 0 12px var(--pur)}
.brand span{color:var(--gold)}
.clocks{display:flex;gap:6px;flex-wrap:wrap}
.clk{display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg1);font:600 11px var(--mono);letter-spacing:.06em}
.clk b{font-weight:600;color:var(--tx2)}
.clk em{font-style:normal;color:var(--tx)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tx3)}
.dot.on{background:var(--up);box-shadow:0 0 8px var(--up)}
.tright{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2);background:var(--bg2);white-space:nowrap}
.chip.up{color:var(--up);border-color:rgba(47,211,154,.4);background:var(--upbg)}
.chip.dn{color:var(--dn);border-color:rgba(255,93,120,.4);background:var(--dnbg)}
.chip.gold{color:var(--gold);border-color:rgba(232,184,90,.45);background:var(--goldbg)}
.chip.pur{color:var(--pur2);border-color:rgba(139,124,246,.45);background:var(--purbg)}
.btn{cursor:pointer;border:1px solid var(--line2);background:var(--bg2);color:var(--tx2);padding:6px 12px;border-radius:8px;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.btn:hover,.btn:focus-visible{border-color:var(--pur);color:var(--tx);outline:none}
/* ticker */
.ticker{border-bottom:1px solid var(--line);background:var(--bg1);overflow:hidden;white-space:nowrap}
.tk{display:inline-flex;gap:34px;padding:8px 0;animation:tk 90s linear infinite;font:12px var(--mono);color:var(--tx2)}
.ticker:hover .tk{animation-play-state:paused}
.tk span b{color:var(--tx);font-weight:600}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tk{animation:none}}
/* tabs */
.wrap{max-width:1440px;margin:0 auto;padding:16px 16px 90px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 18px;padding:4px;background:var(--bg1);border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%}
.tabs button{cursor:pointer;background:none;border:0;color:var(--tx3);padding:8px 14px;border-radius:8px;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.tabs button[aria-selected="true"]{background:var(--purbg);color:var(--pur2);box-shadow:inset 0 0 0 1px rgba(139,124,246,.4)}
.tabs button:focus-visible{outline:2px solid var(--pur)}
/* cards */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.card{background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card.click{cursor:pointer;transition:border-color .15s,transform .15s}
.card.click:hover,.card.click:focus-visible{border-color:var(--pur);outline:none;transform:translateY(-1px)}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ch h3{margin:0;font-size:16px;font-weight:650;letter-spacing:.01em}
.ch .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.sec{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sec h2{margin:0;font:600 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--tx2)}
.sec .lbl{letter-spacing:.06em;text-transform:none;font-weight:400;font-family:var(--sans);font-size:12px}
.thesis{border-left:2px solid var(--gold);padding:2px 0 2px 12px;margin:10px 0;color:#f3e3bf;font-style:italic}
.synth{border-left:2px solid var(--gold);background:var(--goldbg);padding:10px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.muted{color:var(--tx3);font-size:12.5px}
.drv{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.drv span{font:11px var(--mono);padding:3px 8px;border-radius:6px;background:var(--bg3);border:1px solid var(--line);color:var(--tx2)}
.score{display:flex;align-items:center;gap:10px}
.score b{font:700 22px var(--mono)}
.score small{color:var(--tx3);font:12px var(--mono)}
.bar{height:6px;border-radius:99px;background:var(--bg3);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;border-radius:99px}
.pb{display:grid;gap:6px;margin-top:10px}
.pb div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:7px 10px;border-radius:8px;background:var(--bg3);border-left:3px solid var(--line2);font-size:13px}
.pb div b{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding-top:2px}
.pb .en{border-left-color:var(--up)}.pb .tg{border-left-color:var(--gold)}.pb .iv{border-left-color:var(--dn)}
.grade{font:700 13px var(--mono);color:var(--gold);border:1px solid rgba(232,184,90,.5);border-radius:7px;padding:2px 8px;background:var(--goldbg)}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--flat)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:0 8px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n{font-family:var(--mono);white-space:nowrap}
.scroll{overflow-x:auto}
.ladder{position:relative;height:30px;margin:10px 0 2px}
.ladder .rail{position:absolute;left:0;right:0;top:13px;height:4px;border-radius:9px;background:linear-gradient(90deg,var(--dnbg),var(--bg3) 45%,var(--bg3) 55%,var(--upbg))}
.ladder .tick{position:absolute;top:6px;width:1px;height:18px;background:var(--line2)}
.ladder .tick.o{background:var(--tx);height:22px;top:4px;width:2px}
.ladder .zone{position:absolute;top:9px;height:12px;border-radius:4px;background:var(--purbg);border:1px solid rgba(139,124,246,.6)}
.ladlab{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--tx3)}
.regime{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.regime .big{font:700 26px var(--mono);letter-spacing:.06em}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-top:12px}
.lists ul{margin:6px 0 0;padding:0;list-style:none}
.lists li{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:8px;align-items:baseline}
.strength{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
@media (max-width:760px){.strength{grid-template-columns:repeat(4,1fr)}}
.sbox{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer}
.sbox:hover,.sbox:focus-visible{border-color:var(--pur);outline:none}
.sbox b{display:block;font:700 15px var(--mono)}
.sbox .v{font:700 20px var(--mono);margin:4px 0}
.vbar{height:42px;display:flex;align-items:flex-end;justify-content:center}
.vbar i{width:14px;border-radius:4px 4px 0 0}
.heat td{text-align:center;font-family:var(--mono);font-size:12px;border:1px solid var(--bg)}
.gauge{height:10px;border-radius:99px;display:flex;overflow:hidden;background:var(--bg3)}
.gauge i{display:block;height:100%}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,5,12,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.modal .card{max-width:760px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(139,124,246,.25)}
.x{margin-left:auto;cursor:pointer;background:none;border:1px solid var(--line2);color:var(--tx2);border-radius:8px;width:30px;height:30px}
/* ask */
.fab{position:fixed;right:20px;bottom:20px;z-index:30;cursor:pointer;border:0;border-radius:999px;padding:12px 18px;background:linear-gradient(135deg,var(--pur),#6a5be0);color:#fff;font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;box-shadow:0 10px 30px rgba(139,124,246,.4)}
textarea{width:100%;min-height:80px;background:var(--bg3);color:var(--tx);border:1px solid var(--line2);border-radius:10px;padding:10px;font:14px var(--sans);resize:vertical}
textarea:focus{outline:none;border-color:var(--pur)}
.ans{white-space:pre-wrap;margin-top:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{cursor:pointer;background:var(--bg1);border:1px solid var(--line);color:var(--tx3);padding:5px 11px;border-radius:999px;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.filters button[aria-pressed="true"]{border-color:var(--pur);color:var(--pur2);background:var(--purbg)}
[hidden]{display:none!important}
details summary{cursor:pointer;color:var(--pur2);font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:8px}
/* v2 graphics */
.hero{position:relative;overflow:hidden;padding:0}
.hero .hhead{position:absolute;left:18px;top:14px;z-index:2;pointer-events:none}
.hero .hhead h2{margin:4px 0 0;font:700 20px var(--sans);letter-spacing:.01em}
.hero .legend{position:absolute;right:16px;bottom:12px;z-index:2;display:flex;gap:10px;flex-wrap:wrap;font:10.5px var(--mono);color:var(--tx3);background:rgba(7,10,23,.7);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.hero .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.map svg{display:block;width:100%;height:auto}
.map .land{fill:#141b38;stroke:#232c55;stroke-width:.5}
.map .zone{cursor:pointer;transition:opacity .2s}
.map .zone:hover{opacity:.85}
.map .grat{fill:none;stroke:rgba(139,124,246,.07);stroke-width:.6}
.map .sphere{fill:url(#ocean);stroke:rgba(139,124,246,.18)}
.map .cb{cursor:pointer}
.map .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.map .arc{fill:none;stroke:var(--gold);stroke-width:1.6;stroke-dasharray:4 6;animation:dash 1.6s linear infinite;filter:drop-shadow(0 0 4px rgba(232,184,90,.7))}
@keyframes dash{to{stroke-dashoffset:-20}}
.map .lab{font:600 11px var(--mono);fill:var(--tx);paint-order:stroke;stroke:#070a17;stroke-width:3px;letter-spacing:.04em}
.map .lab2{font:10px var(--mono);fill:var(--tx2);paint-order:stroke;stroke:#070a17;stroke-width:3px}
@media (prefers-reduced-motion:reduce){.map .pulse,.map .arc{animation:none}}
.tip{position:fixed;z-index:60;pointer-events:none;background:rgba(12,17,36,.96);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font:12px var(--sans);max-width:260px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.ring{display:block}
.spark{display:block;width:100%;height:64px;margin-top:8px}
.achart{height:320px;margin:12px 0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.donuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.donut{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.donut b{display:block;font:600 11px var(--mono);margin-top:2px}
.hero .hhead,.hero .legend{}
@media (max-width:700px){.hero .hhead{position:static;padding:12px 14px 0}.hero .hhead h2{font-size:16px}.hero .legend{position:static;margin:0 10px 10px;justify-content:center}.map .lab{font-size:9px}}
.glow{box-shadow:0 0 0 1px rgba(139,124,246,.25),0 20px 60px rgba(139,124,246,.08)}
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand"><i></i>DESK <span>TERMINAL</span></div>
    <div class="clocks" id="clocks"></div>
    <div class="tright"><span id="bookchip" class="chip">book…</span><span id="dqchip" class="chip">data…</span><a class="btn" href="desk-office.html">Desk Office</a><a class="btn" href="desk-run.html">Desk Run</a></div>
  </div>
  <div class="ticker" aria-label="headlines"><div class="tk" id="tk"><span>Loading the desk…</span></div></div>
</header>
<main class="wrap">
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" aria-selected="true" data-t="overview">Overview</button>
    <button role="tab" aria-selected="false" data-t="ccy">Currencies</button>
    <button role="tab" aria-selected="false" data-t="assets">Assets</button>
    <button role="tab" aria-selected="false" data-t="macro">Macro</button>
    <button role="tab" aria-selected="false" data-t="pos">Positioning</button>
    <button role="tab" aria-selected="false" data-t="cal">Calendar</button>
    <button role="tab" aria-selected="false" data-t="ana">Analytics</button>
    <button role="tab" aria-selected="false" data-t="charts">Charts</button>
  </nav>
  <div id="wstrip" aria-live="polite"></div>
  <section id="overview"></section>
  <section id="ccy" hidden></section>
  <section id="assets" hidden></section>
  <section id="macro" hidden></section>
  <section id="pos" hidden></section>
  <section id="cal" hidden></section>
  <section id="ana" hidden></section>
  <section id="charts" hidden></section>
</main>
<button class="fab" id="askbtn">✦ Ask the desk</button>
<div class="modal" id="modal" hidden></div>
<div class="tip" id="tip" hidden></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const getJson = u => fetch(u, { cache: 'no-store' }).then(r => r.json()).catch(e => ({ ok: false, error: e.message }));
const f = (x, d = 2) => (x == null || !Number.isFinite(+x) ? '–' : (+x > 0 ? '+' : '') + (+x).toFixed(d));
const LONDON = 'Europe/London';
const CCYS = ['USD', 'EUR', 'GBP', 'JPY', 'AUD', 'NZD', 'CAD', 'CHF'];
const FLAG = { USD: '🇺🇸', EUR: '🇪🇺', GBP: '🇬🇧', JPY: '🇯🇵', AUD: '🇦🇺', NZD: '🇳🇿', CAD: '🇨🇦', CHF: '🇨🇭' };
const BANK = { USD: 'Federal Reserve', EUR: 'European Central Bank', GBP: 'Bank of England', JPY: 'Bank of Japan', AUD: 'Reserve Bank of Australia', NZD: 'Reserve Bank of New Zealand', CAD: 'Bank of Canada', CHF: 'Swiss National Bank' };
const BANKSHORT = { USD: 'Fed', EUR: 'ECB', GBP: 'BoE', JPY: 'BoJ', AUD: 'RBA', NZD: 'RBNZ', CAD: 'BoC', CHF: 'SNB' };
const GROUPS = { fx_majors: 'FX majors', fx_crosses: 'FX crosses', indices: 'Indices', metals: 'Metals', energy: 'Energy', ags: 'Agriculturals', crypto: 'Crypto' };
const UNIVERSE = { fx_majors: ['EURUSD', 'GBPUSD', 'USDJPY', 'AUDUSD', 'NZDUSD', 'USDCAD', 'USDCHF'], fx_crosses: ['GBPJPY', 'EURGBP', 'EURJPY', 'EURCHF', 'GBPCHF', 'AUDJPY', 'CADJPY', 'EURAUD', 'EURCAD', 'EURNZD', 'GBPAUD', 'GBPCAD', 'AUDCAD', 'NZDCAD', 'NZDJPY'], indices: ['NQ', 'SPX500', 'US30', 'US2000', 'DE30', 'UK100'], metals: ['GOLD', 'SILVER', 'COPPER', 'PLATINUM', 'PALLADIUM'], energy: ['WTI', 'BRENT', 'NATGAS'], ags: ['SOYBEAN', 'WHEAT', 'CORN', 'SUGAR'], crypto: ['BTCUSD'] };
const groupOf = n => Object.keys(UNIVERSE).find(g => UNIVERSE[g].includes(n)) ?? 'other';
const NAME = { NQ: 'Nasdaq 100', SPX500: 'S&P 500', US30: 'Dow 30', US2000: 'Russell 2000', DE30: 'DAX', UK100: 'FTSE 100', GOLD: 'Gold', SILVER: 'Silver', COPPER: 'Copper', PLATINUM: 'Platinum', PALLADIUM: 'Palladium', WTI: 'WTI crude', BRENT: 'Brent crude', NATGAS: 'Natural gas', SOYBEAN: 'Soybeans', WHEAT: 'Wheat', CORN: 'Corn', SUGAR: 'Sugar', BTCUSD: 'Bitcoin' };
const nice = n => NAME[n] ?? (n.length === 6 ? `${n.slice(0, 3)}/${n.slice(3)}` : n);
const DIR = { STRONG_LONG: 2, LONG: 1, FLAT: 0, NEUTRAL: 0, SHORT: -1, STRONG_SHORT: -2 };
const CONV = { low: 0.6, medium: 0.8, high: 1 };
// The desk's −2..+2 views put on a /10 scale: 5 is no view, 10 is a strong long at high conviction.
const assetScore = c => +(5 + 2.5 * (DIR[c.rating] ?? 0) * (CONV[c.conviction] ?? 0.8)).toFixed(1);
const ccyScore = bias => +(5 + 2.5 * (Number(bias) || 0)).toFixed(1);
const grade = c => { const d = Math.abs(DIR[c.rating] ?? 0); if (!d || !(c.size > 0)) return null; return d === 2 && c.conviction === 'high' ? 'A+' : c.conviction === 'high' ? 'A' : c.conviction === 'medium' ? (d === 2 ? 'A-' : 'B+') : 'B'; };
const px = v => (Number.isFinite(+v) ? (+v).toFixed(+v >= 1000 ? 1 : +v >= 100 ? 2 : +v >= 10 ? 3 : 5) : '–');
const dirCls = v => (v > 0 ? 'up' : v < 0 ? 'dn' : 'fl');
const rateChip = r => { const d = DIR[r] ?? 0; return `<span class="chip ${d > 0 ? 'up' : d < 0 ? 'dn' : ''}">${d > 0 ? '▲' : d < 0 ? '▼' : '●'} ${esc(String(r ?? 'FLAT').replace('_', ' '))}</span>`; };
const biasChip = b => `<span class="chip ${b > 0 ? 'up' : b < 0 ? 'dn' : ''}">${b >= 2 ? 'Strong bullish' : b > 0 ? 'Bullish' : b <= -2 ? 'Strong bearish' : b < 0 ? 'Bearish' : 'Neutral'}</span>`;
const scoreBar = (s, w = '100%') => `<div class="score" style="width:${w}"><b class="${dirCls(s - 5)}">${s.toFixed(1)}</b><small>/10</small><div class="bar"><i style="width:${s * 10}%;background:${s > 5.2 ? 'var(--up)' : s < 4.8 ? 'var(--dn)' : 'var(--flat)'}"></i></div></div>`;
const firstSentence = t => { const m = String(t ?? '').match(/^.{20,260}?[.;](\s|$)/); return (m ? m[0] : String(t ?? '').slice(0, 220)).trim(); };
// the analyst ids the desk cites in brackets become driver chips
const SRC = { rates_cb: 'CB', macro_economy: 'MACRO', cot_positioning: 'COT', yields_curve: 'RATES', credit_funding: 'CREDIT', events_news: 'EVENT', options_oi: 'OPTIONS', levels_structure: 'LEVELS', vol_iv: 'VOL', global_market: 'GLOBAL', evidence_memory: 'EVIDENCE' };

function upcoming(hours = 48) {
  const now = Date.now();
  return D.ev.filter(e => { const ms = Number(e.ms ?? Date.parse(e.time)); return ms > now - 30 * 60_000 && ms < now + hours * 3600e3; }).sort((a, b) => (a.ms ?? 0) - (b.ms ?? 0));
}

function ladder(c) {

  const z = nums.length >= 2 ? [Math.min(...nums), Math.max(...nums)] : null;
  return `<div class="ladder"><div class="rail"></div>${['p90', 'p75', 'p50'].flatMap(q => [L.down[q], L.up[q]]).map(v => `<i class="tick" style="left:${x(v)}%"></i>`).join('')}<i class="tick o" style="left:${x(L.open)}%"></i>${z ? `<i class="zone" style="left:${Math.max(0, x(z[0]))}%;width:${Math.max(1.5, Math.min(100, x(z[1])) - Math.max(0, x(z[0])))}%" title="entry zone"></i>` : ''}</div><div class="ladlab"><span>${lo}</span><span>open ${L.open}</span><span>${hi}</span></div>`;
}

<h3 style="margin:0 0 8px;font-size:${full ? 22 : 17}px">Analysis of ${esc(nice(n))}</h3>
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${rateChip(c.rating)}${scoreBar(s, '200px')}${live && live.rating !== c.rating ? `<span class="chip gold" title="${esc(live.why ?? '')}">updated → ${esc(live.rating)}</span>` : ''}</div>
<div class="thesis">“${esc(firstSentence(c.why))}”</div>
<div class="drv">${sources(c.why).map(t => `<span>${t}</span>`).join('')}<span>conviction ${esc(c.conviction)}</span><span>size ${c.size ?? 0}${c.sizeBeforeCap && c.sizeBeforeCap !== c.size ? ` (from ${c.sizeBeforeCap})` : ''}</span></div>
${full ? `<div class="achart" id="achart"></div>` : ladder(c)}
${full ? `<p>${esc(c.why)}</p><div class="pb">${c.plan?.zone ? `<div class="en"><b>Entry</b><span>${esc(c.plan.zone)}</span></div>` : ''}${c.levels?.up ? `<div class="tg"><b>Target</b><span class="mono">${Math.sign(DIR[c.rating] ?? 0) >= 0 ? `up p50 ${c.levels.up.p50} · p75 ${c.levels.up.p75} · p90 ${c.levels.up.p90}` : `down p50 ${c.levels.down.p50} · p75 ${c.levels.down.p75} · p90 ${c.levels.down.p90}`}</span></div>` : ''}<div class="iv"><b>Invalid</b><span>${esc(c.plan?.invalidation ?? c.invalidation ?? '–')}</span></div>${c.plan?.timing ? `<div><b>Timing</b><span>${esc(c.plan.timing)}</span></div>` : ''}</div>

function deskView(n) {
  const g = groupOf(n), a = D.run?.debate?.assets?.[g]?.view?.instruments?.[n];
  return a ? `<div class="sec"><h2>The ${esc(GROUPS[g])} desk said</h2></div><p>${rateChip(a.rating)} <span class="muted">${esc(a.conviction ?? '')}</span></p><p class="muted">${esc(a.why ?? '')}</p>` : '';
}
function assets() {
  const entries = Object.entries(D.cards).filter(([n]) => assetFilter === 'all' || groupOf(n) === assetFilter);

  const bar = h => { if (!h || !Number.isFinite(h.bp)) return '<td class="n muted">–</td>'; const w = Math.abs(h.bp) / mx * 50, col = h.bp > 0 ? 'var(--up)' : h.bp < 0 ? 'var(--dn)' : 'var(--flat)';

  return `<div class="card" style="margin-top:14px"><div class="ch"><span class="lbl">What the futures price</span><span class="r muted">change priced vs today's policy rate, by about 3, 6 and 12 months · pulled ${x.ageH != null ? `${x.ageH} h ago` : ''}</span></div>
<div class="scroll"><table><thead><tr><th>Bank</th><th>Policy</th><th>~3 months</th><th>~6 months</th><th>~12 months</th><th>1 week</th><th>Contract</th></tr></thead><tbody>${banks.map(([c, b]) => `<tr><td class="n">${FLAG[c] ?? ''} ${BANKSHORT[c] ?? c}</td><td class="n">${b.policy != null ? pct(b.policy) : '–'}</td>${bar(b.m3)}${bar(b.m6)}${bar(b.m12)}<td class="n ${dirCls(b.m3?.weekBp)}">${b.m3?.weekBp != null ? `${b.m3.weekBp > 0 ? '+' : ''}${b.m3.weekBp}bp` : '–'}</td><td class="muted" style="font-size:11.5px">${esc(b.source)}${b.against === 'front contract' ? '<br>read against its front contract (bank bills carry a credit spread)' : ''}</td></tr>`).join('')}</tbody></table></div>

}

  const ev = upcoming(24 * 7).filter(e => !/holiday/i.test(e.impact));
  const days = {}; for (const e of ev) { const d = new Date(e.ms).toLocaleDateString('en-GB', { timeZone: LONDON, weekday: 'long', day: 'numeric', month: 'short' }); (days[d] ||= []).push(e); }
  const fam = (D.run?.economist?.releases ?? []);
  $('cal').innerHTML = Object.entries(days).map(([d, es]) => `<div class="sec"><h2>${esc(d)}</h2></div><div class="card scroll"><table><tbody>${es.map(e => { const pb = fam.find(r => Math.abs(Date.parse(r.at) - e.ms) < 60_000);
    return `<tr><td class="n" style="width:70px">${new Date(e.ms).toLocaleTimeString('en-GB', { timeZone: LONDON, hour: '2-digit', minute: '2-digit' })}</td><td style="width:44px"><b>${esc(e.country)}</b></td><td>${esc(e.event)}${pb ? ` <span class="chip gold">playbook</span>` : ''}</td><td><span class="chip ${/high/i.test(e.impact) ? 'dn' : /medium/i.test(e.impact) ? 'gold' : ''}">${esc(e.impact)}</span></td><td class="muted mono" style="font-size:12px">${e.estimate ? `est ${esc(e.estimate)}` : ''}${e.prev ? ` · prev ${esc(e.prev)}` : ''}${e.actual ? ` · <b class="mono" style="color:var(--tx)">${esc(e.actual)}</b>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`).join('') || '<div class="card muted">No events in the calendar feed.</div>';
}

function corrWeb(el, r) {
  const c = r?.corr; if (!r?.ok || !c?.names?.length) { el.innerHTML = `<p class="muted">${esc(r?.reason ?? r?.error ?? 'No portfolio-risk read yet.')}</p>`; return; }
  const n = c.names.length, W = 520, H = 440, cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 56;
  // order the ring so cards that move together sit together: by group, then by currency leg
  const order = c.names.map((nm, i) => i).sort((a, b) => (groupOf(c.names[a]) + c.names[a]).localeCompare(groupOf(c.names[b]) + c.names[b]));
  const pos = {}; order.forEach((i, k) => { const a = (k / n) * 2 * Math.PI - Math.PI / 2; pos[i] = [cx + R * Math.cos(a), cy + R * Math.sin(a), a]; });
  const edges = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { const v = c.m[i][j]; if (Math.abs(v) >= 0.5) edges.push([i, j, v]); }
  edges.sort((a, b) => Math.abs(a[2]) - Math.abs(b[2]));
  const node = i => { const [x, y, a] = pos[i], w = c.weights[i], rr = 5 + Math.min(12, Math.abs(w) * 9), col = w > 0 ? '#2fd39a' : '#ff5d78', lx = cx + (R + 16) * Math.cos(a), ly = cy + (R + 16) * Math.sin(a), anchor = Math.cos(a) > 0.2 ? 'start' : Math.cos(a) < -0.2 ? 'end' : 'middle';
    return `<g class="wn" data-i="${i}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${rr}" fill="${col}" opacity=".9" style="filter:drop-shadow(0 0 6px ${col})"/><text x="${lx}" y="${ly + 4}" text-anchor="${anchor}" fill="#a9b0d0" font-family="JetBrains Mono" font-size="10">${esc(c.names[i])}</text></g>`; };
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="correlation web"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(139,124,246,.12)"/>
${edges.map(([i, j, v]) => { const [x1, y1] = pos[i], [x2, y2] = pos[j]; return `<path class="we" data-a="${i}" data-b="${j}" d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" fill="none" stroke="${v > 0 ? '#e8b85a' : '#8b7cf6'}" stroke-width="${(Math.abs(v) - 0.4) * 5}" opacity="${0.15 + (Math.abs(v) - 0.5) * 1.2}"/>`; }).join('')}
${order.map(node).join('')}</svg>
<div class="muted"><span style="color:var(--gold)">━</span> the same bet (they win and lose together) · <span style="color:var(--pur2)">━</span> a hedge (one offsets the other) · dot size = card size · ${r.effectiveBets} effective bets across ${r.cards} cards. Hover a card.</div>`;
  el.querySelectorAll('.wn').forEach(g => { g.onmouseenter = () => { const i = g.dataset.i; el.querySelectorAll('.we').forEach(p => p.style.opacity = (p.dataset.a === i || p.dataset.b === i) ? 1 : 0.04); };
    g.onmouseleave = () => el.querySelectorAll('.we').forEach(p => p.style.opacity = ''); g.onclick = () => { const nm = c.names[g.dataset.i]; if (D.cards[nm]) { openModal(assetCard(nm, D.cards[nm], true)); assetChart($('achart'), nm, D.cards[nm]); } }; });
}
function strengthHeat(el, h) {
  const rows = (h?.rows ?? []).filter(r => r.biases);
  if (rows.length < 2) { el.innerHTML = `<p class="muted">${rows.length} desk day${rows.length === 1 ? '' : 's'} so far: the timeline fills in as the desk runs each morning.</p>${rows.length ? strengthStripFor(rows[0]) : ''}`; return; }
  const cw = Math.max(8, Math.min(48, 560 / rows.length)), W = 50 + rows.length * cw, H = 24 + CCYS.length * 22, every = Math.max(1, Math.ceil(40 / cw));   // a date label needs ~40px
  const col = b => (b > 0 ? `rgba(47,211,154,${0.25 + 0.35 * Math.min(2, b)})` : b < 0 ? `rgba(255,93,120,${0.25 + 0.35 * Math.min(2, -b)})` : 'rgba(138,147,184,.18)');
  el.innerHTML = `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%" role="img" aria-label="currency bias by day">${CCYS.map((c, i) => `<text x="0" y="${20 + i * 22 + 14}" fill="#a9b0d0" font-family="JetBrains Mono" font-size="11">${c}</text>${rows.map((r, k) => `<rect x="${50 + k * cw}" y="${20 + i * 22}" width="${cw - 2}" height="18" rx="3" fill="${col(r.biases[c] ?? 0)}"><title>${r.date} ${c} ${r.biases[c] ?? 0}</title></rect>`).join('')}`).join('')}
${rows.map((r, k) => (k % every === 0 ? `<text x="${50 + k * cw + (cw - 2) / 2}" y="12" text-anchor="middle" fill="#6d7599" font-family="JetBrains Mono" font-size="9">${r.date.slice(5)}</text>` : '')).join('')}</svg></div><div class="muted">Green = bullish bias that morning, red = bearish, by strength.</div>`;
}
const strengthStripFor = r => `<div class="drv">${CCYS.map(c => `<span class="${dirCls(r.biases[c])}">${c} ${r.biases[c] > 0 ? '+' : ''}${r.biases[c] ?? 0}</span>`).join('')}</div>`;
function trackChart(el, h) {
  const rows = (h?.rows ?? []).filter(r => r.score && Number.isFinite(r.score.S));

// a three-column flow: tone → currencies → cards, ribbons sized by the cards' size
function bookFlow(el) {

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H + 40}" width="100%" role="img" aria-label="macro regime quadrant">
${quad(cx, 10, W / 2 - 10, cy - 10, 'reflation', 'REFLATION', W - 20, 26)}${quad(10, 10, W / 2 - 10, cy - 10, 'stagflation', 'STAGFLATION', 20, 26)}${quad(10, cy, W / 2 - 10, H - 40 - cy, 'deflation', 'DEFLATION', 20, H - 46)}${quad(cx, cy, W / 2 - 10, H - 40 - cy, 'goldilocks', 'GOLDILOCKS', W - 20, H - 46)}
<line x1="10" x2="${W - 10}" y1="${cy}" y2="${cy}" stroke="#2c3866"/><line x1="${cx}" x2="${cx}" y1="10" y2="${H - 40}" stroke="#2c3866"/>
<text x="${W - 12}" y="${cy - 6}" text-anchor="end" fill="#6d7599" font-family="JetBrains Mono" font-size="9">GROWTH →</text><text x="${cx + 6}" y="20" fill="#6d7599" font-family="JetBrains Mono" font-size="9">INFLATION ↑</text>
<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="rgba(238,240,251,.35)" stroke-width="1.5"/>
${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 7 : 2.5 + i / 12}" fill="${REG_COL[last[i].regime]}" opacity="${0.35 + 0.65 * i / pts.length}" ${i === pts.length - 1 ? 'style="filter:drop-shadow(0 0 8px #fff)"' : ''}><title>${last[i].m}: ${last[i].regime}</title></circle>`).join('')}
<text x="${pts.at(-1)[0] + 10}" y="${pts.at(-1)[1] - 8}" fill="#eef0fb" font-family="JetBrains Mono" font-size="11">${esc(last.at(-1).m)} ${esc(r.now?.label ?? '')}</text>
${strip.map((p, i) => `<rect x="${10 + i * sw}" y="${H - 18}" width="${sw + 0.3}" height="14" fill="${REG_COL[p.regime]}" opacity=".75"><title>${p.m} ${p.regime}</title></rect>`).join('')}
<text x="10" y="${H + 10}" fill="#6d7599" font-family="JetBrains Mono" font-size="9">${esc(strip[0].m)}</text><text x="${W - 10}" y="${H + 10}" text-anchor="end" fill="#6d7599" font-family="JetBrains Mono" font-size="9">${esc(strip.at(-1).m)}</text></svg>
<div class="muted">${esc(r.now?.what ?? '')}. ${esc(String(r.now?.usual ?? '').replace(/([^.])$/, '$1.'))} The strip is the regime month by month over ${Math.round(strip.length / 12)} years. Context, not a signal.</div>`;
}
function surprises(el, s) {
  if (!s?.ok) { el.innerHTML = '<p class="muted">No surprise data.</p>'; return; }
  const now = Date.now(), from = now - 120 * 864e5, pts = [];
  for (const [k, arr] of Object.entries(s.series ?? {})) { const c = CC2[k.split('|')[0]]; if (!c) continue; for (const p of arr ?? []) if (p.ms >= from && Number.isFinite(p.z)) pts.push({ c, ms: p.ms, z: Math.max(-4, Math.min(4, p.z)), ev: k.split('|')[1] }); }
  const W = 520, rowH = 34, H = 26 + CCYS.length * rowH, X = ms => 70 + ((ms - from) / (now - from)) * (W - 140);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="data surprises">${CCYS.map((c, i) => { const y = 20 + i * rowH + rowH / 2, sc = s.byCcy?.[c]?.score;
    return `<line x1="70" x2="${W - 70}" y1="${y}" y2="${y}" stroke="#1f2950"/><text x="0" y="${y + 4}" fill="#a9b0d0" font-family="JetBrains Mono" font-size="11">${FLAG[c] ?? ''} ${c}</text>
${pts.filter(p => p.c === c).map(p => `<circle cx="${X(p.ms)}" cy="${y - p.z * 3.6}" r="${2 + Math.abs(p.z) * 0.9}" fill="${p.z > 0 ? '#2fd39a' : '#ff5d78'}" opacity=".7"><title>${new Date(p.ms).toISOString().slice(0, 10)} ${esc(p.ev)}: z ${p.z.toFixed(2)}</title></circle>`).join('')}
<rect x="${W - 60}" y="${y - 7}" width="50" height="14" rx="4" fill="var(--bg3)"/><rect x="${W - 35}" y="${y - 7}" width="${Math.min(25, Math.abs(sc ?? 0) * 25)}" height="14" rx="3" fill="${(sc ?? 0) > 0 ? '#2fd39a' : '#ff5d78'}" opacity=".4" transform="${(sc ?? 0) < 0 ? `translate(${-Math.min(25, Math.abs(sc) * 25)},0)` : ''}"/><text x="${W - 35}" y="${y + 4}" text-anchor="middle" fill="#eef0fb" font-family="JetBrains Mono" font-size="10" font-weight="700" paint-order="stroke" stroke="#070a17" stroke-width="2.5">${sc == null ? '–' : f(sc)}</text>`; }).join('')}
<text x="70" y="${H - 2}" fill="#6d7599" font-family="JetBrains Mono" font-size="9">${new Date(from).toISOString().slice(5, 10)}</text><text x="${W - 70}" y="${H - 2}" text-anchor="end" fill="#6d7599" font-family="JetBrains Mono" font-size="9">today</text></svg>
<div class="muted">Each dot is one release: above the line beat consensus, below missed it, bigger = a bigger surprise. Right: the decayed surprise index per currency.</div>`;
}
function cotGrid(el, c) {
  const S = c?.series ?? {}, want = ['EUR', 'GBP', 'JPY', 'AUD', 'CAD', 'CHF', 'NZD', 'GOLD', 'NQ', 'SPX'];
  const syms = want.filter(k => S[k]).concat(Object.keys(S).filter(k => !want.includes(k))).slice(0, 12);
  if (!syms.length) { el.innerHTML = `<div class="card muted">${esc(c?.error ?? 'No COT history.')}</div>`; return; }
  el.innerHTML = syms.map(k => { const v = S[k].specShare.map(x => (x == null ? null : +x)), ok = v.filter(Number.isFinite), sorted = [...ok].sort((a, b) => a - b);
    const p10 = sorted[Math.floor(sorted.length * 0.1)], p90 = sorted[Math.floor(sorted.length * 0.9)], lo = Math.min(...ok), hi = Math.max(...ok), W = 300, H = 110, X = i => (i / (v.length - 1)) * W, Y = x => H - 6 - ((x - lo) / (hi - lo || 1)) * (H - 12);
    const last = ok.at(-1), ext = last >= p90 ? 'crowded long' : last <= p10 ? 'crowded short' : null;
    const line = v.map((x, i) => (Number.isFinite(x) ? `${X(i).toFixed(1)},${Y(x).toFixed(1)}` : null)).filter(Boolean).join(' ');
    return `<div class="card" style="padding:12px 14px"><div class="ch" style="margin-bottom:4px"><b class="mono">${esc(S[k].label ?? k)}</b><span class="r">${ext ? `<span class="chip ${last > 0 ? 'up' : 'dn'}">${ext}</span>` : ''}<span class="mono ${dirCls(last)}" style="font-size:12px">${f(last, 1)}%</span></span></div>
<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" role="img" aria-label="${esc(k)} positioning"><rect x="0" y="0" width="${W}" height="${Y(p90)}" fill="rgba(47,211,154,.07)"/><rect x="0" y="${Y(p10)}" width="${W}" height="${H - Y(p10)}" fill="rgba(255,93,120,.07)"/>${lo < 0 && hi > 0 ? `<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="#2c3866"/>` : ''}<polyline points="${line}" fill="none" stroke="#b4a9ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${X(v.length - 1)}" cy="${Y(last)}" r="4" fill="${last > 0 ? '#2fd39a' : '#ff5d78'}" style="filter:drop-shadow(0 0 5px ${last > 0 ? '#2fd39a' : '#ff5d78'})"/></svg>
<div class="muted" style="font-size:11px">${esc(S[k].dates[0])} → ${esc(S[k].dates.at(-1))}</div></div>`; }).join('');
}
async function seasonHeat(el) {
  const got = await Promise.all(SEASON_INSTS.map(i => CH.season[i] ? CH.season[i] : getJson(`/api/desk-season?inst=${i}`).then(r => (CH.season[i] = r))));
  const rows = SEASON_INSTS.map((i, k) => [i, got[k]]).filter(([, r]) => r?.ok);
  if (!rows.length) { el.innerHTML = '<p class="muted">No daily history available.</p>'; return; }
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], cm = new Date().getUTCMonth();
  const col = (m, sd) => { if (m == null) return 'var(--bg3)'; const z = Math.max(-1, Math.min(1, m / Math.max(0.3, sd ?? 1) * 1.5)); return z > 0 ? `rgba(47,211,154,${0.12 + z * 0.6})` : `rgba(255,93,120,${0.12 - z * 0.6})`; };
  el.innerHTML = `<div class="scroll"><table class="heat" style="min-width:720px"><thead><tr><th></th>${MON.map((m, i) => `<th style="text-align:center;${i === cm ? 'color:var(--gold)' : ''}">${m}</th>`).join('')}<th>Since</th></tr></thead><tbody>${rows.map(([i, r]) => `<tr><th><a href="#" data-wk="${i}" style="color:var(--tx);text-decoration:none">${esc(i)}</a></th>${r.months.map((m, k) => `<td style="background:${col(m.mean, m.sd)};${k === cm ? 'outline:2px solid var(--gold);outline-offset:-2px' : ''}" title="${MON[k]}: mean ${m.mean}% · up ${Math.round((m.up ?? 0) * 100)}% of ${m.n} years">${m.mean == null ? '' : (m.mean > 0 ? '+' : '') + m.mean.toFixed(1)}<br><span style="font-size:9px;opacity:.7">${m.up == null ? '' : Math.round(m.up * 100) + '%↑'}</span></td>`).join('')}<td class="muted" style="font-size:10px">${esc(r.from?.slice(0, 4))}</td></tr>`).join('')}</tbody></table></div>
<div class="muted">Mean monthly return (%) and the share of years it rose. Each month is one draw per year, so ~15-20 per cell: history, not a forecast, and most cells are within noise.</div>`;
  el.querySelectorAll('[data-wk]').forEach(a => a.onclick = ev => { ev.preventDefault(); const r = CH.season[a.dataset.wk], D5 = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'], m = Math.max(...r.weekdays.map(w => Math.abs(w.mean ?? 0)), 0.001);
    $('wkday').innerHTML = `<div class="sec"><h2>${esc(a.dataset.wk)} by weekday</h2><span class="lbl">mean daily return and share up, ${esc(r.from)} to ${esc(r.to)}</span></div><svg viewBox="0 0 520 150" width="100%" style="max-width:640px">${r.weekdays.map((w, k) => { const x = 40 + k * 95, h = Math.abs(w.mean ?? 0) / m * 50; return `<rect x="${x}" y="${w.mean >= 0 ? 70 - h : 70}" width="60" height="${h}" rx="4" fill="${w.mean >= 0 ? '#2fd39a' : '#ff5d78'}" opacity=".8"/><text x="${x + 30}" y="140" text-anchor="middle" fill="#a9b0d0" font-family="JetBrains Mono" font-size="11">${D5[k]}</text><text x="${x + 30}" y="${w.mean >= 0 ? 64 - h : 86 + h}" text-anchor="middle" fill="#eef0fb" font-family="JetBrains Mono" font-size="10">${w.mean == null ? '' : (w.mean > 0 ? '+' : '') + w.mean.toFixed(3)}% · ${Math.round((w.up ?? 0) * 100)}%↑</text>`; }).join('')}<line x1="30" x2="510" y1="70" y2="70" stroke="#2c3866"/></svg>`; });
}

// clicking a currency or an instrument anywhere opens its card
function wire(root) {
  root.querySelectorAll('[data-ccy]').forEach(el => { const go = () => ccyModal(el.dataset.ccy); el.onclick = go; el.onkeydown = e => { if (e.key === 'Enter') go(); }; });
  root.querySelectorAll('[data-inst]').forEach(el => { const go = () => { const c = D.cards[el.dataset.inst]; if (c) { openModal(assetCard(el.dataset.inst, c, true)); assetChart($('achart'), el.dataset.inst, c); } }; el.onclick = go; el.onkeydown = e => { if (e.key === 'Enter') go(); }; });
}

// ── Ask the desk ──
$('askbtn').onclick = () => {
  openModal(`<div class="ch"><span class="lbl">Ask the desk</span><button class="x" aria-label="Close">✕</button></div>
<p class="muted">One answer from today's book, the analysts' reports, the desk's memory and the Evidence Book. It cites what it uses and says when the data does not answer the question.</p>
<textarea id="q" placeholder="Why is the desk short USD/JPY when the Fed is hawkish?"></textarea>
<div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="qgo">Ask</button><span id="qst" class="muted"></span></div><div class="ans" id="qa"></div>`);
  $('q').focus();
  $('qgo').onclick = async () => {
    const q = $('q').value.trim(); if (!q) return;
    $('qgo').disabled = true; $('qst').textContent = 'Thinking…'; $('qa').textContent = '';
    const r = await fetch('/api/desk-ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q }) }).then(x => x.json()).catch(e => ({ ok: false, error: e.message }));
    $('qgo').disabled = false; $('qst').textContent = r.ok ? `${r.model ?? ''}` : '';
    $('qa').innerHTML = r.ok ? `<div class="synth" style="font-style:normal">${esc(r.answer)}</div>${r.sources?.length ? `<div class="drv">${r.sources.map(s => `<span>${esc(s)}</span>`).join('')}</div>` : ''}` : `<p class="dn">${esc(r.error ?? 'failed')}</p>`;
  };
};

load();
setInterval(() => { if (!document.hidden) { ANA = null; load(); if (!$('ana').hidden) analytics(); } }, 5 * 60_000);   // the Charts tab's sources change daily at most: drawn once per visit
</script>
