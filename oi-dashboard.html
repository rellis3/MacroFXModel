<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<title>OI Analytics — Open Interest Dashboard</title>
<style>
/* ── Deliberately NOT the neon-card look: a dense analyst sheet. One accent
     (amber) for structure, red/green only where direction has meaning, and
     everything on a strict 12-col grid so numbers line up down the page. ── */
:root{
  --bg:#0b0d10; --bg2:#111419; --bg3:#161a20; --line:#232830; --line2:#2e343d;
  --tx:#eef1f5; --tx2:#a8b1bd; --tx3:#71798a;
  --acc:#e0a339; --call:#e8615f; --put:#46b87a; --pain:#d9c04a;
  --gam:#9b7de0; --vol:#4b9fd6; --warn:#e08a3c; --ok:#3fae6d;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
.wrap{max-width:1680px;margin:0 auto;padding:0 22px 80px}

/* header */
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:16px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top h1{margin:0;font-size:22px;font-weight:650;letter-spacing:.14em;text-transform:uppercase}
.top h1 span{color:var(--acc)}
.top .sub{color:var(--tx2);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{background:var(--bg3);border:1px solid var(--line2);color:var(--tx2);
  padding:9px 15px;border-radius:5px;cursor:pointer;font-size:13px;font-family:var(--mono)}
.btn:hover{border-color:var(--acc);color:var(--tx)}

/* instrument rail */
.rail{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.rail button{background:transparent;border:1px solid var(--line);color:var(--tx3);
  padding:10px 16px;border-radius:5px;cursor:pointer;font-family:var(--mono);font-size:14px;
  display:flex;gap:7px;align-items:center}
.rail button:hover{border-color:var(--line2);color:var(--tx2)}
.rail button.on{border-color:var(--acc);color:var(--acc);background:rgba(224,163,57,.07)}
.rail button.stale{opacity:.45}
.rail .dot{width:5px;height:5px;border-radius:50%;background:var(--ok)}
.rail .dot.old{background:var(--warn)}
.rail .dot.none{background:var(--tx3)}

/* price bar — the CFD vs futures reconciliation the whole thing hangs off */
.pricebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:6px}
.pricebar>div{background:var(--bg2);padding:14px 17px}
.pricebar .k{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx3)}
.pricebar .v{font-family:var(--mono);font-size:25px;margin-top:2px}
.pricebar .n{font-size:12px;color:var(--tx3);margin-top:1px;font-family:var(--mono)}
.pricebar .drift{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-family:var(--mono);margin-top:4px}
.pricebar .drift .dot{width:6px;height:6px;border-radius:50%;background:var(--tx3);display:inline-block}
.pricebar .drift .dot.flat{background:var(--tx3)}
.pricebar .stamp{font-size:11px;color:var(--tx3);font-family:var(--mono);margin-top:4px}
.pricebar .stamp b{color:var(--acc);font-weight:600}

/* diagnostics — the point of the page: never lose the provenance again */
.diag{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.chip{font-family:var(--mono);font-size:12px;padding:6px 11px;border-radius:3px;
  border:1px solid var(--line2);color:var(--tx2);background:var(--bg2)}
.chip b{color:var(--tx);font-weight:600}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.bad{border-color:var(--call);color:var(--call)}
.chip.good{border-color:var(--ok);color:var(--ok)}

/* level strip */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.lv{background:var(--bg2);padding:13px 16px;border-top:3px solid transparent}
.lv .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.lv .v{font-family:var(--mono);font-size:24px;margin-top:3px}
.lv .f{font-family:var(--mono);font-size:12px;color:var(--tx3);margin-top:1px}
.lv .d{font-family:var(--mono);font-size:12px;color:var(--tx2);margin-top:1px}

/* Today's read - the plain-English summary strip above the panels */
.todayread{margin-bottom:18px}
.todayread .body{padding:0}
.rd-top{padding:16px 18px;border-bottom:1px solid var(--line)}
.rd-reg{font-size:13px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;margin-bottom:8px}
.rd-say{font-size:14px;line-height:1.62;color:var(--tx2);margin-top:6px;max-width:104ch}
.rd-say b{color:var(--tx);font-weight:600}
.rd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:1px;background:var(--line)}
.rd{background:var(--bg2);padding:13px 16px}
.rd-h{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:7px}
.rdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.rd-v{font-size:14.5px;color:var(--tx);margin-top:5px;line-height:1.45}
.rd-v b{font-family:var(--mono);font-weight:600}
.rd-d{font-size:12.5px;color:var(--tx3);margin-top:5px;line-height:1.55}
.rd-d b{color:var(--tx2)}
@media(max-width:760px){.rd-grid{grid-template-columns:1fr}}

/* panels */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.p{background:var(--bg2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.p>h3{margin:0;padding:13px 17px;font-size:13px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--tx2);border-bottom:1px solid var(--line);background:var(--bg3);
  display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.p>h3 em{font-style:normal;color:var(--tx3);font-size:9.5px;letter-spacing:.04em;text-transform:none}
.p .body{padding:16px 17px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}
@media(max-width:1250px){.c8,.c6,.c4,.c5,.c7{grid-column:span 12}}

table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:14px}
th{text-align:right;padding:9px 13px;color:var(--tx2);font-weight:600;font-size:11.5px;
  letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 13px;border-bottom:1px solid rgba(35,40,48,.5);text-align:right}
tr:last-child td{border-bottom:0}
.bar{height:13px;border-radius:1px;display:inline-block;vertical-align:middle}
.muted{color:var(--tx3)}
.tag{font-size:9px;padding:1px 5px;border-radius:2px;border:1px solid currentColor;margin-left:5px}

svg{display:block;width:100%;height:auto;overflow:visible}
.axis{stroke:var(--line2);stroke-width:1}
.gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.lbl{fill:var(--tx2);font-family:var(--mono);font-size:12px}
.spotline{stroke:var(--acc);stroke-width:1;stroke-dasharray:3 3}
.empty{color:var(--tx3);padding:36px 18px;text-align:center;font-size:14px;line-height:1.7}
.note{color:var(--tx2);font-size:13px;line-height:1.66;margin-top:13px;border-left:2px solid var(--line2);padding-left:13px}

/* help — every metric explains itself inline, no hunting for a legend */
.h{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
  border-radius:50%;border:1px solid var(--line2);color:var(--tx3);font-size:10px;
  margin-left:7px;cursor:help;position:relative;flex:none;font-style:normal;font-weight:700}
.h:hover{border-color:var(--acc);color:var(--acc)}
.h .tip{display:none;position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
  width:340px;max-width:78vw;background:#05070a;border:1px solid var(--acc);border-radius:7px;
  padding:13px 15px;font-size:13.5px;line-height:1.62;color:var(--tx);z-index:70;
  box-shadow:0 14px 36px rgba(0,0,0,.75);text-align:left;font-weight:400;letter-spacing:0;
  text-transform:none;white-space:normal}
.h:hover .tip{display:block}
.h .tip b{color:var(--acc)}
.h .tip em{color:var(--tx2);font-style:normal;display:block;margin-top:8px;font-size:12.5px}
.p>h3 .grow{flex:1;display:flex;align-items:center}
.p>h3 .zoom{background:none;border:1px solid var(--line2);color:var(--tx3);cursor:pointer;
  border-radius:4px;padding:4px 10px;font-size:11.5px;font-family:var(--mono);letter-spacing:0;text-transform:none}
.p>h3 .zoom:hover{border-color:var(--acc);color:var(--acc)}
.p .body.flush{padding:6px 0 2px}
tr.dim td{opacity:.42}
.pill{font-size:11px;padding:2px 7px;border-radius:4px;border:1px solid currentColor;margin-left:7px}
#zoom{display:none;position:fixed;inset:0;background:rgba(4,6,9,.94);z-index:200;padding:34px;overflow:auto}
#zoom.open{display:block}
#zoomBox{max-width:1500px;margin:0 auto;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
#zoomBox h3{margin:0;padding:16px 20px;font-size:16px;background:var(--bg3);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px}
#zoomBox h3 .grow{flex:1}
#zoomBody{padding:24px 22px}
#zoomBody svg{min-height:400px}

/* price chart + toolbar */
#pxWrap{background:var(--bg2);border:1px solid var(--line);border-radius:7px;margin-bottom:18px;overflow:hidden}
#pxWrap>h3{margin:0;padding:13px 17px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tx);border-bottom:1px solid var(--line);background:var(--bg3);
  display:flex;align-items:center;gap:8px;font-weight:600}
#pxChartWrap{position:relative;height:430px;width:100%}
#pxChart{height:430px;width:100%}
/* GEX regime-band overlay: translucent horizontal price zones (PIN green / BREAKOUT red)
   above the candle canvas but non-interactive, so candles show through the tint. */
#pxBands{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pxBand{position:absolute;left:0;right:0;pointer-events:none}
/* Overlay for status/errors. Deliberately a SIBLING of #pxChart, never inside it - text
   written into the chart host destroys the canvas and leaves a dead chart. */
#pxMsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  pointer-events:none;background:rgba(18,22,28,.86)}
#pxMsg .empty{pointer-events:auto;text-align:center}
#pxMsg .btn{margin-left:10px}
.pxage{margin-left:10px;font-size:11px;color:#7c8794;align-self:center;white-space:nowrap}
.ctl{display:flex;gap:20px;flex-wrap:wrap;align-items:center;padding:11px 17px;
  border-bottom:1px solid var(--line);background:#0f1319}
.tfs{display:flex;gap:5px}
.tfb{padding:5px 12px;font-size:12px}
.ltogs{display:flex;gap:7px;flex-wrap:wrap}
.ltog{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;color:var(--tx3);
  border:1px solid var(--line);border-radius:5px;padding:5px 11px;user-select:none}
.ltog.on{color:var(--tx);border-color:var(--line2)}
.ltog .sw{width:12px;height:12px;border-radius:3px;border:1.5px solid;display:inline-block;flex:none}

/* Tooltips live in a BODY-LEVEL layer positioned by JS. As children of a panel they were
   clipped by its overflow and painted underneath the panel above — unreadable exactly
   where the page is densest. Nothing can clip a fixed element at the top of the stack. */
#tip{display:none;position:fixed;z-index:900;width:350px;max-width:80vw;background:#05070a;
  border:1px solid var(--acc);border-radius:7px;padding:13px 15px;font-size:13.5px;line-height:1.62;
  color:var(--tx);box-shadow:0 16px 40px rgba(0,0,0,.8);pointer-events:none}
#tip b{color:var(--acc)}
#tip em{color:var(--tx2);font-style:normal;display:block;margin-top:8px;font-size:12.5px}

/* The reachability panel stacks a table, a race, a histogram and a curve. Stacked it ran
   about five times the height of every other pane; as columns it matches them. */
.rgrid{display:grid;grid-template-columns:1.35fr .95fr .8fr;gap:20px;align-items:start}
@media(max-width:1250px){.rgrid{grid-template-columns:1fr}}
.rgrid h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);font-weight:600}
.rgrid .note{font-size:12px;margin-top:9px}
.rgrid svg{max-height:190px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1><span>◆</span> OI Analytics</h1>
    <div class="sub" id="sub">loading…</div>
    <div class="right">
      <button class="btn" id="unitBtn">Showing: SPOT-ADJ</button>
      <button class="btn" id="sortBtn">Walls: STRENGTH</button>
      <button class="btn" id="expBtn">⬇ Export lines</button>
      <label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);cursor:pointer" title="Export the lines in raw CME/COMEX futures price terms instead of OANDA spot — to overlay on a futures chart. Adds the basis back. Default: spot."><input type="checkbox" id="futTerms" style="cursor:pointer"> futures terms</label>
      <label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);cursor:pointer" title="Draw EVERY expiry's max-pain and call/put wall as lines (DTE-tagged, far ones faded), not just the primary + day set. For seeing the whole term structure on the chart."><input type="checkbox" id="allExp" style="cursor:pointer"> all expiries</label>
      <button class="btn" id="reanBtn" title="Re-derive every pair's levels from the OI data already stored (adds the day-expiry / latest compute) — no re-paste. Pinned to the saved basis, so LEVELS DO NOT MOVE: use Re-basis for that.">↻ Re-analyse all</button>
      <button class="btn" id="rebasisBtn" title="Re-fetch the live futures+spot pair and rebuild every level off the CURRENT basis. Every level is strike − basis, and the basis drifts intraday (measured 2.1 → 6.6 pips in one session), so levels built at 00:36 are wrong by mid-morning. This moves them. Also re-plans the OI bot's zones, same as Re-analyse.">⟳ Re-basis (live)</button>
      <button class="btn" id="reload">Reload</button>
      <a class="btn" href="cot-extremes.html" style="text-decoration:none">COT positioning</a>
      <a class="btn" href="index.html" style="text-decoration:none">Dashboard</a>
    </div>
  </div>

  <!-- OI-bot hold-score calibration state (collecting → what happens & why · active
       → fitted weights auto-applied). The "don't forget the calibration" strip. -->
  <div id="calibBanner" style="display:none;margin:8px 0;border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.5"></div>

  <div class="rail" id="rail"></div>
  <div id="pxWrap"><h3><span class="grow">Price with OI levels</span></h3><div id="ctlHost"></div><div id="pxChartWrap"><div id="pxChart"></div><div id="pxBands"></div><div id="pxMsg"></div></div></div>
  <div id="main"></div>
</div>

<div id="tip"></div>

<div id="zoom"><div id="zoomBox">
  <h3><span class="grow" id="zoomTitle"></span><button class="btn" onclick="closeZoom()">Close ✕</button></h3>
  <div id="zoomBody"></div>
</div>

</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Data: the KV `oi_store` record written by the OI modal. Read-only — this page
// computes nothing the analyser doesn't already store, so a number here and a
// number in the bot can never disagree. Everything it needs is on the record.
// ─────────────────────────────────────────────────────────────────────────────
const FRIENDLY = {
  'XAU/USD':'GOLD','NAS100_USD':'NQ','SPX500_USD':'SPX500','DE30_USD':'DAX',
  'UK100_GBP':'FTSE','US30_USD':'US30','US2000_USD':'RUS2K',
};
let STORE = {}, SYM = null, SPOTADJ = true, SORT = 'strength', PANELS = {};

const nm  = k => FRIENDLY[k] || k;
const dp  = k => /JPY/i.test(k) ? 3 : (/XAU/.test(k) || /_/.test(k)) ? 2 : 5;
const pip = k => /JPY/i.test(k) ? 0.01 : /XAU/.test(k) ? 0.1 : /_/.test(k) ? 1 : 0.0001;
const fx  = (v,k) => Number.isFinite(v) ? v.toFixed(dp(k)) : '—';
const fOI = n => !Number.isFinite(n) ? '—' : Math.abs(n)>=1e6 ? (n/1e6).toFixed(1)+'M'
                : Math.abs(n)>=1000 ? (n/1000).toFixed(1)+'K' : String(Math.round(n));
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Stored levels are SPOT-adjusted (strike − basis). Toggle back to raw futures
// strikes so a level can be checked against the CME ladder directly.
const show = (v,e) => (!Number.isFinite(v)) ? NaN : (SPOTADJ ? v : v + (e.basis||0));

// Every explanation on the page lives here so the vocabulary stays consistent. Written
// for someone learning the structure, not as a reminder for someone who already knows.
const HELP = {
  cfd:['CFD spot','The price <b>your broker</b> quotes — what you actually trade. Option strikes are NOT quoted here; they are quoted in futures terms, which is why the basis exists.'],
  fut:['CME futures','The <b>futures contract</b> the options are written on. Fetched live at the moment you press Analyse.','Amber means it fell back to a settlement price, which can be a day stale.'],
  basis:['Basis','<b>Futures minus spot.</b> Options are struck on the future, you trade the spot, so every level must be shifted by this to be drawable on your chart.','It comes from carry (the interest-rate differential). It only means anything if both prices were read at the same instant — that is what "both legs same instant" confirms.'],
  refmove:['Reference move','The yardstick everything else is measured against — how far price could plausibly travel by expiry.','A wall ten reference moves away is abandoned paper, not a level. <b>Careful:</b> this is measured to the <b>main</b> expiry, so for a same-day trade it overstates what is reachable. For intraday use the &ldquo;what is realistic today&rdquo; line in Today&rsquo;s read at the top of the page.'],
  expiry:['Expiry','Which option expiry these levels come from. Different expiries pin at different prices, so the label matters.','Chosen automatically as the nearest expiry with real near-the-money open interest.'],
  saved:['Saved','When you last pressed Analyse. Open interest updates once a day, so a stale save means stale levels.'],
  callwall:['Call wall','The strike with the most call options above price — a <b>ceiling other people have already sold into</b>.','As price rises toward it the dealers who sold those calls must <b>buy</b> to stay hedged, which helps price up. At the strike that buying stops. So rallies tend to <b>stall there</b>: it is a place to take profit on a long or look for a short — not a place to buy a breakout.'],
  putwall:['Put wall','The strike with the most put options below price — a <b>floor other people have already bought protection at</b>.','As price falls toward it dealers must <b>sell</b> to stay hedged, which speeds the drop. At the strike that selling stops. So falls tend to <b>stall there</b>: a place to cover a short or look for a long — not a place to sell a breakdown.'],
  maxpain:['Max pain','The price where the most options expire worthless, so the people who sold them make the most money.','Price tends to <b>drift toward it as expiry approaches</b>, and the pull is only real in the last day or two — more than about five days out, ignore it. Even close in, only trade it if the pin is <b>near enough to reach today</b>. A magnet three days of movement away is not a target.'],
  gflip:['Gamma flip','The same calm-versus-jumpy border as the GEX flip, but read off the per-strike chart — the rougher of the two.','Above it moves get damped and ranges hold. Below it moves get amplified and trends run. When the two flips disagree, trust the GEX flip.'],
  gexflip:['GEX flip','The price where dealers switch from <b>calming</b> the market to <b>stirring it up</b>.','Above it, fade extremes. Below it, follow breaks. If price is sitting close to it the regime is fragile and can switch on you intraday, so trade smaller until price picks a side. Where this and the gamma flip disagree, trust this one.'],
  charm:['Charm flip','Where <b>time-decay</b> driven hedging reverses. Charm is how delta changes as time passes.','This is the mechanism that pins price to big strikes into expiry. Negligible until the last day or two, then it dominates.'],
  vanna:['Vanna flip','Where <b>volatility-driven</b> hedging reverses. Vanna is how delta changes when implied vol moves.','Dormant until IV moves. Classic use: after an event IV collapses, and if dealers are positioned right that forces buying with no news at all.'],
  expmove:['Expected move','The range the options market itself expects price to stay inside by expiry.','Use it as a reality check on take-profits. A target outside this band is one the option market is pricing as unlikely — if your TP sits there, you are betting against their own pricing.'],
  oichart:['Open interest by strike','How many contracts sit at each strike. <b>Red bars right = calls</b> (resistance above), <b>green bars left = puts</b> (support below). A tall bar is a lot of money parked at that price. Amber dashes mark spot, and only strikes near price are drawn.','Use it to see <b>where the crowd is positioned</b> — not where price is going. One trap: close to expiry a big bar far from price is old paper with no hedging left behind it. The Net GEX chart is the better guide to which strikes still actually matter today.'],
  gexchart:['Net GEX by strike','Where dealers are forced to hedge, and which way that pushes price. <b>Red above the line</b> = calls dominate, <b>green below</b> = puts dominate. The marked crossing is where their behaviour flips.','<b>Above the flip</b> dealers lean against moves: ranges hold and fading extremes works. <b>Below it</b> they push moves along: breaks run, so do not fade them. If price is sitting right on the crossing the regime is unstable — trade smaller until it picks a side.'],
  smile:['IV smile','What the options market is <b>bracing for</b> — not direction, but how much movement, and which side people are paying up to protect. <b>Blue is today, grey is the previous settlement.</b> Blue below grey means the market expects a calmer day than it did yesterday.','Use it to decide <b>how far to trust your signal</b>, never to pick a side. Calm or falling: trade normally. Rising sharply — especially with the left wing steepening, meaning downside protection is getting expensive — is the market buying umbrellas. If your signal is long, that is a reason to go smaller or wait, not to reverse.'],
  term:['ATM IV term structure','At-the-money implied vol across <b>expiries</b> — the market vol forecast by horizon.','<b>Upward sloping</b> is normal: more time, more uncertainty. <b>Inverted</b> (near-dated higher) means an event is expected soon and short-dated levels break more easily.'],
  flow:['Positioning and flow','Aggregate reads on how the option book is positioned and how that changed since yesterday.','These describe the <b>character</b> of the market — whether moves get damped or amplified, whether positioning is being built or unwound. They are context, not entry signals.'],
  netgex:['Net GEX','One number for whether dealers are <b>calming</b> the market or <b>stirring it up</b>.','<b>Positive</b>: they lean against moves, so ranges hold — buying dips and selling rallies into the levels is what works. <b>Negative</b>: they push moves along, so breaks run — do not fade them, trade with the move.'],
  netdex:['Net DEX','Total dealer delta exposure — how much underlying they must hold to stay hedged.'],
  pc:['Put/call ratio','How many puts are open for every call — a rough gauge of whether the crowd is <b>hedged or chasing</b>.','Below 0.7 is call-heavy (crowd leaning long); above 1.3 is put-heavy (hedged or scared). Extremes can be contrarian, but in a strong trend they persist for weeks — never trade this on its own.'],
  skew:['OI skew','<b>Where</b> positioning sits rather than how much. Negative = puts stacked below (downside hedged). Positive = calls stacked above.'],
  conc:['Concentration','Whether the open interest is piled into a few strikes or spread thinly across many.','<b>Concentrated</b> means a handful of levels dominate, so price respects them and fading into them works. <b>Dispersed</b> means nothing is really defended — expect levels to hold less well and give breakouts more room.'],
  cex:['CEX (charm)','How hard time-decay is pulling price toward the big strikes.','Only meaningful in the last day or two before expiry — that is when it produces pinning. A big number with weeks left on the clock is not telling you anything.'],
  vex:['VEX (vanna)','Which way dealers are forced to trade if implied vol moves.','Dormant while IV is flat. The classic case: after an event IV collapses and, if dealers are positioned right, that alone forces them to buy — a rally with no news behind it.'],
  rr:['Risk reversal','Whether people are paying more to bet on a <b>rise</b> or to protect against a <b>fall</b>.','Downside tilt: protection against a fall is the expensive side — mild caution if you are long. Upside tilt: upside bets are the expensive side — mild caution if you are short. It is a lean, never a signal on its own.'],
  atmiv:['ATM IV change','Whether the options market expects <b>more or less</b> movement than it did yesterday.','Falling: calmer, trade your signal normally. Rising sharply: something is making people nervous — go smaller or wait for confirmation, rather than reversing.'],
  volpc:['Volume P/C','Today <b>traded</b> put/call ratio, versus the resting open-interest ratio. When they diverge, today flow disagrees with existing positioning.'],
  oichg:['OI change','Contracts added or removed since yesterday. <b>Building</b> = new money committing. <b>Closing</b> = positions unwinding, so the level is losing its backing.'],
  walls:['Wall tables','Every strike with meaningful open interest on that side — the ceilings above price and the floors below it.','<b>Strength</b> is how big the strike is versus its neighbours, so a big number in a quiet area beats a big number in a busy one. <b>&times; nearby</b> is that multiple. <b>Careful near expiry:</b> these rank by contracts held, and within a day or two of expiry the biggest piles sit at strikes nobody is hedging any more. When the traded expiry is close, use the gamma-ranked levels in Today&rsquo;s read instead.'],
  perexp:['Per-expiry structure','Where each expiry pins, so you can see whether near and far horizons agree.','If a nearby expiry and a distant one pin at very different prices, expect the level to shift once the near one expires.'],
  reach:['Reachability','The chance price <b>touches</b> each wall within the horizon, from a Monte Carlo over the volatility cone. A wick counts.','The raw model is over-confident — a raw 94% only touches about 68% of the time — so these are CORRECTED against a reliability curve fitted on real EUR/USD data and verified out of sample to about 2pp. The curve is shown beside the numbers so you can see how much correction was applied. It says nothing about whether a wall then HOLDS.'],
  volmag:['Volume magnets','Strikes with the heaviest <b>volume traded today</b>, as opposed to resting open interest.','Volume is activity, open interest is commitment. A strike busy today with little open interest is a fresh fight, not an established wall.'],
  fullbook:['Full-book GEX','Net dealer gamma summed across <b>every expiry</b>, each option weighted by its own gamma (which embeds its DTE and IV) — the whole-book view, versus the single-expiry Net GEX the walls and traded regime use.','The per-expiry rows show which expiry is driving the book (a near-dated contract counts far more per unit of OI, since gamma explodes toward expiry). Analysis only — the bot trades the single-expiry regime, not this. Needs a multi-expiry paste; per-expiry vol uses each expiry\'s ATM IV when the settlements table is pasted, else a flat guess.'],
};
const h = k => HELP[k] ? `<i class="h" data-k="${k}">?</i>` : '';
const pips = (v,sp,k) => (Number.isFinite(v)&&Number.isFinite(sp)) ? ((v-sp)/pip(k)) : NaN;
// Short clock stamp, e.g. "07:07" — for the "updated" / "since" readouts on the card.
const hhmm = ms => Number.isFinite(ms) ? new Date(ms).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '—';
// Browser mirror of oiRegimeBands (js/oi.js): PIN/BREAKOUT bands from the stored gex crossings
// (already basis-shifted). Kept tiny + input-identical to the canonical brick — the export/
// indicator will consume the brick directly later. Each band's regime = the crossing's own dir.
function regimeBands(e, lo, hi){
  const flips=(e.gexFlips||[]).filter(f=>Number.isFinite(f?.price)&&f.price>lo&&f.price<hi).sort((a,b)=>a.price-b.price);
  const net=e.exposures?.gex ?? e.gex ?? 0;
  let reg = flips.length ? (flips[0].dir==='long->short'?'pin':'breakout') : (net>0?'pin':net<0?'breakout':'neutral');
  const bands=[]; let cur=lo;
  for(const f of flips){ bands.push({lo:cur,hi:f.price,regime:reg}); reg=f.dir==='long->short'?'breakout':'pin'; cur=f.price; }
  bands.push({lo:cur,hi,regime:reg});
  return bands;
}
// The regime band that contains a price (for the "spot is in a PIN zone" read). null if none.
function regimeAt(e, px, lo, hi){
  const b=regimeBands(e,lo,hi).find(b=>px>=b.lo&&px<=b.hi); return b?b.regime:null;
}
// How far live spot has walked from where TODAY's levels were anchored (inst.daySpot @ daySpotAt).
// The 15-min basis control keeps inst.spot live; daySpot is fixed at the day's first analyse, so
// this reads "price is +18p / 0.12% from the levels' reference" — how in-play today's walls are.
function driftBadge(e){
  if(!Number.isFinite(e.spot)||!Number.isFinite(e.daySpot)||!e.daySpot) return '';
  const dp=(e.spot-e.daySpot)/pip(SYM), pct=(e.spot-e.daySpot)/e.daySpot*100, since=hhmm(e.daySpotAt);
  if(Math.abs(dp)<0.5) return `<span class="drift"><span class="dot flat"></span>flat since ${since}</span>`;
  const up=dp>0, col=up?'var(--call)':'var(--put)';
  return `<span class="drift" style="color:${col}">${up?'▲':'▼'} ${dp>=0?'+':''}${dp.toFixed(0)}p · ${pct>=0?'+':''}${pct.toFixed(2)}% since ${since}</span>`;
}

// ── zoom: any panel can be opened full-screen ──
function openZoom(key){
  const e=STORE[SYM], p=PANELS[key]; if(!p) return;
  document.getElementById('zoomTitle').innerHTML=p.title;
  document.getElementById('zoomBody').innerHTML=p.render(e,true);
  document.getElementById('zoom').classList.add('open');
}
function closeZoom(){ document.getElementById('zoom').classList.remove('open'); }
// Registered by hand: this panel fetches asynchronously rather than rendering from the
// stored record, so it does not go through panel().
PANELS['reach'] = { title: 'Reachability \u2014 will price get there?', render: (e,big) => reachPanel(e,big) };
function panel(cls,key,title,helpKey,render,flush){
  PANELS[key]={title,render};
  const e=STORE[SYM];
  return `<div class="p ${cls}"><h3><span class="grow">${title}${h(helpKey)}</span>`
    + `<button class="zoom" onclick="openZoom('${key}')">&#10530; Enlarge</button></h3>`
    + `<div class="body${flush?' flush':''}">${render(e,false)}</div></div>`;
}

// ── PRICE CHART with every OI level drawn on it ──────────────────────────────
// Same library and candle feed the OI-bot page uses (`/api/oanda_ohlc5m`), so a level
// here sits exactly where it sits there. Each level TYPE can be switched off, because
// with walls, flips, max pain, the expected-move band and volume magnets all on at once
// the chart is unreadable — which is the whole complaint this answers.
const OANDA_SYM = {'EUR/USD':'EUR_USD','GBP/USD':'GBP_USD','USD/JPY':'USD_JPY','AUD/USD':'AUD_USD',
  'XAU/USD':'XAU_USD','USD/CAD':'USD_CAD','USD/CHF':'USD_CHF','NAS100_USD':'NAS100_USD',
  'SPX500_USD':'SPX500_USD','US30_USD':'US30_USD','US2000_USD':'US2000_USD','DE30_USD':'DE30_EUR','UK100_GBP':'UK100_GBP'};

// Which level types the chart can draw, their colour, and whether they start visible.
// Walls default ON (they're the tradeable levels); the greek flips default OFF because
// they are context and four extra dotted lines drown the walls out.
const LINE_TYPES = [
  {k:'call_wall', label:'Call walls',   col:'#e8615f', on:true,  style:0},
  {k:'put_wall',  label:'Put walls',    col:'#46b87a', on:true,  style:0},
  {k:'max_pain',  label:'Max pain',     col:'#ddc551', on:true,  style:2},
  {k:'gex_flip',  label:'GEX flip',     col:'#a68ae8', on:true,  style:1},
  {k:'gamma_flip',label:'Gamma flip',   col:'#54a8de', on:false, style:1},
  {k:'charm_flip',label:'Charm flip',   col:'#e8963c', on:false, style:1},
  {k:'vanna_flip',label:'Vanna flip',   col:'#a68ae8', on:false, style:1},
  {k:'exp_move',  label:'Expected move',col:'#8aa0b4', on:true,  style:1},
  {k:'oi_volume', label:'Volume magnets',col:'#54a8de',on:false, style:1},
];
let LINES_ON = Object.fromEntries(LINE_TYPES.map(t=>[t.k,t.on]));
let _chart=null, _series=null, _priceLines=[], _candleCache={}, _tf='H1';
// Candle refresh. The chart used to be a one-shot render with a permanent cache, so it
// silently showed stale bars for as long as the tab stayed open ("frozen, not refreshing").
// It polls the SAME feed index.html uses (/api/oanda_ohlc5m) - there was never a second
// live feed to adopt, only a missing timer.
const _TF_POLL={M5:30_000,M15:60_000,M30:60_000,H1:180_000,H4:300_000,D:600_000};
let _pollTimer=null, _lastCandleAt=0, _chartToken=0, _pollFails=0;
let _coneSeries=[], CONE_ON=true, BANDS_ON=true, _bandsSubbed=false;

// Every level the chart can draw, from the stored record. Walls come from the same
// near-money selection the export uses, so the chart never shows a level the indicator
// would have filtered out.
function chartLevels(e){
  const out=[], rm=e.refMove?.move;
  const nearOK = s => !(rm>0) || Math.abs(s-e.spot) <= 2.5*rm;
  const add=(price,type,label)=>{ if(Number.isFinite(price)&&price>0) out.push({price,type,label}); };
  ((e.callWalls)||[]).filter(w=>w.tier&&nearOK(w.strike)).slice(0,4)
    .forEach(w=>add(w.strike,'call_wall',`call ${fOI(w.oi)}`));
  ((e.putWalls)||[]).filter(w=>w.tier&&nearOK(w.strike)).slice(0,4)
    .forEach(w=>add(w.strike,'put_wall',`put ${fOI(w.oi)}`));
  add(e.maxPain,'max_pain','max pain');
  add(e.gexFlip,'gex_flip','GEX flip');
  add(e.gammaFlip,'gamma_flip','γ flip');
  add(e.greeksFlow?.charmFlip,'charm_flip','charm');
  add(e.greeksFlow?.vannaFlip,'vanna_flip','vanna');
  add(e.expectedMove?.upper,'exp_move','exp move ↑');
  add(e.expectedMove?.lower,'exp_move','exp move ↓');
  (e.volumeMagnets||[]).slice(0,3).forEach(v=>add(v.strike,'oi_volume',`vol ${fOI(v.volume)}`));
  return out;
}

function drawLines(){
  const e=STORE[SYM]; if(!_series||!e) return;
  _priceLines.forEach(l=>{ try{_series.removePriceLine(l);}catch(_){} });
  _priceLines=[];
  const LSty = window.LightweightCharts ? LightweightCharts.LineStyle : {Solid:0,Dotted:1,Dashed:2};
  const styleOf = n => n===0?LSty.Solid : n===2?LSty.Dashed : LSty.Dotted;
  chartLevels(e).forEach(lv=>{
    const t=LINE_TYPES.find(x=>x.k===lv.type); if(!t||!LINES_ON[lv.type]) return;
    // Chart shows SPOT prices (the candles are spot), so always plot the spot-adjusted
    // value regardless of the page's futures/spot toggle — a futures level drawn on a
    // spot chart would sit in the wrong place by exactly the basis.
    try{
      _priceLines.push(_series.createPriceLine({
        price: lv.price, color: t.col, lineWidth: lv.type.endsWith('_wall')?2:1,
        lineStyle: styleOf(t.style), axisLabelVisible: true, title: lv.label,
      }));
    }catch(_){}
  });
}

// Draw the volatility cone forward from the last candle: P50 dotted, P75 dashed, plus
// the drift centre. This is the SAME cone the touch probabilities are computed from — the
// route returns it rather than the page rebuilding one, so the picture and the percentages
// can never disagree about how wide the distribution is.
function drawCone(){
  _coneSeries.forEach(sr=>{ try{_chart.removeSeries(sr);}catch(_){} });
  _coneSeries=[];
  if(!CONE_ON || !_chart || !REACH?.ok || !REACH.cone?.steps?.length) return;
  const LSty = window.LightweightCharts ? LightweightCharts.LineStyle : {Solid:0,Dotted:1,Dashed:2};
  const defs=[
    {k:'p75Up',col:'#e0a339',w:1,st:LSty.Dashed},
    {k:'p50Up',col:'#46b87a',w:1,st:LSty.Dotted},
    {k:'center',col:'#54a8de',w:2,st:LSty.Solid},
    {k:'p50Dn',col:'#46b87a',w:1,st:LSty.Dotted},
    {k:'p75Dn',col:'#e0a339',w:1,st:LSty.Dashed},
  ];
  // The cone's own step times are M5; the chart may be on H1+. Keep only steps that fall
  // strictly after the last candle so the lines start at the edge and fan out, rather
  // than doubling back over history.
  const lastT = (_candleCache[(OANDA_SYM[SYM]||'')+'|'+_tf]?.rows||[]).slice(-1)[0]?.time || 0;
  const steps = REACH.cone.steps.filter(st=>st.time>lastT);
  if(!steps.length) return;
  for(const d of defs){
    try{
      const sr=_chart.addLineSeries({color:d.col,lineWidth:d.w,lineStyle:d.st,
        priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
      sr.setData(steps.map(st=>({time:st.time,value:st[d.k]})));
      _coneSeries.push(sr);
    }catch(_){}
  }
}

// GEX regime bands as translucent horizontal price zones over the candles. Positions each
// band via priceToCoordinate (clamped to the pane when a boundary is off-screen). Same local
// PIN/BREAKOUT read as the GEX-by-strike panel, now against live price. Repositioned on every
// render/poll + on pan/zoom (visible-range change).
function drawBands(){
  const host=document.getElementById('pxBands'); const e=STORE[SYM];
  if(!host) return;
  host.innerHTML='';
  if(!BANDS_ON || !_series || !e) return;
  const rm=e.refMove?.move;
  if(!(e.spot>0)) return;
  // Band boundaries are stored in SPOT terms; the chart candles are spot, so use spot values
  // (the page's futures/spot toggle only relabels the level readouts, the candles stay spot).
  const lo=rm>0?e.spot-4*rm:e.spot*0.96, hi=rm>0?e.spot+4*rm:e.spot*1.04;
  const bands=regimeBands(e,lo,hi);
  const H=host.clientHeight||0; if(!H) return;
  for(const b of bands){
    if(b.regime==='neutral') continue;
    let yT=_series.priceToCoordinate(b.hi), yB=_series.priceToCoordinate(b.lo);
    if(yT==null) yT=(b.hi>e.spot)?0:H;          // off the top of the pane → clamp to top, else bottom
    if(yB==null) yB=(b.lo>e.spot)?0:H;
    const top=Math.max(0,Math.min(yT,yB)), bot=Math.min(H,Math.max(yT,yB));
    if(bot-top<1) continue;
    const rgb=b.regime==='pin'?'70,184,122':'232,97,95';
    const d=document.createElement('div');
    d.className='pxBand'; d.style.top=top+'px'; d.style.height=(bot-top)+'px';
    d.style.background=`rgba(${rgb},0.07)`;
    host.appendChild(d);
  }
  // Subscribe once so pan/zoom reflows the bands (vertical autoscale is covered by the poll).
  if(!_bandsSubbed && _chart){ try{ _chart.timeScale().subscribeVisibleTimeRangeChange(()=>drawBands()); _bandsSubbed=true; }catch(_){} }
}

async function loadCandles(force){
  const os=OANDA_SYM[SYM]; if(!os) return null;
  const key=os+'|'+_tf;
  // TTL, not a permanent cache. Half the poll interval so a manual re-render between polls
  // still gets fresh bars, but rapid pair-flipping doesn't hammer OANDA.
  const ttl=(_TF_POLL[_tf]||60_000)/2;
  const hit=_candleCache[key];
  if(!force && hit && (Date.now()-hit.at)<ttl) return hit.rows;
  // incomplete=1 keeps the still-forming bar so the last candle moves live rather than
  // only when the bar closes.
  const r=await fetch(`/api/oanda_ohlc5m?symbol=${encodeURIComponent(os)}&granularity=${_tf}&incomplete=1`,{cache:'no-store'});
  if(!r.ok){
    let why=''; try{ why=(await r.json()).error||''; }catch(_){}
    throw new Error(why||('HTTP '+r.status));
  }
  const j=await r.json();
  const rows=(j.values||[]).map(v=>({
    time: Number(v.t), open:+v.open, high:+v.high, low:+v.low, close:+v.close,
  })).filter(c=>Number.isFinite(c.time)&&Number.isFinite(c.close)).sort((a,b)=>a.time-b.time);
  _candleCache[key]={rows,at:Date.now()};
  _lastCandleAt=Date.now();
  return rows;
}

// Status text goes in a SIBLING overlay, never into #pxChart. Writing innerHTML into the
// chart's own host element destroys the Lightweight-Charts canvas while `_chart` still
// points at it, leaving a zombie that silently swallows every later setData - which is
// exactly why one failed timeframe (M15 and H4 both 400'd server-side) wedged the chart
// until F5.
function chartMsg(html){
  const m=document.getElementById('pxMsg'); if(!m) return;
  m.innerHTML = html ? `<div class="empty">${html}</div>` : '';
  m.style.display = html ? 'flex' : 'none';
}

async function mountChart(force){
  const el=document.getElementById('pxChart');
  if(!el) return;
  if(!window.LightweightCharts){ chartMsg('Chart library did not load.'); return; }
  if(!_chart){
    _chart=LightweightCharts.createChart(el,{
      layout:{background:{color:'#12161c'},textColor:'#a8b1bd',fontSize:12},
      grid:{vertLines:{color:'#1d232b'},horzLines:{color:'#1d232b'}},
      rightPriceScale:{borderColor:'#333b46',scaleMargins:{top:.12,bottom:.12}},
      timeScale:{borderColor:'#333b46',timeVisible:true,secondsVisible:false},
      crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
      autoSize:true,
    });
    _series=_chart.addCandlestickSeries({upColor:'#46b87a',downColor:'#e8615f',
      borderUpColor:'#46b87a',borderDownColor:'#e8615f',wickUpColor:'#46b87a',wickDownColor:'#e8615f'});
  }
  // Guard against a slow fetch for a pair the user already navigated away from landing on
  // the chart after a newer one (switching pairs quickly used to interleave responses).
  const token=++_chartToken;
  chartMsg('');
  try{
    const rows=await loadCandles(force);
    if(token!==_chartToken) return;                       // superseded by a later switch
    if(!rows||!rows.length){ chartMsg('No candles for this instrument.'); return; }
    _series.setData(rows);
    // Only auto-fit on the FIRST paint for a given pair/timeframe; refitting on every poll
    // would yank the view back while you are looking at it.
    if(force!=='poll') _chart.timeScale().fitContent();
    drawLines();
    drawCone();
    drawBands();
    _pollFails=0;
    paintAge();
  }catch(err){
    if(token!==_chartToken) return;
    chartMsg(`Candles failed: ${esc(err.message)} <button class="btn" id="pxRetry">Retry</button>`);
    const rb=document.getElementById('pxRetry');
    if(rb) rb.onclick=()=>mountChart(true);
    _pollFails++;
  }finally{
    // ALWAYS reschedule (unless superseded). Scheduling only on success meant one transient
    // network blip stopped the chart refreshing for the rest of the session - i.e. the exact
    // "it looks frozen" symptom this polling was added to remove. Backs off on repeated
    // failures so a persistently dead endpoint isn't hammered at the base interval.
    if(token===_chartToken) schedulePoll();
  }
}

// "Updated Ns ago" beside the timeframe buttons. Without it there is no way to tell a live
// chart from a stalled one by looking at it - a stale chart and a quiet market look
// identical, which is what made the original behaviour so confusing. Turns red once the
// data is well past its expected refresh.
function paintAge(){
  const el=document.getElementById('pxAge'); if(!el) return;
  if(!_lastCandleAt){ el.textContent=''; return; }
  const sec=Math.round((Date.now()-_lastCandleAt)/1000);
  el.textContent = sec<60 ? `updated ${sec}s ago` : `updated ${Math.round(sec/60)}m ago`;
  el.style.color = sec > (_TF_POLL[_tf]||60000)/1000*2.5 ? '#e8615f' : '';
}
setInterval(paintAge, 5000);

// Poll the candle feed so the chart stays live. Paused while the tab is hidden (no point
// burning OANDA calls against a chart nobody is looking at) and resumed on focus with an
// immediate refresh, so coming back to the tab never shows a stale bar.
function schedulePoll(){
  clearTimeout(_pollTimer);
  if(document.hidden) return;
  const base=_TF_POLL[_tf]||60_000;
  const wait=_pollFails ? Math.min(base*Math.pow(2,Math.min(_pollFails,4)), 10*60_000) : base;
  _pollTimer=setTimeout(()=>mountChart('poll'), wait);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) clearTimeout(_pollTimer); else mountChart('poll');
});

function chartToolbar(){
  const tf=['M5','M15','M30','H1','H4','D'].map(t=>`<button class="btn tfb ${t===_tf?'on':''}" data-tf="${t}">${t}</button>`).join('');
  const toggles=LINE_TYPES.map(t=>`<label class="ltog ${LINES_ON[t.k]?'on':''}" data-lk="${t.k}">
    <span class="sw" style="background:${LINES_ON[t.k]?t.col:'transparent'};border-color:${t.col}"></span>${t.label}</label>`).join('');
  const cone=`<label class="ltog ${CONE_ON?'on':''}" id="coneTog"><span class="sw" style="background:${CONE_ON?'#54a8de':'transparent'};border-color:#54a8de"></span>Vol cone</label>`;
  const bnds=`<label class="ltog ${BANDS_ON?'on':''}" id="bandTog" title="Shade the chart by LOCAL gamma regime — PIN (green, ranges hold) vs BREAKOUT (red, breaks run) — resolved by price zone from the zero-gamma crossings, not one net-GEX tint."><span class="sw" style="background:${BANDS_ON?'#46b87a':'transparent'};border-color:#46b87a"></span>Regime bands</label>`;
  return `<div class="ctl"><div class="tfs">${tf}<span id="pxAge" class="pxage"></span></div><div class="ltogs">${toggles}${cone}${bnds}</div></div>`;
}

function wireChartToolbar(){
  document.querySelectorAll('.tfb').forEach(b=>b.onclick=()=>{
    if(_tf===b.dataset.tf) return;
    _tf=b.dataset.tf; clearTimeout(_pollTimer); render();
  });
  const ct=document.getElementById('coneTog');
  if(ct) ct.onclick=()=>{ CONE_ON=!CONE_ON; ct.classList.toggle('on',CONE_ON);
    ct.querySelector('.sw').style.background=CONE_ON?'#54a8de':'transparent';
    if(CONE_ON && !REACH?.ok) loadReach(); else drawCone(); };
  const bt=document.getElementById('bandTog');
  if(bt) bt.onclick=()=>{ BANDS_ON=!BANDS_ON; bt.classList.toggle('on',BANDS_ON);

  document.querySelectorAll('.ltog').forEach(l=>l.onclick=()=>{

}


// Delegated hover, so re-rendering the page never loses the tooltips.
(function(){
  const tipEl = () => document.getElementById('tip');
  document.addEventListener('mouseover', ev => {
    const ic = ev.target.closest && ev.target.closest('.h'); if(!ic) return;
    const d = HELP[ic.dataset.k]; if(!d) return;
    const t = tipEl();
    t.innerHTML = `<b>${d[0]}</b><br>${d[1]}` + (d[2] ? `<em>${d[2]}</em>` : '');
    t.style.display = 'block';
    const r = ic.getBoundingClientRect(), tr = t.getBoundingClientRect();
    let left = r.left + r.width/2 - tr.width/2;
    left = Math.max(10, Math.min(left, window.innerWidth - tr.width - 10));
    // Prefer above; flip below when there isn't room, so it is never cut off.
    const top = (r.top - tr.height - 10 < 8) ? r.bottom + 10 : r.top - tr.height - 10;
    t.style.left = left + 'px'; t.style.top = top + 'px';
  });
  document.addEventListener('mouseout', ev => {
    if (ev.target.closest && ev.target.closest('.h')) tipEl().style.display = 'none';
  });
})();

// ── REACHABILITY panel ───────────────────────────────────────────────────────
// Fetched on demand (it runs a Monte Carlo server-side, so it is not part of the page
// load). Shows the CALIBRATED probability that price touches each wall, the first-touch
// race, and the reliability curve the correction came from — the curve is on screen next
// to the numbers deliberately, because a probability shown without its accuracy invites
// exactly the over-trust the raw version would have earned.
let REACH = null, REACH_H = 12, REACH_BUSY = false;

async function loadReach(){
  if(REACH_BUSY) return; REACH_BUSY = true;
  const host = document.getElementById('reachBody');
  if(host) host.innerHTML = '<div class="empty">Running Monte Carlo…</div>';
  try{
    const r = await fetch(`/api/oi-reachability?pair=${encodeURIComponent(SYM)}&h=${REACH_H}`,{cache:'no-store'});
    REACH = await r.json();
  }catch(err){ REACH = {ok:false, error:err.message}; }
  REACH_BUSY = false;
  const h2 = document.getElementById('reachBody');
  if(h2) h2.innerHTML = reachPanel(STORE[SYM], false);
  drawCone();   // the fetch is what supplies the envelope
}

function reachPanel(e, big){
  if(!REACH) return `<div class="empty">Probability that price TOUCHES each wall, from the volatility cone.<br>
    <button class="btn" style="margin-top:12px" onclick="loadReach()">Run for ${esc(nm(SYM))}</button></div>`;
  if(!REACH.ok) return `<div class="empty">Could not compute: ${esc(REACH.error||'unknown')}<br>
    <button class="btn" style="margin-top:12px" onclick="loadReach()">Retry</button></div>`;
  if(REACH.pair && norm(REACH.pair)!==norm(SYM))
    return `<div class="empty">Loaded for ${esc(REACH.pair)}, not ${esc(nm(SYM))}.<br>
      <button class="btn" style="margin-top:12px" onclick="loadReach()">Run for ${esc(nm(SYM))}</button></div>`;

  const c=REACH.calibration||{}, race=REACH.race, d=REACH.density;
  const hsel=[12,48].map(hh=>`<button class="btn ${hh===REACH_H?'on':''}" onclick="REACH_H=${hh};loadReach()">${hh===12?'1h':'4h'}</button>`).join('');

  // Reliability curve: predicted (x) vs realised (y). The diagonal is perfect.
  let curveSvg='';
  if(Array.isArray(c.curve)&&c.curve.length>1){
    const W=340,Hh=big?300:190,P=30;
    const X=v=>P+v*(W-2*P), Y=v=>Hh-P-v*(Hh-1.6*P);
    curveSvg=`<svg viewBox="0 0 ${W} ${Hh}" style="max-width:${W}px">
      <line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="var(--tx3)" stroke-width="1" stroke-dasharray="3 3"/>
      <path d="${c.curve.map((p,i)=>(i?'L':'M')+X(p[0])+' '+Y(p[1])).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2"/>
      ${c.curve.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.5" fill="var(--acc)"/>`).join('')}
      <text class="lbl" x="${P}" y="${Hh-8}">raw 0%</text>
      <text class="lbl" x="${W-P}" y="${Hh-8}" text-anchor="end">raw 100%</text>
      <text class="lbl" x="${P-6}" y="${Y(1)+4}" text-anchor="end">100%</text>
      <text class="lbl" x="${P-6}" y="${Y(0)+4}" text-anchor="end">0%</text>
    </svg>
    <div class="note">Amber = what the model's raw number actually delivers. Grey diagonal = a perfect model.
      It sags far below the diagonal at the top: <b>raw 94% really means about 68%</b>. The numbers below are
      already corrected by this curve, so read them as-is. Correction verified out of sample to
      <b>±${c.oosErrPp}pp</b>${c.exact?'':' (curve measured at a different horizon — treat as approximate)'}.</div>`;
  }

  const bar = p => {
    const w=Math.round(p*100);
    const col = p>=0.5?'var(--call)':p>=0.25?'var(--warn)':'var(--tx3)';
    return `<span class="bar" style="width:${w}px;background:${col};opacity:.75"></span>`;
  };
  const rows=(REACH.walls||[]).map(w=>{
    const mins=Number.isFinite(w.medBarsToTouch)?(w.medBarsToTouch*5):null;
    const col=w.type==='call_wall'?'var(--call)':w.type==='put_wall'?'var(--put)':'var(--pain)';
    return `<tr><td style="color:${col}">${fx(w.price,SYM)}</td>
      <td class="muted">${esc((w.type||'').replace('_',' '))}</td>
      <td><b>${(w.calibrated*100).toFixed(0)}%</b></td>
      <td style="width:110px">${bar(w.calibrated)}</td>
      <td class="muted">${(w.raw*100).toFixed(0)}%</td>
      <td class="muted">${mins!=null?(mins<60?mins+'m':(mins/60).toFixed(1)+'h'):'—'}</td></tr>`;
  }).join('');

  const raceHtml = race ? `<table style="margin-top:6px"><tbody>
    <tr><td class="muted">Reaches the wall ABOVE first</td><td><b>${(race.upFirst*100).toFixed(0)}%</b></td>
      <td class="muted">${race.medBarsUp!=null?'median '+(race.medBarsUp*5)+'m':''}</td></tr>
    <tr><td class="muted">Reaches the wall BELOW first</td><td><b>${(race.downFirst*100).toFixed(0)}%</b></td>
      <td class="muted">${race.medBarsDown!=null?'median '+(race.medBarsDown*5)+'m':''}</td></tr>
    <tr><td class="muted">Touches neither</td><td><b>${(race.neither*100).toFixed(0)}%</b></td><td></td></tr>
    </tbody></table>
    <div class="note">Which wall price gets to FIRST — not the same as two separate touch odds, which carry no
      ordering and can sum past 100%. These are raw path frequencies: the single-barrier calibration above does
      not transfer to a race, so treat them as relative, not exact.</div>` : '';

  // Visit density — where paths DWELL. The well-posed version of "most touched path",
  // which is degenerate here: under a driftless cone the modal path is flat, always.
  let densHtml='';
  if(d&&d.bins?.length){
    const rowsD=d.bins.slice().reverse();
    const Wd=300, rh=big?9:6;
    densHtml=`<svg viewBox="0 0 ${Wd} ${rowsD.length*rh+16}" style="margin-top:4px">
      ${rowsD.map((b,i)=>`<rect x="0" y="${i*rh}" width="${(b.rel*(Wd-70)).toFixed(1)}" height="${rh-1}"
        fill="${Math.abs(b.mid-d.anchor)<d.binWidth?'var(--acc)':'var(--vol)'}" opacity=".8"/>`).join('')}
      <text class="lbl" x="${Wd-66}" y="10">${fx(d.hi,SYM)}</text>
      <text class="lbl" x="${Wd-66}" y="${rowsD.length*rh}">${fx(d.lo,SYM)}</text>
    </svg>
    <div class="note">Time the ${d.nPaths} simulated paths spend at each price. Amber band = spot. Mass piles up
      around spot, which is why a single "most likely path" is not a real thing — the modal path in a driftless
      cone is flat for every instrument, every time.</div>`;
  }

  return `<div style="display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <span class="muted" style="font-size:12.5px">Horizon</span>${hsel}
      <span class="muted" style="font-size:12px;margin-left:auto">${REACH.bars} bars · ${REACH.horizonMin}min ahead</span>
      <button class="btn" onclick="loadReach()">↻</button></div>
    <div class="rgrid">
      <div><h4>Probability of touch</h4>
        <table><thead><tr><th>Wall</th><th>Type</th><th>P(touch)</th><th></th><th>raw</th><th>median</th></tr></thead>
        <tbody>${rows}</tbody></table>
        <div class="note"><b>P(touch)</b> is the chance price trades at that level at least once within the
          horizon — a wick counts. It says nothing about whether the wall then HOLDS.</div>
        ${raceHtml}</div>
      <div><h4>Where paths dwell</h4>${densHtml}</div>
      <div><h4>Is the probability trustworthy?</h4>${curveSvg}</div>
    </div>`;
}
const norm = x => String(x||'').toLowerCase().replace(/[/_]/g,'');

async function load(){
  // /api/oi-store = the KV oi_store with each gexProfile self-healed (rebuilt from the
  // stored raw paste if the localStorage quota-trim shed it), so the OI-by-strike chart
  // and gamma-flip never come up blank for a trimmed pair. Falls back to the raw KV key.
  let r = await fetch('/api/oi-store',{cache:'no-store'});
  if(!r.ok) r = await fetch('/api/kv/get?key=oi_store',{cache:'no-store'});
  if(!r.ok) throw new Error('KV '+r.status);
  const j = await r.json();
  STORE = j.data || j.value || {};
}

function ageOf(e){
  if(!e?.savedAtMs) return {h:null,cls:'none',txt:'no data'};
  const h=(Date.now()-e.savedAtMs)/36e5;
  return {h, cls: h<12?'':(h<36?'old':'old'), txt: h<1?Math.round(h*60)+'m':Math.round(h)+'h'};
}

function renderRail(){
  const keys=Object.keys(STORE);
  document.getElementById('rail').innerHTML = keys.map(k=>{
    const a=ageOf(STORE[k]);
    return `<button class="${k===SYM?'on':''} ${a.h>36?'stale':''}" data-k="${esc(k)}">
      <span class="dot ${a.cls}"></span>${esc(nm(k))}<span class="muted">${a.txt}</span></button>`;
  }).join('');
  document.querySelectorAll('#rail button').forEach(b=>b.onclick=()=>{
    if(SYM===b.dataset.k) return;
    // Cancel any in-flight poll for the OLD pair before switching, so its response can't
    // land on the new pair's chart.
    clearTimeout(_pollTimer); _chartToken++;
    SYM=b.dataset.k; render();
  });
}

// OI by strike. Reads callOI/putOI off gexProfile — the only CONTIGUOUS per-strike
// record stored. This chart came out BLANK because those fields did not exist there
// (gexProfile held only the gamma-weighted values), so every bar had zero width.
// topLevels is a top-N ranking rather than a ladder, so it is only the fallback for
// records saved before callOI/putOI were added.
function chartOI(e,big){
  let rows=(e.gexProfile||[]).filter(r=>Number.isFinite(r.strike)&&(Number.isFinite(r.callOI)||Number.isFinite(r.putOI)));
  let src='full ladder';
  if(!rows.length){
    rows=(e.topLevels||[]).filter(r=>Number.isFinite(r.strike));
    src='top strikes only — press Analyse to store the full ladder';
  }
  if(rows.length<2) return '<div class="empty">No per-strike open interest stored.<br>Press <b>Analyse</b> on this pair to populate it.</div>';
  const spot=e.spot, rm=e.refMove?.move;
  const lo=rm>0?spot-4*rm:-Infinity, hi=rm>0?spot+4*rm:Infinity;
  let win=rows.filter(r=>r.strike>=lo&&r.strike<=hi);
  if(win.length<3) win=rows.slice();                       // window too tight → show everything
  win=win.filter(r=>(r.callOI||0)+(r.putOI||0)>0);
  if(!win.length) return '<div class="empty">Every strike in the focus window has zero open interest.</div>';
  // Keep the strikes NEAREST SPOT, then sort for display. Sorting descending first and
  // slicing kept the 44 HIGHEST strikes instead: gold's +-4x refMove window holds 427
  // strikes, so the chart rendered 5429-5799 against a 4644 spot and never drew the spot
  // line at all. The sort below is for the top-down price axis; it must not decide WHICH
  // strikes survive.
  const _cap = big?90:44;
  if(win.length>_cap) win = win.slice()
    .sort((a,b)=>Math.abs(a.strike-spot)-Math.abs(b.strike-spot)).slice(0,_cap);
  win.sort((a,b)=>b.strike-a.strike);
  const maxOI=Math.max(...win.map(r=>Math.max(r.callOI||0,r.putOI||0)),1);
  const rowH=big?24:18, W=1000, H=Math.max(120,win.length*rowH), MID=W*0.5, HALF=W*0.35;
  let s=`<svg viewBox="0 0 ${W} ${H+28}">`;
  win.forEach((r,i)=>{
    const y=i*rowH+3, bh=rowH-5;
    const c=(r.callOI||0)/maxOI*HALF, p=(r.putOI||0)/maxOI*HALF;
    if(p>0.6) s+=`<rect x="${MID-p}" y="${y}" width="${p}" height="${bh}" fill="var(--put)" opacity=".85" rx="1"/>`;
    if(c>0.6) s+=`<rect x="${MID}" y="${y}" width="${c}" height="${bh}" fill="var(--call)" opacity=".85" rx="1"/>`;
    s+=`<text class="lbl" x="${MID}" y="${y+bh-2}" text-anchor="middle" style="fill:var(--tx);font-size:${big?12:10.5}px">${fx(show(r.strike,e),SYM)}</text>`;
    if((r.putOI||0)>maxOI*0.22) s+=`<text class="lbl" x="${MID-p-7}" y="${y+bh-2}" text-anchor="end" style="fill:var(--put)">${fOI(r.putOI)}</text>`;
    if((r.callOI||0)>maxOI*0.22) s+=`<text class="lbl" x="${MID+c+7}" y="${y+bh-2}" style="fill:var(--call)">${fOI(r.callOI)}</text>`;
  });
  const si=win.findIndex(r=>r.strike<=spot);
  if(si>=0){ const y=si*rowH; s+=`<line class="spotline" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`
    + `<text class="lbl" x="4" y="${y-5}" style="fill:var(--acc)">spot ${fx(show(spot,e),SYM)}</text>`; }
  s+=`<line class="axis" x1="${MID}" y1="0" x2="${MID}" y2="${H}"/>`
   + `<text class="lbl" x="${MID-HALF}" y="${H+19}" style="fill:var(--put)">&#9664; PUTS &middot; support</text>`
   + `<text class="lbl" x="${MID+HALF}" y="${H+19}" text-anchor="end" style="fill:var(--call)">CALLS &middot; resistance &#9654;</text></svg>`;
  return s+`<div class="note">${win.length} strikes &middot; ${src}. A tall bar is a wall. Amber dashes mark spot.</div>`;
}

function chartGEX(e,big){
  const gp=(e.gexProfile||[]).filter(r=>Number.isFinite(r.netGex)&&Number.isFinite(r.strike));
  if(gp.length<2) return '<div class="empty">No GEX profile stored.</div>';
  const rm=e.refMove?.move, spot=e.spot;
  const lo=rm>0?spot-4*rm:-Infinity, hi=rm>0?spot+4*rm:Infinity;
  let rows=gp.filter(r=>r.strike>=lo&&r.strike<=hi); if(rows.length<3) rows=gp.slice();
  rows.sort((a,b)=>a.strike-b.strike);
  const W=1000,H=big?400:230,P=36;
  const mn=rows[0].strike, mx=rows[rows.length-1].strike;
  const mg=Math.max(...rows.map(r=>Math.abs(r.netGex)),1);
  const X=v=>P+(v-mn)/(mx-mn||1)*(W-2*P), Y=v=>H/2-(v/mg)*(H/2-16);
  let s=`<svg viewBox="0 0 ${W} ${H+24}">`;
  // Regime bands FIRST (behind the bars): where along price the book is PIN (long gamma, fade
  // extremes) vs BREAKOUT (short gamma, don't fade) — the local read the net-GEX scalar hides.
  const bands=regimeBands(e,mn,mx);
  bands.forEach(b=>{ const x1=X(Math.max(b.lo,mn)), x2=X(Math.min(b.hi,mx));
    const col=b.regime==='pin'?'var(--call)':b.regime==='breakout'?'var(--put)':'var(--tx3)';
    if(x2>x1) s+=`<rect x="${x1}" y="4" width="${x2-x1}" height="${H-8}" fill="${col}" opacity=".08"/>`;
    if(b.regime!=='neutral'&&x2-x1>34) s+=`<text class="lbl" x="${(x1+x2)/2}" y="${H-6}" text-anchor="middle" style="fill:${col};opacity:.7;font-size:10px;letter-spacing:.08em">${b.regime==='pin'?'PIN':'BREAKOUT'}</text>`;});
  s+=`<line class="axis" x1="${P}" y1="${H/2}" x2="${W-P}" y2="${H/2}"/>`;
  const bw=Math.max(2,(W-2*P)/rows.length-1.5);
  rows.forEach(r=>{const yv=Y(r.netGex);
    s+=`<rect x="${X(r.strike)-bw/2}" y="${Math.min(yv,H/2)}" width="${bw}" height="${Math.abs(H/2-yv)}" fill="${r.netGex>=0?'var(--call)':'var(--put)'}" opacity=".82" rx="1"/>`;});
  [[e.gexFlip,'var(--gam)','GEX flip'],[e.gammaFlip,'var(--vol)','gamma flip'],[spot,'var(--acc)','spot']]
  .forEach(([v,c,t])=>{ if(!Number.isFinite(v)||v<mn||v>mx) return;
    s+=`<line x1="${X(v)}" y1="6" x2="${X(v)}" y2="${H-6}" stroke="${c}" stroke-width="1.4" stroke-dasharray="4 4"/>`
     + `<text class="lbl" x="${X(v)+5}" y="18" style="fill:${c}">${t}</text>`;});
  s+=`<text class="lbl" x="${P}" y="${H+18}">${fx(show(mn,e),SYM)}</text>`
   + `<text class="lbl" x="${W/2}" y="${H+18}" text-anchor="middle" style="fill:var(--tx3)">strike &rarr;</text>`
   + `<text class="lbl" x="${W-P}" y="${H+18}" text-anchor="end">${fx(show(mx,e),SYM)}</text></svg>`;
  const spotReg=regimeAt(e,spot,mn,mx);
  const spotNote=spotReg==='pin'?' Spot sits in a <b style="color:var(--call)">PIN</b> zone — long dealer gamma, fade extremes toward max pain.'
    :spotReg==='breakout'?' Spot sits in a <b style="color:var(--put)">BREAKOUT</b> zone — short dealer gamma, breaks run, don\'t fade.':'';
  return s+`<div class="note">Bars above the line are call-dominated gamma, below are put-dominated. Shaded <b style="color:var(--call)">green = PIN</b> (long gamma, ranges hold), <b style="color:var(--put)">red = BREAKOUT</b> (short gamma, moves run) — the regime is <b>local</b>, flipping at each zero-gamma crossing, not one net-GEX number for the whole book.${spotNote}</div>`;
}

function chartSmile(e,big){
  const sm=e.ivSmile;
  if(!sm||!Array.isArray(sm.strikes)||!sm.strikes.length)
    return '<div class="empty">No per-strike implied vol stored.<br>Paste the <b>per-strike chain</b> into the smile box to draw this.</div>';
  const pts=sm.strikes.map((k,i)=>({k,iv:sm.iv?.[i],pv:sm.ivPrior?.[i]})).filter(p=>p.iv>0).sort((a,b)=>a.k-b.k);
  if(pts.length<3) return '<div class="empty">Smile has too few valid points.</div>';
  const W=1000,H=big?420:250,P=48;
  const mn=pts[0].k,mx=pts[pts.length-1].k;
  const all=pts.flatMap(p=>[p.iv,p.pv]).filter(v=>v>0);
  const lo=Math.min(...all),hi=Math.max(...all);
  const X=v=>P+(v-mn)/(mx-mn||1)*(W-2*P), Y=v=>H-P-(v-lo)/((hi-lo)||1)*(H-1.8*P);
  const path=key=>pts.filter(p=>p[key]>0).map((p,i)=>(i?'L':'M')+X(p.k)+' '+Y(p[key])).join(' ');
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=4;i++){const y=P*0.75+i*(H-1.8*P)/4; s+=`<line class="gl" x1="${P}" y1="${y}" x2="${W-P}" y2="${y}"/>`;}
  const pp=path('pv'); if(pp) s+=`<path d="${pp}" fill="none" stroke="var(--tx3)" stroke-width="1.6" stroke-dasharray="4 4"/>`;
  s+=`<path d="${path('iv')}" fill="none" stroke="var(--vol)" stroke-width="2.4"/>`;
  if(Number.isFinite(e.spot)&&e.spot>=mn&&e.spot<=mx)
    s+=`<line class="spotline" x1="${X(e.spot)}" y1="${P*0.6}" x2="${X(e.spot)}" y2="${H-P}"/>`
     + `<text class="lbl" x="${X(e.spot)+5}" y="${P*0.6+13}" style="fill:var(--acc)">spot</text>`;
  s+=`<text class="lbl" x="${P}" y="${H-P+21}">${fx(show(mn,e),SYM)}</text>`
   + `<text class="lbl" x="${W-P}" y="${H-P+21}" text-anchor="end">${fx(show(mx,e),SYM)}</text>`
   + `<text class="lbl" x="${P-9}" y="${P*0.75+4}" text-anchor="end">${(hi*100).toFixed(1)}%</text>`
   + `<text class="lbl" x="${P-9}" y="${H-P+4}" text-anchor="end">${(lo*100).toFixed(1)}%</text>`
   + `<text class="lbl" x="${W-P}" y="${P*0.5}" text-anchor="end" style="fill:var(--vol)">&mdash; today</text>`
   + `<text class="lbl" x="${W-P}" y="${P*0.5+17}" text-anchor="end" style="fill:var(--tx3)">&middot;&middot; prior settle</text></svg>`;
  return s+`<div class="note">Vol is lowest at the money and rises at both wings — the market pays up for tail protection. A steeper LEFT wing means demand for downside puts.</div>`;
}

function chartTerm(e,big){
  const ts=e.ivTermStructure&&e.ivTermStructure.points;
  if(!ts||ts.length<2) return '<div class="empty">No IV term structure stored.<br>Paste the <b>Settlements</b> table to draw this.</div>';
  const d=ts.filter(p=>p.iv>0).sort((a,b)=>a.dte-b.dte);
  if(d.length<2) return '<div class="empty">Too few expiries with vol.</div>';
  const W=1000,H=big?380:240,P=48;
  const mn=d[0].dte,mx=d[d.length-1].dte, lo=Math.min(...d.map(p=>p.iv)), hi=Math.max(...d.map(p=>p.iv));
  const X=v=>P+(Math.log(1+v-mn)/(Math.log(1+mx-mn)||1))*(W-2*P), Y=v=>H-P-(v-lo)/((hi-lo)||1)*(H-1.8*P);
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=3;i++){const y=P*0.75+i*(H-1.8*P)/3; s+=`<line class="gl" x1="${P}" y1="${y}" x2="${W-P}" y2="${y}"/>`;}
  s+=`<path d="${d.map((p,i)=>(i?'L':'M')+X(p.dte)+' '+Y(p.iv)).join(' ')}" fill="none" stroke="var(--vol)" stroke-width="2.4"/>`;
  d.forEach(p=>{ s+=`<circle cx="${X(p.dte)}" cy="${Y(p.iv)}" r="${big?4:3}" fill="var(--vol)"/>`;
    if(big) s+=`<text class="lbl" x="${X(p.dte)}" y="${Y(p.iv)-12}" text-anchor="middle">${p.dte}d</text>`;});
  s+=`<text class="lbl" x="${P-9}" y="${P*0.75+4}" text-anchor="end">${hi.toFixed(1)}%</text>`
   + `<text class="lbl" x="${P-9}" y="${H-P+4}" text-anchor="end">${lo.toFixed(1)}%</text>`
   + `<text class="lbl" x="${P}" y="${H-P+21}">${mn} DTE</text>`
   + `<text class="lbl" x="${W-P}" y="${H-P+21}" text-anchor="end">${mx} DTE</text>`
   + `<text class="lbl" x="${W/2}" y="${H-P+21}" text-anchor="middle" style="fill:var(--tx3)">days to expiry &rarr;</text></svg>`;
  const sh=e.ivTermStructure.shape||'—';
  return s+`<div class="note"><b>${esc(sh)}</b> — front ${e.ivTermStructure.front?.iv}% to back ${e.ivTermStructure.back?.iv}%. `
    +(sh==='inverted'
      ?'Near-dated vol above far-dated: an event is expected soon, and short-dated levels break more easily.'
      :'Rising with horizon is normal — more time means more uncertainty.')+'</div>';
}

    ['charm flip',e.greeksFlow?.charmFlip,'var(--warn)', e.greeksFlow?'pins price into expiry':'needs IV smile', 'charm'],

// Walls, sortable by STRENGTH or by NEAREST. Those are different questions: the biggest
// wall is not necessarily the one price reaches first, and the near one is the one that
// can actually interact with a trade today. Rows beyond 2.5 reference moves are dimmed
// and tagged "far" rather than hidden — the export filters them out, but seeing them
// here is how you tell an illiquid chain from a filtered one.
function wallTable(e,side){
  let list=((side==='call'?e.callWalls:e.putWalls)||[]).slice();
  if(!list.length) return '<div class="empty">No walls on this side.<br>Either the expiry is illiquid or nothing clears the strength bar.</div>';
  const rm=e.refMove?.move;
  const isFar=r=>rm>0?Math.abs(r.strike-e.spot)>2.5*rm:false;
  list = (SORT==='proximity')
    ? list.sort((a,b)=>Math.abs(a.strike-e.spot)-Math.abs(b.strike-e.spot))
    : list.sort((a,b)=>(b.oi||0)-(a.oi||0));
  list=list.slice(0,12);
  const mx=Math.max(...list.map(w=>w.oi||0),1), col=(side==='call')?'var(--call)':'var(--put)';
  const body=list.map(w=>{
    const d=pips(w.strike,e.spot,SYM), far=isFar(w);
    return `<tr class="${far?'dim':''}"><td>${fx(show(w.strike,e),SYM)}${far?'<span class="pill muted">far</span>':''}</td>`
      + `<td>${fOI(w.oi)}</td>`
      + `<td style="width:110px"><span class="bar" style="width:${(w.oi/mx*95).toFixed(0)}px;background:${col};opacity:.7"></span></td>`
      + `<td class="${w.tier?'':'muted'}">${esc(w.tier||'—')}</td><td class="muted">${w.mult??'—'}</td>`
      + `<td style="color:${w.chg>0?'var(--put)':w.chg<0?'var(--call)':'var(--tx3)'}">${w.chg?(w.chg>0?'+':'')+fOI(w.chg):'—'}</td>`
      + `<td class="muted">${Number.isFinite(d)?(d>=0?'+':'')+d.toFixed(0)+'p':'—'}</td></tr>`;
  }).join('');
  return `<table><thead><tr><th>Strike</th><th>Contracts</th><th></th><th>Strength</th><th>&times; nearby</th><th>vs yest</th><th>From price</th></tr></thead>`
    + `<tbody>${body}</tbody></table>`
    + `<div class="note">Sorted by <b>${SORT==='proximity'?'distance from price':'strength'}</b> — switch with the Walls button in the header. Dimmed <b>far</b> rows sit beyond 2.5 reference moves and are excluded from the chart export.</div>`;
}
