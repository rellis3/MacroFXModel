<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NQ Forecast Target Test</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/index.css">
<style>
#lApp { padding: 0 24px 48px; width: 100%; box-sizing: border-box; max-width: 1200px; margin: 0 auto; }
.l-h { display: flex; align-items: center; gap: 14px; padding: 16px 0 10px; border-bottom: 1.5px solid var(--border); flex-wrap: wrap; }
.l-title { font-size: 17px; font-weight: 700; color: var(--text); } .l-sub { font-size: 10.5px; color: var(--text3); font-family: 'DM Mono', monospace; }
.note { margin: 10px 0; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--s1); font-size: 12px; color: var(--text2); line-height: 1.6; }
.note b { color: var(--text); }
.verdict { border-color: color-mix(in srgb, var(--red) 55%, transparent); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } #lApp { padding: 0 12px 48px; } }
.card { background: var(--s1); border: 1.5px solid var(--border); border-radius: 14px; padding: 12px 14px; min-width: 0; margin-top: 12px; }
.grid .card { margin-top: 0; }
.card h3 { margin: 0 0 6px; font-size: 13px; color: var(--text); font-weight: 700; }
.card .cap { font-size: 11px; color: var(--text3); margin: 0 0 8px; line-height: 1.5; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
.stat { border: 1px solid var(--border); border-radius: 10px; padding: 7px 9px; } .stat .k { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; text-transform: uppercase; }
.stat .v { font-size: 15px; font-weight: 700; color: var(--text); font-family: 'DM Mono', monospace; } .stat .s { font-size: 10.5px; color: var(--text3); font-family: 'DM Mono', monospace; }
.pos { color: var(--green) !important; } .neg { color: var(--red) !important; } .muted { color: var(--text3); }
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 11.5px; }
table.t th, table.t td { padding: 4px 6px; border-bottom: 1px solid var(--border); text-align: right; font-family: 'DM Mono', monospace; color: var(--text2); white-space: nowrap; }
table.t th { color: var(--text3); font-weight: 500; font-size: 10.5px; } table.t td:first-child, table.t th:first-child { text-align: left; }
td.wrap { white-space: normal !important; font-family: 'DM Sans', sans-serif !important; }
svg text { font-family: 'DM Mono', monospace; font-size: 10px; fill: var(--text3); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--text2); margin-top: 4px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
</style>
</head>
<body class="dark">
<div id="lApp">
  <div class="l-h">
    <div><div class="l-title">NQ: can the vol forecast set a profitable target?</div>
      <div class="l-sub">nq-forecast-target-ev · pre-registered 2026-11-02 · 1,550 point-in-time sessions, 2020-08 → 2026-08 · lockbox untouched</div></div>
  </div>
  <div id="root"><div class="note">Loading…</div></div>
</div>
<script type="module">
const D = await (await fetch('./backtest-data/nq-forecast-target/summary.json')).json();
const S = D.strategies, G = D.gate;
const f = (x, d = 3) => x == null ? '–' : (x > 0 ? '+' : '') + x.toFixed(d);
const pc = x => (x * 100).toFixed(1) + '%';
const usd = x => (x < 0 ? '−$' : '$') + Math.abs(Math.round(x)).toLocaleString();
const cls = x => x > 0 ? 'pos' : x < 0 ? 'neg' : '';
const NAMES = { P1: 'P1 · target O→C p75', S1: 'S1 · target O→C p50', S2: 'S2 · target O→H p75', S3: 'S3 · P1 + O→L p75 stop',
  B1: 'B1 · open → 22:00, no target', B1_stop: 'B1 + same stop', B2: 'B2 · trailing-quantile target', B3: 'B3 · ATR target' };
const COL = { P1: 'var(--blue)', S2: '#a78bfa', B1: 'var(--green)', B2: 'var(--amber, #e0a32e)', B3: 'var(--text3)' };

function equity() {
  const E = D.equity, keys = ['P1', 'S2', 'B1', 'B2', 'B3'], W = 760, H = 260, L = 56, R = 10, T = 10, Bm = 24;
  const all = keys.flatMap(k => E[k]); const lo = Math.min(0, ...all), hi = Math.max(...all);
  const x = i => L + i / (E.d.length - 1) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - Bm);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v >= 0 ? '' : '−'}$${Math.abs(Math.round(v / 1000))}k</text>`; }
  let lastY = '';
  E.d.forEach((d, i) => { const yy = d.slice(0, 4); if (yy !== lastY) { lastY = yy; g += `<text x="${x(i)}" y="${H - 6}">${yy}</text>`; } });
  const lines = keys.map(k => `<polyline fill="none" stroke="${COL[k]}" stroke-width="${k === 'P1' ? 2.2 : 1.4}" points="${E[k].map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumulative profit per NQ contract">${g}${lines}</svg>
    <div class="legend">${keys.map(k => `<span><i style="background:${COL[k]}"></i>${NAMES[k]}</span>`).join('')}</div>`;
}

function diffBars() {
  const rows = [['P1 − B1 (no target)', G['P1-B1']], ['P1 − B2 (trailing quantile)', G['P1-B2']], ['P1 − B3 (ATR)', G['P1-B3']],
    ['S2 − B3 (O→H p75 vs ATR)', G['S2-B3']], ['S3 − B1 with same stop', G['S3-B1_stop']]];
  const W = 760, rh = 30, L = 220, R = 20, lo = -0.06, hi = 0.04, H = rows.length * rh + 26;
  const x = v => L + (v - lo) / (hi - lo) * (W - L - R);
  let s = `<line x1="${x(0)}" x2="${x(0)}" y1="4" y2="${H - 20}" stroke="var(--text3)" stroke-dasharray="3 3"/>`;
  for (const v of [-0.06, -0.04, -0.02, 0, 0.02, 0.04]) s += `<text x="${x(v)}" y="${H - 6}" text-anchor="middle">${v > 0 ? '+' : ''}${v.toFixed(2)}%</text>`;
  rows.forEach(([n, g], i) => {
    const yy = 14 + i * rh, c = g.hi < 0 ? 'var(--red)' : g.lo > 0 ? 'var(--green)' : 'var(--blue)';
    s += `<text x="0" y="${yy + 4}" style="fill:var(--text2)">${n}</text><line x1="${x(g.lo)}" x2="${x(g.hi)}" y1="${yy}" y2="${yy}" stroke="${c}" stroke-width="3" stroke-linecap="round"/><circle cx="${x(g.mean)}" cy="${yy}" r="4.5" fill="${c}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Paired differences with 95% intervals">${s}</svg>`;
}

function reachChart() {
  const a = D.partB_hl.reach_hour_p50.by_hour_cum, b = D.partB_hl.reach_hour_p75.by_hour_cum, W = 760, H = 200, L = 40, R = 10, T = 10, Bm = 22;
  const x = h => L + (h - 1) / 21 * (W - L - R), y = v => T + (1 - v / 0.6) * (H - T - Bm);
  let g = '';
  for (const v of [0, 0.2, 0.4, 0.6]) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v * 100}%</text>`;
  for (const h of [1, 4, 8, 12, 15, 18, 22]) g += `<text x="${x(h)}" y="${H - 6}" text-anchor="middle">${String(h).padStart(2, '0')}:00</text>`;
  g += `<line x1="${x(14.5)}" x2="${x(14.5)}" y1="${T}" y2="${H - Bm}" stroke="var(--text3)" stroke-dasharray="2 3"/><text x="${x(14.5) + 4}" y="${T + 10}">US cash open</text>`;
  const pl = (v, c) => `<polyline fill="none" stroke="${c}" stroke-width="2" points="${v.map((p, i) => `${x(i + 1)},${y(p)}`).join(' ')}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Share of sessions whose range has reached the forecast by each London hour">${g}${pl(a, 'var(--blue)')}${pl(b, '#a78bfa')}</svg>
    <div class="legend"><span><i style="background:var(--blue)"></i>range ≥ H→L p50</span><span><i style="background:#a78bfa"></i>range ≥ H→L p75</span></div>`;
}

const P = S.P1, B1 = S.B1;
const strat = ['P1', 'S1', 'S2', 'S3', 'B1', 'B1_stop', 'B2', 'B3'];
const row = (lab, fn) => `<tr><td>${lab}</td>${strat.map(k => `<td>${fn(S[k], k)}</td>`).join('')}</tr>`;
const years = Object.keys(D.by_year.P1);
const A = D.partA_oc, Bh = D.partB_hl;

document.getElementById('root').innerHTML = `
<div class="note verdict"><b>Answer: no.</b> Buying NQ at the London open and taking profit at the forecast’s open-to-close p75 made
<b>${f(P.exp_pct)}% a trade (${usd(P.exp_usd_nq)} per NQ contract)</b>, which is not significant (95% range ${f(P.lo)} to ${f(P.hi)}%).
That small profit was Nasdaq’s upward drift. Simply holding from the open to 22:00 made <b>${f(B1.exp_pct)}%</b>, so the forecast target
<b>lowered</b> the result (${f(G['P1-B1'].mean)}%, range ${f(G['P1-B1'].lo)} to ${f(G['P1-B1'].hi)}%). Targets of the same size that use no forecast
(the last year’s typical move, or recent ATR) did just as well, and so did the forecast shuffled between days. Pre-registered gate: <b>0 of 4</b> conditions.
Banked as <b>underpowered</b> by its frozen rule (it rules out a forecast advantage bigger than about 0.02% a trade, but not smaller); <b>decision: reject this construction</b>.</div>

<div class="note"><b>What the forecast numbers are.</b> All are % distances from the 00:00 London open, fixed at the open and built only from earlier data.
<b>Open-to-close</b> is the size of the day’s close-minus-open <i>in either direction</i>: it does not say up or down. <b>High-to-low</b> is the width of the day’s range:
it is not a price level. <b>Open-to-high / open-to-low</b> are the only one-sided lines. So “long to the p75” has to put the unsigned open-to-close size above the open (P1);
the forecast’s own “how far up” number is open-to-high (S2), tested alongside it.</div>

<div class="stats">
  <div class="stat"><div class="k">P1 per trade</div><div class="v ${cls(P.exp_pct)}">${f(P.exp_pct)}%</div><div class="s">${usd(P.exp_usd_nq)} / NQ · t ${P.t.toFixed(1)}</div></div>
  <div class="stat"><div class="k">target hit</div><div class="v">${pc(P.hit_rate)}</div><div class="s">avg target ${P.avg_target_pct.toFixed(2)}%</div></div>
  <div class="stat"><div class="k">win rate</div><div class="v">${pc(P.win_rate)}</div><div class="s">PF ${P.profit_factor.toFixed(2)}</div></div>
  <div class="stat"><div class="k">max drawdown</div><div class="v neg">${usd(P.max_dd_usd_nq)}</div><div class="s">${P.max_dd_pct_avg_notional.toFixed(0)}% of 1 NQ notional</div></div>
  <div class="stat"><div class="k">vs no target</div><div class="v neg">${f(G['P1-B1'].mean)}%</div><div class="s">[${f(G['P1-B1'].lo)}, ${f(G['P1-B1'].hi)}]</div></div>
  <div class="stat"><div class="k">vs shuffled forecast</div><div class="v">${(G.placebo.pctile * 100).toFixed(1)}th pct</div><div class="s">needed ≥ 95th</div></div>
</div>

<div class="card"><h3>Cumulative profit, 1 NQ contract, net of costs</h3>
<p class="cap">Every line is long at the open and flat by 22:00 London. The forecast-target lines (blue, purple) track the plain hold (green) below it and match the non-forecast targets (amber, grey). 2022 is the bear market. Divide by 10 for MNQ.</p>${equity()}</div>

<div class="card"><h3>Does the forecast add anything? Paired differences, % per trade, 95% range</h3>
<p class="cap">Same sessions, same costs. A bar wholly right of zero would mean the forecast helps; red means it hurts. The only clear results are that taking a forecast target hurts against holding to 22:00.</p>${diffBars()}</div>

<div class="card"><h3>Every strategy (net of 0.0068% round trip)</h3><div class="tw"><table class="t">
<tr><th></th>${strat.map(k => `<th>${NAMES[k].split(' · ')[0]}</th>`).join('')}</tr>
${row('what', (s, k) => `<span class="muted">${(NAMES[k].split(' · ')[1] || 'same stop').replace('target ', '')}</span>`)}
${row('expectancy %', s => `<span class="${cls(s.exp_pct)}">${f(s.exp_pct)}</span>`)}
${row('95% range', s => `${f(s.lo, 3)}…${f(s.hi, 3)}`)}
${row('$ / NQ / trade', s => usd(s.exp_usd_nq))}
${row('σ-units / trade', s => f(s.exp_sigma))}
${row('target hit', s => s.hit_rate ? pc(s.hit_rate) : '–')}
${row('stopped', s => s.stop_rate ? pc(s.stop_rate) : '–')}
${row('win rate', s => pc(s.win_rate))}
${row('avg win / loss %', s => `${f(s.avg_win_pct, 2)} / ${f(s.avg_loss_pct, 2)}`)}
${row('profit factor', s => s.profit_factor.toFixed(2))}
${row('Sharpe / Sortino', s => `${s.sharpe.toFixed(2)} / ${s.sortino.toFixed(2)}`)}
${row('max drawdown', s => usd(s.max_dd_usd_nq))}
${row('MFE / MAE σ', s => `${s.avg_mfe_sigma.toFixed(2)} / ${s.avg_mae_sigma.toFixed(2)}`)}
${row('hold, median min', s => s.median_hold_min.toFixed(0))}
${row('without best 10', s => f(s.mean_ex_best10_pct))}
${row('cost 0× / 3×', s => `${f(s.cost_sens['0x'])} / ${f(s.cost_sens['3x'])}`)}
${row('dev / val half', s => `${f(s.halves.dev)} / ${f(s.halves.val)}`)}
</table></div>
<p class="cap" style="margin-top:8px">Holm-adjusted p for the four forecast cells: ${['P1', 'S1', 'S2', 'S3'].map(k => `${k} ${D.profit[k].p_holm.toFixed(2)}`).join(' · ')}. None passes. In every strategy the best 5% of trades make more than the whole total. Short versions (the mirror) all lose about 0.06–0.07% a trade, which is the drift again; the forecast adds nothing on that side either.</p></div>

<div class="card"><h3>By year, % per trade</h3><div class="tw"><table class="t">
<tr><th></th>${years.map(y => `<th>${y}</th>`).join('')}</tr>
${['P1', 'B1', 'B2', 'B3'].map(k => `<tr><td>${NAMES[k].split(' · ')[0]}</td>${years.map(y => `<td class="${cls(D.by_year[k][y].mean_pct)}">${f(D.by_year[k][y].mean_pct)}</td>`).join('')}</tr>`).join('')}
</table></div><p class="cap" style="margin-top:8px">P1 moves with the plain hold every year, slightly below it. Months: P1 beat holding to 22:00 in ${pc(D.months.P1_minus_B1_positive_share)} of ${D.months.n}.</p></div>

<div class="grid">
<div class="card"><h3>Open-to-close: is the forecast calibrated?</h3><table class="t">
<tr><th>rung</th><th>|close − open| beyond</th><th>should be</th><th>closed above +rung</th><th>below −rung</th></tr>
${['p50', 'p75', 'p90'].map((r, i) => `<tr><td>${r}</td><td>${pc(A[r].exceed)}</td><td>${['50%', '25%', '10%'][i]}</td><td>${pc(A[r].up_beyond)}</td><td>${pc(A[r].down_beyond)}</td></tr>`).join('')}
</table><p class="cap" style="margin-top:8px">Yes. The up side is a little more common because Nasdaq drifted up, not because the forecast said so.
Accuracy at p75 vs a fixed last-year quantile: <b>${f(A.pinball_p75_vs_trailing.skill * 100, 1)}%</b> better; vs recent ATR: ${f(A.pinball_p75_vs_atr.skill * 100, 1)}% (range ${f(A.pinball_p75_vs_atr.lo * 100, 1)} to ${f(A.pinball_p75_vs_atr.hi * 100, 1)}%).</p></div>
<div class="card"><h3>High-to-low: calibrated, and when is it used up?</h3><table class="t">
<tr><th>rung</th><th>range beyond</th><th>should be</th></tr>
${['p50', 'p75', 'p90'].map((r, i) => `<tr><td>${r}</td><td>${pc(Bh.coverage[r].exceed)}</td><td>${['50%', '25%', '10%'][i]}</td></tr>`).join('')}
</table><p class="cap" style="margin-top:8px">Calibrated. vs a fixed last-year quantile <b>${f(Bh.pinball_p75_vs_trailing.skill * 100, 1)}%</b> better; vs recent ATR ${f(Bh.pinball_p75_vs_atr.skill * 100, 1)}% (range ${f(Bh.pinball_p75_vs_atr.lo * 100, 1)} to ${f(Bh.pinball_p75_vs_atr.hi * 100, 1)}%).
After the range reaches p50 (median 15:43 London) it stretches a further <b>${Bh.after_reach_p50.reach_days.further_ext_sigma.toFixed(2)}σ</b>, vs ${Bh.after_reach_p50.nonreach_days_at_median_min.further_ext_sigma.toFixed(2)}σ on other days from the same time: busy days stay busy. That is about size, not direction.</p></div>
</div>

<div class="card"><h3>When does the day’s range reach the forecast? (share of all sessions, by London hour)</h3>
<p class="cap">Almost nothing happens before the US cash open: the forecast range is mostly used between 14:30 and 22:00. A trade opened at midnight sits through about 14 quiet hours first.</p>${reachChart()}</div>

<div class="note"><b>Decision.</b> Reject this trade construction, and do not hunt for variants (other rungs, stops or entry times) on it: the controls are flat. The forecast is a well-calibrated
<b>size</b> ruler, clearly better than a fixed yardstick and only marginally better than recent ATR. If it is used in trade construction at all, the evidence points to stop distance, position size
and how much of the day’s range is left, not to where to take profit or which way to trade. This agrees with the earlier day-reconstruction work (M1–M7).<br>
<span class="muted">Prereg <code>forge/NQ_FORECAST_TARGET_EV_PREREG.md</code> · results <code>analysis/output/nq-forecast-target-ev/RESULTS.md</code> · costs: OANDA NAS100 model 0.0068% round trip; 1 NQ = $20/pt ≈ $349k notional on average.</span></div>`;
</script>
</body>
</html>
