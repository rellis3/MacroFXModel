<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real DE–US Yield Test (FRED/ECB)</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#233042;
          --txt:#e6edf3; --dim:#8b98a9; --green:#10b981; --blue:#4f7df0; --yellow:#eab308; --red:#f97316; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  h1 { margin:0 0 2px; font-size:19px; } .sub { color:var(--dim); font-size:12.5px; }
  .wrap { max-width:900px; margin:0 auto; padding:18px 20px 60px; }
  .controls { display:flex; gap:10px; align-items:flex-end; margin-bottom:16px; flex-wrap:wrap; }
  .ctl { display:flex; flex-direction:column; gap:3px; }
  .ctl label { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  select, button { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:7px; padding:7px 10px; font-size:13px; }
  button.go { background:var(--blue); border-color:var(--blue); color:#fff; cursor:pointer; font-weight:600; }
  button.go:disabled { opacity:.5; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:15px 16px; margin-bottom:16px; }
  h2 { margin:0 0 10px; font-size:14px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .chip { font-size:11.5px; padding:2px 9px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:6px 9px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:600; font-size:11px; text-transform:uppercase; }
  td.mono { font-variant-numeric:tabular-nums; font-family:ui-monospace,Menlo,monospace; }
  .metrics { display:flex; flex-wrap:wrap; gap:16px; margin:2px 0 12px; }
  .metric { min-width:120px; } .metric .v { font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; }
  .metric .l { font-size:11px; color:var(--dim); text-transform:uppercase; }
  .cap { color:var(--dim); font-size:11.5px; margin-top:8px; } .status { color:var(--dim); } .err { color:#fca5a5; }
  .legend { font-size:12px; color:var(--dim); margin:6px 0; }
</style>
</head>
<body>
<header>
  <h1>🏦 Real DE–US Yield Test <span class="sub">— FRED + ECB actual yields, not CFD proxy</span></h1>
  <div class="sub">The divergence-events + daily lead-lag core, run on the <b>actual</b> DE–US spread (incl. the 2Y — the lesson's direction leg — which OANDA can't build). Daily, ~2004→now.</div>
</header>
<div class="wrap">
  <div class="controls">
    <div class="ctl"><label>Tenor</label>
      <select id="tenor"><option value="2Y">2Y (direction leg)</option><option value="10Y">10Y (magnitude leg)</option></select></div>
    <div class="ctl"><label>&nbsp;</label><button class="go" id="run">Measure ▸</button></div>
    <div class="ctl" style="flex:1"><label>&nbsp;</label><div class="status" id="status">Ready.</div></div>
  </div>
  <div id="out"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const fmt = (x,d=2) => (x==null||Number.isNaN(x))?'–':Number(x).toFixed(d);
const pct = x => Number.isFinite(x) ? (x*100).toFixed(0)+'%' : '–';

function divTable(de){
  const hs = de.horizons, nB = de.buckets.length;
  const small=de.buckets[0], large=de.buckets[nB-1];
  let best=-Infinity,bh=null;
  for(const h of hs){ const e=(large.horizons[h]?.hit??NaN)-(small.horizons[h]?.hit??NaN); if(Number.isFinite(e)&&e>best){best=e;bh=h;} }
  const rows=de.buckets.map((b,bi)=>{
    const cells=hs.map(h=>{const c=b.horizons[h]||{};const col=!Number.isFinite(c.hit)?'var(--dim)':c.hit>=0.58?'#6ee7b7':c.hit>=0.53?'#fcd34d':'#fdba74';
      return `<td class="mono" style="color:${col}">${pct(c.hit)}<span style="color:var(--dim);font-size:10px"> ${c.n||0}</span></td>`;}).join('');
    const emph=bi===nB-1?' style="font-weight:700;background:rgba(79,125,240,.08)"':'';
    return `<tr${emph}><td>${bi===0?'smallest':bi===nB-1?'LARGEST ◄':'b'+bi}<br><span class="sub" style="font-size:10px">|gap| ${fmt(b.minAbs)}–${fmt(b.maxAbs)}</span></td>${cells}</tr>`;
  }).join('');
  const verdict=!Number.isFinite(best)?'—':best>=0.08?`edge grows with size (+${(best*100).toFixed(0)}pts at ${bh}d)`:best>=0.03?'weak size effect':'no size effect';
  const vcol=best>=0.08?'#6ee7b7':best>=0.03?'#fcd34d':'#fdba74';
  return `<div class="panel"><h2>🎯 Divergence events <span class="sub" style="font-weight:400">— does FX converge after a BIG divergence?</span></h2>
    <div class="metrics"><div class="metric"><div class="v" style="font-size:15px;color:${vcol}">${verdict}</div><div class="l">largest vs smallest</div></div></div>
    <table><thead><tr><th>Divergence size</th>${hs.map(h=>`<th>${h}d fwd</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
    <div class="cap">Read down each column: hit-rate climbing smallest→LARGEST = the edge lives in big divergences. Diagnostic, in-sample.</div></div>`;
}
function leadTable(ll){
  const m=ll.momentum, mEdge=Number.isFinite(m.hitRate)?m.hitRate-0.5:NaN;
  const leads=ll.bestLag>0&&Math.abs(ll.bestCorr)>=0.1;
  const verdict=leads?`spread LEADS by ${ll.bestLag}d`:Math.abs(ll.coincident)>=0.1?'coincident (no lead)':'no relationship';
  const vcol=leads?'#6ee7b7':Math.abs(ll.coincident)>=0.1?'#fcd34d':'#fdba74';
  return `<div class="panel"><h2>📅 Daily lead-lag</h2>
    <div class="metrics">
      <div class="metric"><div class="v" style="font-size:15px;color:${vcol}">${verdict}</div><div class="l">optimal · corr ${fmt(ll.bestCorr)}</div></div>
      <div class="metric"><div class="v">${fmt(ll.coincident)}</div><div class="l">Same-day corr</div></div>
      <div class="metric"><div class="v" style="color:${mEdge>=0.04?'#6ee7b7':'#fdba74'}">${pct(m.hitRate)}</div><div class="l">Momentum→${m.horizon}d · ${Number.isFinite(mEdge)?(mEdge>=0?'+':'')+pct(mEdge):'–'} vs 50%</div></div>
      <div class="metric"><div class="v">${fmt(m.corr)}</div><div class="l">Mom corr · n=${m.n||0}</div></div>
    </div></div>`;
}

function btPanel(bt, costPct){
  const cell=(s)=>`<td class="mono">${s.trades}</td><td class="mono" style="color:${s.sharpe>0.3?'#6ee7b7':s.sharpe>0?'#fcd34d':'#fdba74'}">${fmt(s.sharpe)}</td><td class="mono">${s.winRate}%</td><td class="mono">${fmt(s.profitFactor)}</td><td class="mono">${fmt(s.expectancy*100,3)}%</td><td class="mono">${fmt(s.rr)}</td><td class="mono">${fmt(s.maxDD*100,2)}%</td>`;
  const cs=bt.costStress.map(c=>`<span class="chip" style="color:${c.sharpe>0.3?'#6ee7b7':c.sharpe>0?'#fcd34d':'#fdba74'}">${c.mult}× → Sh ${fmt(c.sharpe)}</span>`).join(' ');
  const oosGood = bt.oos.sharpe>0.5 && bt.oos.trades>=30 && bt.costStress[1].sharpe>0.3;
  const verdict = bt.oos.trades<30 ? 'too few OOS trades' : oosGood ? 'survives OOS + 2× cost' : bt.oos.sharpe>0 ? 'positive but thin' : 'no OOS edge';
  const vcol = oosGood?'#6ee7b7':bt.oos.sharpe>0?'#fcd34d':'#fdba74';
  return `<div class="panel"><h2>🧪 Fade-to-yield backtest <span class="sub" style="font-weight:400">— enter big divergence, fade toward yield, hold ${bt.params.horizon}d, mark-to-close</span></h2>
    <div class="metrics"><div class="metric"><div class="v" style="font-size:15px;color:${vcol}">${verdict}</div><div class="l">OOS verdict · cost ${(costPct*100).toFixed(3)}%/side</div></div></div>
    <table><thead><tr><th></th><th>trades</th><th>Sharpe</th><th>win%</th><th>PF</th><th>exp/trade</th><th>R:R</th><th>maxDD</th></tr></thead><tbody>
      <tr><td>IS (70%)</td>${cell(bt.is)}</tr>
      <tr style="font-weight:700;background:rgba(79,125,240,.08)"><td>OOS (30%) ◄</td>${cell(bt.oos)}</tr>
    </tbody></table>
    <div class="legend" style="margin-top:8px">OOS cost sensitivity: ${cs}</div>
    <div class="cap">A "win" is only 54% by count — but the trade has a target (the gap) and a stop, so R:R matters more than win%. Ships only if OOS Sharpe clears the incumbent at a non-trivial trade count AND survives 2× cost. Daily mark-to-close (a target/stop version needs intraday fills).</div></div>`;
}
function sweepPanel(sweep){
  const hs=[...new Set(sweep.map(s=>s.horizon))], qs=[...new Set(sweep.map(s=>s.quantile))];
  const cellFor=(h,q)=>sweep.find(s=>s.horizon===h&&s.quantile===q);
  const rows=qs.map(q=>`<tr><td>top ${Math.round((1-q)*100)}%</td>${hs.map(h=>{const c=cellFor(h,q);const col=!c?'var(--dim)':c.oosSharpe>0.5?'#6ee7b7':c.oosSharpe>0?'#fcd34d':'#fdba74';return `<td class="mono" style="color:${col}">${c?fmt(c.oosSharpe):'–'}<span style="color:var(--dim);font-size:10px"> ${c?c.n:0}</span></td>`;}).join('')}</tr>`).join('');
  const pos=sweep.filter(s=>s.oosSharpe>0.5&&s.n>=30).length;
  return `<div class="panel"><h2>🔬 Robustness sweep <span class="sub" style="font-weight:400">— OOS Sharpe across horizon × divergence-size; lucky cell or broad?</span></h2>
    <div class="metrics"><div class="metric"><div class="v" style="color:${pos>=4?'#6ee7b7':pos>=1?'#fcd34d':'#fdba74'}">${pos}/${sweep.length}</div><div class="l">cells with OOS Sharpe&gt;0.5 &amp; n≥30</div></div></div>
    <table><thead><tr><th>gap size \\ hold</th>${hs.map(h=>`<th>${h}d</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
    <div class="cap">Each cell = OOS Sharpe (n below). A real edge is broad (many green cells); one green cell in a sea of noise is overfitting.</div></div>`;
}

function wfPanel(wf){
  const p=wf.params, s=wf.summary;
  const rows=wf.folds.map(f=>{
    const thin=f.n<10;
    const rc = !Number.isFinite(f.reverted)?'var(--dim)':f.reverted>0.5?'#6ee7b7':'#fdba74';
    const nc = !Number.isFinite(f.meanNetPct)?'var(--dim)':f.meanNetPct>0?'#6ee7b7':'#fdba74';
    return `<tr style="${thin?'opacity:.5':''}"><td class="mono">${f.from}→${(f.to||'').slice(2)}</td><td class="mono">${f.n}</td>
      <td class="mono" style="color:${rc}">${Number.isFinite(f.reverted)?(f.reverted*100).toFixed(0)+'%':'–'}</td>
      <td class="mono">${Number.isFinite(f.meanGrossPct)?f.meanGrossPct.toFixed(3)+'%':'–'}</td>
      <td class="mono" style="color:${nc}">${Number.isFinite(f.meanNetPct)?f.meanNetPct.toFixed(3)+'%':'–'}</td>
      <td class="mono">${fmt(f.sharpeNet)}</td></tr>`;
  }).join('');
  return `<div class="panel"><h2>📆 Walk-forward — raw data, your call <span class="sub" style="font-weight:400">— top ${Math.round((1-p.gapQuantile)*100)}% divergences, ${p.horizon}d, ${p.folds} time-folds</span></h2>
    <div class="legend">Each fold is a separate time period. <b>Reverted%</b> = how often price moved back toward the yield (the sign is the data: &gt;50% = mean-reversion, &lt;50% = momentum). <b>Net</b> = mean move after ${(p.costPct*100).toFixed(3)}%/side cost. No verdict — the numbers are yours to read.</div>
    <table><thead><tr><th>Period</th><th>events</th><th>reverted</th><th>mean gross</th><th>mean net</th><th>Sharpe(net)</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="legend" style="margin-top:8px">Across ${s.foldsWithData} folds with data: <b>${s.foldsRevertGt50}</b> had &gt;50% reversion, <b>${s.foldsNetPositive}</b> were net-positive, median reversion <b>${Number.isFinite(s.medianReverted)?(s.medianReverted*100).toFixed(0)+'%':'–'}</b>. A stable edge shows up in most folds; a one-fold spike doesn't.</div>
    <div class="cap">Dimmed rows have &lt;10 events (too few to read). Tune via ?wfQuantile= &amp;wfHorizon= &amp;wfFolds= in the URL.</div></div>`;
}

function cxTable(cx){
  if(!cx||!cx.n) return '';
  const d=cx.dist, pctf=x=>Number.isFinite(x)?(x*100).toFixed(0)+'%':'–';
  const stops=[...new Set(cx.grid.map(c=>c.stop))], targets=[...new Set(cx.grid.map(c=>c.target))];
  const cellFor=(s,t)=>cx.grid.find(c=>c.stop===s&&c.target===t);
  const rows=stops.map(s=>`<tr><td>stop ${s}</td>${targets.map(t=>{const c=cellFor(s,t);const best=cx.best&&c.stop===cx.best.stop&&c.target===cx.best.target;
    const col=!c?'var(--dim)':c.ev>0.05?'#6ee7b7':c.ev>0?'#fcd34d':'#fdba74';
    return `<td class="mono" style="color:${col};${best?'background:rgba(16,185,129,.14);font-weight:700':''}">${c?(c.ev>=0?'+':'')+c.ev.toFixed(2):'–'}<span style="color:var(--dim);font-size:10px"> ${c?pctf(c.hitRate):''}</span></td>`;}).join('')}</tr>`).join('');
  const b=cx.best;
  const verdict=!b?'—':b.ev>0.05?`convex — a stop/target pays (+${b.ev.toFixed(2)} at ${b.target}:${b.stop}, ${pctf(b.hitRate)} hit)`:b.ev>0?'marginally convex':'not convex (no +EV cell)';
  const vcol=!b?'var(--dim)':b.ev>0.05?'#6ee7b7':b.ev>0?'#fcd34d':'#fdba74';
  return `<div class="panel"><h2>🎢 Convexity (MFE/MAE) <span class="sub" style="font-weight:400">— does the payoff SHAPE pay even at low hit-rate? (${cx.n} events, ${cx.params.horizon}d hold)</span></h2>
    <div class="metrics">
      <div class="metric"><div class="v" style="font-size:14px;color:${vcol}">${verdict}</div><div class="l">verdict</div></div>
      <div class="metric"><div class="v">${fmt(d.mfeMed)}</div><div class="l">Median MFE (σ·√H)</div></div>
      <div class="metric"><div class="v">${fmt(d.maeMed)}</div><div class="l">Median MAE</div></div>
      <div class="metric"><div class="v">${d.rrMed==null?'∞':fmt(d.rrMed)}</div><div class="l">MFE:MAE</div></div>
    </div>
    <div class="legend">MFE = how far price ran the trade's way; MAE = how far against (σ·√H units). Grid = EV per unit risk, path-aware stop+target, hit-rate below, net cost.</div>
    <table style="max-width:520px"><thead><tr><th>stop \\ target →</th>${targets.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
    <div class="cap">A green cell = positive EV <b>even at a low hit-rate</b> — convexity, measured. All orange = the shape doesn't rescue it after cost. In-sample, first-touch sim.</div></div>`;
}

async function run(){
  const tenor=$('tenor').value;
  $('run').disabled=true; $('status').textContent='Fetching FRED + ECB…'; $('status').className='status'; $('out').innerHTML='';
  try{
    const r=await fetch(`/api/yield-coupling-real?tenor=${tenor}`);
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    $('out').innerHTML =
      `<div class="panel"><h2>${j.label} <span class="chip">${j.bars} days</span></h2>
        <div class="cap">${j.first} → ${j.last} · sources: ${j.sources.fx}, ${j.sources.us}, ${j.sources.de} · raw obs: FX ${j.availability.fx}, US ${j.availability.us}, DE ${j.availability.de}</div></div>`
      + (j.convexity ? cxTable(j.convexity) : '')
      + (j.walkForward ? wfPanel(j.walkForward) : '')
      + (j.backtest ? btPanel(j.backtest, j.costPct) : '')
      + (j.sweep ? sweepPanel(j.sweep) : '')
      + divTable(j.divergenceEvents) + leadTable(j.dailyLeadLag)
      + `<div class="cap">${j.note}</div>`;
    $('status').textContent=`Done — ${j.bars} aligned days.`;
  }catch(e){ $('status').innerHTML='<span class="err">'+e.message+'</span>'; }
  finally{ $('run').disabled=false; }
}
$('run').addEventListener('click', run);
run();
</script>
</body>
</html>
