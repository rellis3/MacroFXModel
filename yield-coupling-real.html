<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real DE–US Yield Test (FRED/ECB)</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#233042;
          --txt:#e6edf3; --dim:#8b98a9; --green:#10b981; --blue:#4f7df0; --yellow:#eab308; --red:#f97316; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  h1 { margin:0 0 2px; font-size:19px; } .sub { color:var(--dim); font-size:12.5px; }
  .wrap { max-width:900px; margin:0 auto; padding:18px 20px 60px; }
  .controls { display:flex; gap:10px; align-items:flex-end; margin-bottom:16px; flex-wrap:wrap; }
  .ctl { display:flex; flex-direction:column; gap:3px; }
  .ctl label { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  select, button { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:7px; padding:7px 10px; font-size:13px; }
  button.go { background:var(--blue); border-color:var(--blue); color:#fff; cursor:pointer; font-weight:600; }
  button.go:disabled { opacity:.5; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:15px 16px; margin-bottom:16px; }
  h2 { margin:0 0 10px; font-size:14px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .chip { font-size:11.5px; padding:2px 9px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:6px 9px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:600; font-size:11px; text-transform:uppercase; }
  td.mono { font-variant-numeric:tabular-nums; font-family:ui-monospace,Menlo,monospace; }
  .metrics { display:flex; flex-wrap:wrap; gap:16px; margin:2px 0 12px; }
  .metric { min-width:120px; } .metric .v { font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; }
  .metric .l { font-size:11px; color:var(--dim); text-transform:uppercase; }
  .cap { color:var(--dim); font-size:11.5px; margin-top:8px; } .status { color:var(--dim); } .err { color:#fca5a5; }
  .legend { font-size:12px; color:var(--dim); margin:6px 0; }
</style>
</head>
<body>
<header>
  <h1>🏦 Real DE–US Yield Test <span class="sub">— FRED + ECB actual yields, not CFD proxy</span></h1>
  <div class="sub">The divergence-events + daily lead-lag core, run on the <b>actual</b> DE–US spread (incl. the 2Y — the lesson's direction leg — which OANDA can't build). Daily, ~2004→now.</div>
</header>
<div class="wrap">
  <div class="controls">
    <div class="ctl"><label>Tenor</label>
      <select id="tenor"><option value="2Y">2Y (direction leg)</option><option value="10Y">10Y (magnitude leg)</option></select></div>
    <div class="ctl"><label>&nbsp;</label><button class="go" id="run">Measure ▸</button></div>
    <div class="ctl" style="flex:1"><label>&nbsp;</label><div class="status" id="status">Ready.</div></div>
  </div>
  <div id="out"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const fmt = (x,d=2) => (x==null||Number.isNaN(x))?'–':Number(x).toFixed(d);
const pct = x => Number.isFinite(x) ? (x*100).toFixed(0)+'%' : '–';

function divTable(de){
  const hs = de.horizons, nB = de.buckets.length;
  const small=de.buckets[0], large=de.buckets[nB-1];
  let best=-Infinity,bh=null;
  for(const h of hs){ const e=(large.horizons[h]?.hit??NaN)-(small.horizons[h]?.hit??NaN); if(Number.isFinite(e)&&e>best){best=e;bh=h;} }
  const rows=de.buckets.map((b,bi)=>{
    const cells=hs.map(h=>{const c=b.horizons[h]||{};const col=!Number.isFinite(c.hit)?'var(--dim)':c.hit>=0.58?'#6ee7b7':c.hit>=0.53?'#fcd34d':'#fdba74';
      return `<td class="mono" style="color:${col}">${pct(c.hit)}<span style="color:var(--dim);font-size:10px"> ${c.n||0}</span></td>`;}).join('');
    const emph=bi===nB-1?' style="font-weight:700;background:rgba(79,125,240,.08)"':'';
    return `<tr${emph}><td>${bi===0?'smallest':bi===nB-1?'LARGEST ◄':'b'+bi}<br><span class="sub" style="font-size:10px">|gap| ${fmt(b.minAbs)}–${fmt(b.maxAbs)}</span></td>${cells}</tr>`;
  }).join('');
  const verdict=!Number.isFinite(best)?'—':best>=0.08?`edge grows with size (+${(best*100).toFixed(0)}pts at ${bh}d)`:best>=0.03?'weak size effect':'no size effect';
  const vcol=best>=0.08?'#6ee7b7':best>=0.03?'#fcd34d':'#fdba74';
  return `<div class="panel"><h2>🎯 Divergence events <span class="sub" style="font-weight:400">— does FX converge after a BIG divergence?</span></h2>
    <div class="metrics"><div class="metric"><div class="v" style="font-size:15px;color:${vcol}">${verdict}</div><div class="l">largest vs smallest</div></div></div>
    <table><thead><tr><th>Divergence size</th>${hs.map(h=>`<th>${h}d fwd</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
    <div class="cap">Read down each column: hit-rate climbing smallest→LARGEST = the edge lives in big divergences. Diagnostic, in-sample.</div></div>`;
}
function leadTable(ll){
  const m=ll.momentum, mEdge=Number.isFinite(m.hitRate)?m.hitRate-0.5:NaN;
  const leads=ll.bestLag>0&&Math.abs(ll.bestCorr)>=0.1;
  const verdict=leads?`spread LEADS by ${ll.bestLag}d`:Math.abs(ll.coincident)>=0.1?'coincident (no lead)':'no relationship';
  const vcol=leads?'#6ee7b7':Math.abs(ll.coincident)>=0.1?'#fcd34d':'#fdba74';
  return `<div class="panel"><h2>📅 Daily lead-lag</h2>
    <div class="metrics">
      <div class="metric"><div class="v" style="font-size:15px;color:${vcol}">${verdict}</div><div class="l">optimal · corr ${fmt(ll.bestCorr)}</div></div>
      <div class="metric"><div class="v">${fmt(ll.coincident)}</div><div class="l">Same-day corr</div></div>
      <div class="metric"><div class="v" style="color:${mEdge>=0.04?'#6ee7b7':'#fdba74'}">${pct(m.hitRate)}</div><div class="l">Momentum→${m.horizon}d · ${Number.isFinite(mEdge)?(mEdge>=0?'+':'')+pct(mEdge):'–'} vs 50%</div></div>
      <div class="metric"><div class="v">${fmt(m.corr)}</div><div class="l">Mom corr · n=${m.n||0}</div></div>
    </div></div>`;
}

async function run(){
  const tenor=$('tenor').value;
  $('run').disabled=true; $('status').textContent='Fetching FRED + ECB…'; $('status').className='status'; $('out').innerHTML='';
  try{
    const r=await fetch(`/api/yield-coupling-real?tenor=${tenor}`);
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    $('out').innerHTML =
      `<div class="panel"><h2>${j.label} <span class="chip">${j.bars} days</span></h2>
        <div class="cap">${j.first} → ${j.last} · sources: ${j.sources.fx}, ${j.sources.us}, ${j.sources.de} · raw obs: FX ${j.availability.fx}, US ${j.availability.us}, DE ${j.availability.de}</div></div>`
      + divTable(j.divergenceEvents) + leadTable(j.dailyLeadLag)
      + `<div class="cap">${j.note}</div>`;
    $('status').textContent=`Done — ${j.bars} aligned days.`;
  }catch(e){ $('status').innerHTML='<span class="err">'+e.message+'</span>'; }
  finally{ $('run').disabled=false; }
}
$('run').addEventListener('click', run);
run();
</script>
</body>
</html>
