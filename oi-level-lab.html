<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level Lab — what the OI lines did</title>
<style>
:root{
  --bg:#07090c; --bg2:#0d1117; --line:#1c232c; --line2:#2a323d;
  --tx:#eef1f5; --tx2:#a8b1bd; --tx3:#6b7585;
  --long:#46b87a; --short:#e8615f; --acc:#f0b04a; --vio:#a487f0; --cy:#5cc8ff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#121a26 0%,var(--bg) 60%);color:var(--tx);font:14px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:1240px;margin:0 auto;padding:16px 18px 80px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:10px}
h1{margin:0;font-size:20px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
h1 b{color:var(--acc)} h1 small{color:var(--tx3);font-size:11px;letter-spacing:.14em;margin-left:8px}
.sp{flex:1}
.btn,.pill{background:rgba(255,255,255,.03);border:1px solid var(--line2);color:var(--tx2);padding:6px 12px;border-radius:999px;font:12.5px var(--mono);cursor:pointer;text-decoration:none}
.btn:hover,.pill:hover{border-color:var(--acc);color:var(--tx)}
.pill.on{border-color:var(--acc);color:var(--acc);background:rgba(240,176,74,.08)}
.rail{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.rail .grp{width:100%;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-top:4px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008));border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 3px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.card h2 em{font-style:normal;color:var(--acc)}
.sub{color:var(--tx2);font-size:13px;margin:0 0 12px;max-width:900px}
.sub b{color:var(--tx)}
.warn{border-color:#5b4a1a;background:linear-gradient(180deg,rgba(240,176,74,.07),rgba(240,176,74,.02))}
.warn h2{color:var(--acc)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.stat{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:130px}
.stat .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.stat .v{font:600 19px var(--mono)}
.stat .n{font-size:11.5px;color:var(--tx3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.lc{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:rgba(255,255,255,.015)}
.lc h3{margin:0;font-size:13px;display:flex;align-items:center;gap:8px}
.lc h3 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.lc .what{color:var(--tx3);font-size:12px;margin:2px 0 8px;min-height:34px}
.lc .big{font:600 13px var(--mono);margin:6px 0 2px}
.lc .verdict{font-size:12.5px;margin-top:6px;color:var(--tx2)}
.lc .verdict b{color:var(--tx)}
.v-up{color:var(--long)} .v-dn{color:var(--short)} .v-nu{color:var(--tx2)} .v-lo{color:var(--acc)}
.mini{font:11.5px var(--mono);color:var(--tx3);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--tx3);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
td.num{font-family:var(--mono);text-align:right}
.days{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.days a{width:15px;height:15px;border-radius:3px;display:inline-block;cursor:pointer;border:1px solid transparent}
.days a:hover{border-color:#fff}
.dot-b{background:#46b87a} .dot-k{background:#e8615f} .dot-n{background:#2a323d} .dot-u{background:#6b5a2a} .dot-x{background:transparent;border:1px dashed #2a323d}
.legend{font-size:11.5px;color:var(--tx3);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-right:12px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.find{border-left:3px solid var(--acc);padding:4px 0 4px 12px;margin:10px 0;color:var(--tx2);font-size:13.5px}
.find b{color:var(--tx)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:30;padding:3vh 2vw;overflow:auto}
#modal .box{max-width:1180px;margin:0 auto;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:16px 18px}
#modal .x{float:right}
svg text{font-family:var(--mono)}
.note{color:var(--tx3);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><b>Level</b> Lab<small>what the OI lines did · exploratory</small></h1>
  <span class="sp"></span>
  <a class="btn" href="/oi-dashboard-v2.html">← OI Lab</a>
</header>
<div class="rail" id="rail"></div>
<div class="stats" id="stats"></div>
<div id="app">loading…</div>
</div>

<div id="modal"><div class="box"><button class="btn x" id="mx">close ✕</button><div id="mbody"></div></div></div>

<script>
'use strict';
const BASE = '/analysis/output/oi-level-map/';
const $ = s => document.querySelector(s);
const PAIRS = ['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','GOLD','NQ','SPX','DOW','RUT'];
const GROUPS = ['ALL','FX','GOLD','IDX'];
const GNAME = { ALL: 'all 11 markets', FX: 'the six FX pairs', GOLD: 'gold', IDX: 'the four indices' };
const LINES = {
  call_wall:        { n: 'Call wall',        c: '#ff7a86', w: 'The strike above price with the most call gamma. Textbook: dealers sell into it, so price stalls or reverses there.' },
  put_wall:         { n: 'Put wall',         c: '#46d39a', w: 'The strike below price with the most put gamma. Textbook: dealers buy into it, so price holds there.' },
  gamma_peak:       { n: 'Gamma peak',       c: '#f2f2f2', w: 'Where net dealer gamma is largest. Textbook: the strongest pin on the map.' },
  zero_gamma:       { n: 'Zero gamma',       c: '#a487f0', w: 'Where dealers flip from damping moves (above) to chasing them (below). Textbook: a regime edge.' },
  gex_flip:         { n: 'GEX flip',         c: '#b9a3ff', w: 'The whole-book version of the zero-gamma line.' },
  max_pain:         { n: 'Max pain',         c: '#e6c84a', w: 'The strike where option holders lose the most at expiry. Textbook: a magnet, mainly in the last 48 hours.' },
  vanna_flip:       { n: 'Vanna flip',       c: '#ff7ad9', w: 'Where a change in implied vol flips the direction of dealer hedging.' },
  charm_flip:       { n: 'Charm flip',       c: '#ff9f43', w: 'Where the passing of time flips dealer hedging. Textbook: a time-of-day pull.' },
  oi_volume:        { n: 'Volume level',     c: '#4aa8ff', w: 'The strike with the heaviest traded volume that session.' },
  short_gamma_node: { n: 'Short-gamma node', c: '#e8615f', w: 'A big net-short-gamma strike. Textbook: speeds moves up.' },
  long_gamma_node:  { n: 'Long-gamma node',  c: '#46b87a', w: 'A big net-long-gamma strike. Textbook: pins moves.' },
  sq_gamma_call:    { n: 'Call wall, all expiries added', c: '#ff9aa4', w: '', x: 1 },
  sq_gamma_put:     { n: 'Put wall, all expiries added',  c: '#7be3b8', w: '', x: 1 },
  sq_oi_call:       { n: 'Most call contracts (any expiry)', c: '#ffb3ba', w: '', x: 1 },
  sq_oi_put:        { n: 'Most put contracts (any expiry)',  c: '#a6efcf', w: '', x: 1 },
  near_oi_call:     { n: 'Call contracts, up to 7 days',     c: '#ffc4a0', w: '', x: 1 },
  near_oi_put:      { n: 'Put contracts, up to 7 days',      c: '#bfe9b0', w: '', x: 1 },
  far_oi_call:      { n: 'Call contracts, 8+ days',          c: '#d9a3ff', w: '', x: 1 },
  far_oi_put:       { n: 'Put contracts, 8+ days',           c: '#a3c6ff', w: '', x: 1 },
  oi_peak:          { n: 'Most open interest (calls+puts)',  c: '#ffffff', w: '', x: 1 },
  vanna_pos:        { n: 'Vanna peak (+)',                   c: '#ff9be6', w: '', x: 1 },
  vanna_neg:        { n: 'Vanna peak (-)',                   c: '#c79bff', w: '', x: 1 },
  exp_hi:           { n: 'Expected-move high', c: '#d9b45a', w: 'The options-implied one-day upper edge. A ruler, not a positioning level: the control line.' },
  exp_lo:           { n: 'Expected-move low',  c: '#d9b45a', w: 'The options-implied one-day lower edge. The control line.' },
};
let SHOWX = false, R = null, R2 = null, R3 = null, SEL = 'ALL', REPL = {}, DBM = null;
const pct = (x, d = 0) => x == null ? '–' : (x * 100).toFixed(d) + '%';
const pp = (x, d = 0) => x == null ? '–' : (x >= 0 ? '+' : '') + (x * 100).toFixed(d) + ' pp';
const nT = c => c ? (c.real.bounce + c.real.brk) : 0;

// ── verdict wording: what the numbers can and cannot say ────────────────────────────────────────────────────────────────────────────
function verdict(c, label = 'it') {
  if (!c) return { t: 'No data for this line here.', k: 'v-lo' };
  const n = nT(c), d = c.diff;
  if (n < 20) return { t: `Only <b>${n}</b> touches with a clear outcome: too few to say anything.`, k: 'v-lo' };
  if (!d) return { t: `${n} touches, but too few random lines to compare against.`, k: 'v-lo' };
  const m = d.diff;
  if (d.lo > 0) return { t: `Bounced <b>${pp(m)}</b> more than random lines, and the interval clears zero. Worth a prereg, not a conclusion.`, k: 'v-up' };
  if (d.hi < 0) return { t: `Broke <b>${pp(-m)}</b> more than random lines, and the interval clears zero. Worth a prereg, not a conclusion.`, k: 'v-dn' };
  if (Math.abs(m) >= 0.06) return { t: `Leans ${m > 0 ? 'toward bouncing' : 'toward breaking'} (<b>${pp(m)}</b>) but the interval includes zero: not distinguishable from a random line yet.`, k: 'v-lo' };
  return { t: `Behaves like a random line: <b>${pp(m)}</b>, interval includes zero.`, k: 'v-nu' };
}

// ── interval graphic: where the difference vs a random line sits, on a -40..+40 pp axis ──────────────────────────────────────────────
function ci(c, w = 300) {
  const d = c && c.diff, h = 30, lo = -0.4, hi = 0.4, X = v => 8 + (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (w - 16);
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><line x1="8" x2="${w - 8}" y1="15" y2="15" stroke="#2a323d"/><line x1="${X(0)}" x2="${X(0)}" y1="4" y2="26" stroke="#6b7585"/>`;
  for (const v of [-0.3, -0.2, -0.1, 0.1, 0.2, 0.3]) s += `<line x1="${X(v)}" x2="${X(v)}" y1="12" y2="18" stroke="#2a323d"/>`;
  if (d) {
    const col = d.lo > 0 ? '#46b87a' : d.hi < 0 ? '#e8615f' : '#a8b1bd';
    s += `<line x1="${X(d.lo)}" x2="${X(d.hi)}" y1="15" y2="15" stroke="${col}" stroke-width="5" stroke-linecap="round" opacity=".55"/><circle cx="${X(d.diff)}" cy="15" r="5" fill="${col}"/>`;
  } else s += `<text x="${w / 2}" y="19" text-anchor="middle" fill="#6b7585" font-size="10">no interval (too few touches)</text>`;
  s += `<text x="8" y="28" fill="#6b7585" font-size="9">breaks more</text><text x="${w - 8}" y="28" text-anchor="end" fill="#6b7585" font-size="9">bounces more</text></svg>`;
  return s;
}
const rateBar = c => {
  if (!c) return '';
  const a = c.real, b = a.bounce, k = a.brk, t = b + k || 1;
  return `<div style="display:flex;height:10px;border-radius:5px;overflow:hidden;background:#1c232c"><div style="width:${b / t * 100}%;background:#46b87a"></div><div style="width:${k / t * 100}%;background:#e8615f"></div></div>
  <div class="mini"><span>bounced ${b}</span><span>broke ${k}</span><span>random lines: ${c.plc.rate == null ? '–' : pct(c.plc.rate)} bounce</span></div>`;
};

// ── page ────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
function rail() {
  $('#rail').innerHTML = '<div class="grp">Group</div>' + GROUPS.map(g => `<span class="pill ${g === SEL ? 'on' : ''}" data-g="${g}">${g}</span>`).join('') +
    '<div class="grp">Single market</div>' + PAIRS.map(p => `<span class="pill ${p === SEL ? 'on' : ''}" data-g="${p}">${p}</span>`).join('');
  document.querySelectorAll('#rail .pill').forEach(el => el.onclick = () => { SEL = el.dataset.g; rail(); render(); });
}
function stats() {
  const m = R.meta, dr = m.dropped;
  const total = m.records + dr.stale_asof + dr.no_sigma + dr.no_prices;
  $('#stats').innerHTML = [
    ['Sessions', m.nDates, `${m.dates[0]} → ${m.dates[1]}`],
    ['Market-sessions scored', m.records, `of ${total} captured`],
    ['Left out: stale book', dr.stale_asof, 'CME served the previous day'],
    ['Left out: no IV ruler', dr.no_sigma, 'early captures'],
    ['Line touches scored', m.events.indicator.toLocaleString(), 'incl. random lines'],
  ].map(([k, v, n]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`).join('');
}
const cellOf = (t) => R.sections.byType[t] && R.sections.byType[t][SEL];

function render() {
  const S = R.sections, m = R.meta;
  const grp = GNAME[SEL] || SEL;
  let h = '';
  // honesty box
  const cells = []; (function walk(o, p) { if (o && typeof o === 'object') { if (o.diff && typeof o.diff === 'object') cells.push(o.diff); for (const k in o) walk(o[k], p); } })(S, []);
  const excl = cells.filter(d => d.lo > 0 || d.hi < 0).length;
  h += `<div class="card warn"><h2>Read this first</h2><p class="sub">This is an <b>exploratory</b> look at <b>${m.nDates} sessions</b> of the nightly option-book captures, not a test. It was not pre-registered and nothing here is banked as evidence or used by any bot.
  Each line is scored the same way: the first time price reaches it, which comes first, a move of 0.25 of a day's expected move <b>back</b> (a fade would win) or <b>through</b> it (a follow would win)? The same race is run on random lines placed 0.25 and 0.5 of a day's move either side of every real line, on the same day. A real line only means something if it beats those.</p>
  <p class="sub">${cells.length} comparisons are shown on this page; at the usual 5% level about <b>${Math.round(cells.length * 0.05)}</b> would clear zero by luck alone, and <b>${excl}</b> do. Many overlap (the same days feed every table), so treat each as a pointer for the pre-registered test, not as a finding.
  Sessions after 2026-08-21 are included; the lockbox only bars scoring the forecast layers, so these sessions are now <i>seen</i> for OI-line questions.</p></div>`;

  // headline findings, built from the numbers
  const wr = S.walls.regime || {}, hs = S.walls.hfsign || {}, rs = S.walls.regime_x_strong || {};
  h += `<div class="card"><h2><em>1</em> What stands out</h2>
  <div class="find"><b>The regime read points the right way, weakly.</b> Walls bounced ${pp(wr.PIN && wr.PIN.diff && wr.PIN.diff.diff)} vs random lines when dealers were long gamma (PIN), and ${pp(wr.BREAKOUT && wr.BREAKOUT.diff && wr.BREAKOUT.diff.diff)} when short gamma (BREAKOUT). Strong walls only: PIN ${pp(rs.PIN && rs.PIN.diff && rs.PIN.diff.diff)}, BREAKOUT ${pp(rs.BREAKOUT && rs.BREAKOUT.diff && rs.BREAKOUT.diff.diff)}. Same direction as the theory (fade in long gamma, follow in short), every interval still includes zero.</div>
  <div class="find"><b>Most lines behave like random lines.</b> Of the ${Object.keys(S.byType).length} line types in the whole sample, none beats a random line with an interval that excludes zero. The few cells that do clear zero (zero gamma and the volume level on the indices, walls with OI being built) are about as many as luck produces among ${cells.length} comparisons.</div>
  <div class="find"><b>Walls where open interest was being <i>built</i> that day bounced more</b> (${pp(S.walls.oiChange && S.walls.oiChange['building (OI +3% or more)'] && S.walls.oiChange['building (OI +3% or more)'].diff.diff)}, interval above zero). That is C.OG's "strengthening wall" idea and the cleanest single pointer here. It is one cell, and the walls are not independent across days.</div>
  <div class="find"><b>A wall that exists only in a far expiry (8+ days, nothing near it) leaned the other way</b> (${pp(S.bucketWalls.d8_45 && S.bucketWalls.d8_45.faronly && S.bucketWalls.d8_45.faronly.diff && S.bucketWalls.d8_45.faronly.diff.diff)}): price was more likely to go through than a random line. Thin (about 60 touches), but it is the "far-DTE walls follow rather than fade" idea, and it is the first thing to check in the long Databento history.</div>`;
  if (R2) {
    const P = R2.sections.piled, c3 = P.combos && P.combos['three or more types incl. a wall · PIN'], c3b = P.combos && P.combos['three or more types incl. a wall · BREAKOUT'], sz = P.bySize_regime || {};
    const g = x => x && x.diff ? `${pp(x.diff.diff)} [${(x.diff.lo * 100).toFixed(0)}, ${(x.diff.hi * 100).toFixed(0)}]` : 'too few';
    const dr = R2.sections.dayBook.direction || {}, pm = R2.sections.greeks.pm_pull || {};
    h += `<div class="find"><b>Piled-up lines on a pin day held; on a breakout day they did not.</b> Stacks of three or more kinds of line including a wall: PIN ${g(c3)} (${c3 ? nT(c3) : 0} touches), BREAKOUT ${g(c3b)}. Same shape for stacks of 3+ types: PIN ${g(sz['3+ · PIN'])}, BREAKOUT ${g(sz['3+ · BREAKOUT'])}. This is the dealer-gamma story seen through confluence, the best-supported pointer on the page, and the several cuts of it are the same ~25–40 stacks counted different ways.</div>
    <div class="find"><b>Ignoring time to expiry costs nothing, and carving it up gains nothing.</b> Walls built from gamma added across all expiries, from raw contracts at any expiry, from contracts under 7 days, or from contracts 8+ days out all sit at random-line levels (section 6). A wall made mostly of far-dated contracts is no different (${g(R2.sections.squash.farShare && R2.sections.squash.farShare['mostly far-expiry OI (>60% 8+ days)'])}). The one cell that clears zero is far-dated call walls in FX (${g(R2.sections.squash.far_oi.far_oi_call.FX)}): leaning toward breaking, one cell of many.</div>
    <div class="find"><b>Which way the day went: nothing predicts it.</b> Not the travel read (${dr['travel read (up/down) vs the day'] ? (dr['travel read (up/down) vs the day'].rate * 100).toFixed(0) + '% right' : '–'}), zero gamma, max pain, the nearer wall or a 5-day streak. The 63-day trend pointed the wrong way (${dr['63-day trend up/down -> same direction today'] ? (dr['63-day trend up/down -> same direction today'].rate * 100).toFixed(0) + '% right' : '–'}), which says more about this 3-month window than about OI.</div>
    <div class="find"><b>Time-of-day pull:</b> the heaviest-volume level pulled price toward it over the afternoon (${pm.oi_volume ? '+' + pm.oi_volume.diff.toFixed(2) + 'σ vs random lines' : '–'}); the vanna, charm and zero-gamma flips, if anything, pushed price away from them (${pm.charm_flip ? pm.charm_flip.diff.toFixed(2) + 'σ' : '–'}). Both borderline.</div>`;
  }
  h += `</div>`;
  h += `<!--find-end-->`;

  // each line for the selection
  h += `<div class="card"><h2><em>2</em> Each line: ${grp}</h2><p class="sub">The dot is how much more often price <b>bounced</b> at this line than at a random line (right = fade works better, left = follow works better); the bar is the 95% interval. A bar that spans zero means the data cannot tell this line from a random price.</p><div class="grid">`;
  for (const t of Object.keys(LINES).filter(k => !LINES[k].x)) {
    const c = cellOf(t), L = LINES[t], v = verdict(c);
    const ts = c ? c.touch_share : null, ps = c ? c.plc_touch_share : null;
    h += `<div class="lc"><h3><i style="background:${L.c}"></i>${L.n}${c ? `<span class="note" style="margin-left:auto">${c.n_levels} lines</span>` : ''}</h3><div class="what">${L.w}</div>
      ${c ? ci(c) + rateBar(c) + `<div class="mini"><span>reached on ${pct(ts)} of days (random lines ${pct(ps)})</span></div>
      <div class="mini"><span>60-min move away ${c.mfe60[0] == null ? '–' : c.mfe60[0].toFixed(2)}σ vs ${c.mfe60[1] == null ? '–' : c.mfe60[1].toFixed(2)}σ</span><span>through ${c.mae60[0] == null ? '–' : c.mae60[0].toFixed(2)}σ vs ${c.mae60[1] == null ? '–' : c.mae60[1].toFixed(2)}σ</span></div>` : ''}
      <div class="verdict ${v.k}">${v.t}</div>${PAIRS.includes(SEL) ? `<div class="days" data-t="${t}"></div>` : ''}</div>`;
  }
  h += '</div>' + (PAIRS.includes(SEL) ? `<div class="legend"><span><i class="dot-b"></i>bounced</span><span><i class="dot-k"></i>broke through</span><span><i class="dot-u"></i>touched, no 0.25σ move by 22:00</span><span><i class="dot-n"></i>not reached</span> · click a day to replay it</div>` : '') + '</div>';

  // regime
  h += `<div class="card"><h2><em>3</em> Pin or breakout: does the dealer-gamma read change what a wall does?</h2>
  <p class="sub">The dealer-hedging picture says a wall in <b>long gamma</b> (PIN) should hold, because dealers lean against the move, and a wall in <b>short gamma</b> (BREAKOUT) should give way, because they chase it. "Damping / reinforcing" is the same question read from the hedge-flow curve (OI Lab 05e). Everything here is walls from the indicator, all markets.</p>
  <div class="two"><div>${rowTable([['PIN (long gamma)', wr.PIN], ['BREAKOUT (short gamma)', wr.BREAKOUT], ['Hedge-flow damping', hs.damp], ['Hedge-flow reinforcing', hs.reinf], ['PIN, strong walls', rs.PIN], ['BREAKOUT, strong walls', rs.BREAKOUT]])}</div>
  <div>${dayRegime()}</div></div></div>`;

  // dte
  h += `<div class="card"><h2><em>4</em> Expiry (DTE): does a wall's own expiry matter?</h2>

}

function ivCard() {
  const S = R3.sections, rho = (k) => { const v = S[k]; if (!v) return '<td class="note">–</td><td class="note">–</td>'; const col = v.lo > 0 ? 'v-up' : v.hi < 0 ? 'v-dn' : 'v-nu'; return `<td class="num">${v.n}</td><td class="num ${col}">${v.rho >= 0 ? '+' : ''}${v.rho.toFixed(2)} <span class="note">[${v.lo.toFixed(2)}, ${v.hi.toFixed(2)}]</span></td>`; };
  const tr = (lab, k) => `<tr><td>${lab}</td>${rho(k)}</tr>`;
  const ll = S.ivLevel_loglog || {}, terc = S.ivLevel_terciles || {}, sk = S.skew_terciles || {};
  const tt = (T, lab) => ['low', 'mid', 'high'].map(t => `<td class="num">${T[t] ? T[t].hl.toFixed(2) : '–'}</td><td class="num">${T[t] ? T[t].down.toFixed(2) + ' / ' + T[t].up.toFixed(2) : '–'}</td>`).join('');
  const wb = (o, k) => { const x = o[k]; return x && x.bounce != null ? `${(x.bounce * 100).toFixed(0)}% <span class="note">(${x.n}; random ${(x.plc * 100).toFixed(0)}%)</span>` : '–'; };
  return `<div class="card"><h2><em>10</em> IV and the smile: what they do to the day and to the lines</h2>
  <p class="sub">The smile is how implied vol changes by strike. Three questions: does the <b>level</b> of IV change the size of the day, does the <b>shape</b> (put-wing richness against call-wing, and how far both wings sit above ATM) say anything about the size or direction of the day, and does a <b>change</b> in IV or skew move the walls or change how they behave? Shape numbers are in ATM-vol units so every market compares; changes are against the previous capture. Correlations are rank correlations within each market, intervals bootstrap whole dates.</p>
  <div class="two"><div><h3 style="${H3};margin-top:0">Size of the day</h3><table><tr><th>Relationship</th><th class="num">sessions</th><th class="num">rank corr</th></tr>
  ${tr('IV level vs range ÷ implied move', 'iv_vs_hl')}${tr('IV change since yesterday vs range ÷ implied move', 'dIv_vs_hl')}${tr('Put-wing minus call-wing (skew) vs range', 'skew_vs_hl')}${tr('Both wings above ATM (curvature) vs range', 'wing_vs_hl')}${tr('Curvature vs the downside reach', 'wing_vs_down')}${tr('Curvature vs the upside reach', 'wing_vs_up')}</table>
  <p class="note">IV sets the scale of the day (log range on log IV: average slope ${S.ivLevel_slope_mean.toFixed(2)}, 1.0 = one for one, positive in all ${Object.keys(ll).length} markets), but once the day is measured in implied-move units nothing about IV level, change or wing shape explains how wide it was or how fat the tails were.</p></div>
  <div><h3 style="${H3};margin-top:0">Direction (expected null)</h3><table><tr><th>Relationship</th><th class="num">sessions</th><th class="num">rank corr</th></tr>
  ${tr('Put-skew vs how far the day fell (open to low)', 'skew_vs_down')}${tr('Put-skew vs how far it rose (open to high)', 'skew_vs_up')}${tr('Put-skew vs close minus open', 'skew_vs_oc')}${tr('Skew change vs close minus open', 'dSkew_vs_oc')}${tr('IV change vs close minus open', 'dIv_vs_oc')}</table>
  <p class="note">Richer puts went with a <i>smaller</i> fall and a <i>larger</i> rise (about 0.12 each, intervals just touch zero): if anything the opposite of "puts are bid, so it falls". One window, direction-adjacent, so a pointer at most.</p></div></div>
  <h3 style="${H3};margin-top:14px">By thirds within each market: range, and the fall / rise from the open (σ, medians)</h3>
  <table><tr><th></th><th class="num">range, low third</th><th class="num">fall / rise</th><th class="num">range, mid</th><th class="num">fall / rise</th><th class="num">range, high third</th><th class="num">fall / rise</th></tr>
  <tr><td>Sorted by IV level</td>${tt(terc)}</tr><tr><td>Sorted by put-skew</td>${tt(sk)}</tr></table>
  <div class="two" style="margin-top:14px"><div><h3 style="${H3};margin-top:0">Do the walls move when IV or skew moves?</h3><table><tr><th>Relationship</th><th class="num">sessions</th><th class="num">rank corr</th></tr>
  ${tr('IV change vs how far the put wall moved', 'dIv_vs_putWallShift')}${tr('…after taking out the move in price itself', 'dIv_vs_putWallShift_exSpot')}${tr('IV change vs how far the call wall moved', 'dIv_vs_callWallShift')}${tr('…after taking out the move in price itself', 'dIv_vs_callWallShift_exSpot')}${tr('IV change vs the move in price', 'dIv_vs_spotMove')}${tr('Skew change vs call wall move, ex price', 'dSkew_vs_callWallShift_exSpot')}${tr('IV level vs wall-to-wall span (in σ)', 'iv_vs_wallSpan')}</table>
  <p class="note">Walls moved down when IV rose (−0.21 for the put wall), but that is the price move: IV rises when price falls (IV vs price move: −0.21), and the relationship is gone once price's own move is removed. The wall span shrinks as IV rises (−0.26) only because σ itself scales with IV.</p></div>
  <div><h3 style="${H3};margin-top:0">Do walls bounce differently by IV or skew third?</h3><table><tr><th>Wall</th><th class="num">low</th><th class="num">mid</th><th class="num">high</th></tr>
  <tr><td>Put wall by put-skew</td><td class="num">${wb(S.wallBounce_by_skew, 'put_wall · low')}</td><td class="num">${wb(S.wallBounce_by_skew, 'put_wall · mid')}</td><td class="num">${wb(S.wallBounce_by_skew, 'put_wall · high')}</td></tr>
  <tr><td>Call wall by put-skew</td><td class="num">${wb(S.wallBounce_by_skew, 'call_wall · low')}</td><td class="num">${wb(S.wallBounce_by_skew, 'call_wall · mid')}</td><td class="num">${wb(S.wallBounce_by_skew, 'call_wall · high')}</td></tr>
  <tr><td>Put wall by IV level</td><td class="num">${wb(S.wallBounce_by_iv, 'put_wall · low')}</td><td class="num">${wb(S.wallBounce_by_iv, 'put_wall · mid')}</td><td class="num">${wb(S.wallBounce_by_iv, 'put_wall · high')}</td></tr>
  <tr><td>Call wall by IV level</td><td class="num">${wb(S.wallBounce_by_iv, 'call_wall · low')}</td><td class="num">${wb(S.wallBounce_by_iv, 'call_wall · mid')}</td><td class="num">${wb(S.wallBounce_by_iv, 'call_wall · high')}</td></tr></table>
  <p class="note">Bounce rate at the wall (touches with an outcome; random lines in the same third beside it). Put walls bounced more when puts were richest (62% against 48%), the largest swing here, but it is 55 touches and no matching move at the call wall: noise-sized.</p></div></div></div>`;
}
async function dayBook() {
  const pick = $('#dbPick'); if (!pick) return;
  const mk = DBM || (PAIRS.includes(SEL) ? SEL : 'NQ'); DBM = mk;
  pick.innerHTML = PAIRS.map(p => `<span class="pill ${p === mk ? 'on' : ''}" data-p="${p}">${p}</span>`).join('');
  pick.querySelectorAll('.pill').forEach(el => el.onclick = () => { DBM = el.dataset.p; dayBook(); });
  const days = await loadRepl(mk); let h = '<table><tr><th>Date</th><th>Gamma</th><th>Hedge flow</th><th>Vol running</th><th>Travel</th><th class="num">Range ×σ</th><th class="num">Close vs open (σ)</th><th>Lines touched / bounced / broke</th></tr>';
  days.forEach((d, i) => {
    let t = 0, b = 0, k = 0;
    d.levels.filter(l => !(LINES[l.type] && LINES[l.type].x)).filter(l => !['exp_hi', 'exp_lo'].includes(l.type)).forEach(l => { if (l.ev && l.ev.touched) { t++; if (l.ev.race === 1) b++; if (l.ev.race === -1) k++; } });
    const rv = d.rvRatio == null ? '–' : d.rvRatio < 0.8 ? '<span class="v-nu">calm</span>' : d.rvRatio > 1.25 ? '<span class="v-lo">hot</span>' : 'normal';
    h += `<tr class="dbrow" data-i="${i}" style="cursor:pointer"><td>${d.date}</td><td>${d.regime}</td><td>${d.hf === 'damp' ? 'damping' : d.hf === 'reinf' ? 'reinforcing' : '–'}</td><td>${rv}</td><td>${d.travel || '–'}</td><td class="num">${d.hl.toFixed(2)}</td><td class="num ${d.oc > 0 ? 'v-up' : 'v-dn'}">${d.oc >= 0 ? '+' : ''}${d.oc.toFixed(2)}</td><td>${t} / <span class="v-up">${b}</span> / <span class="v-dn">${k}</span></td></tr>`;
  });
  $('#dbTable').innerHTML = h + '</table>';
  document.querySelectorAll('.dbrow').forEach(tr => tr.onclick = () => replay(mk, +tr.dataset.i, null));
}

// ── day strips and replay ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
async function loadRepl(p) { if (!REPL[p]) { try { REPL[p] = await (await fetch(BASE + `replay_${p}.json`)).json(); } catch (_) { REPL[p] = []; } } return REPL[p]; }
async function paintDays(el) {
  const t = el.dataset.t, days = await loadRepl(SEL); let h = '';
  days.forEach((d, i) => {
    const lv = d.levels.filter(l => l.type === t && l.ev); let k = 'x', tip = d.date + ': no ' + LINES[t].n.toLowerCase();
    if (lv.length) { const e = lv.find(l => l.ev.touched) || lv[0]; k = !e.ev.touched ? 'n' : e.ev.race === 1 ? 'b' : e.ev.race === -1 ? 'k' : 'u'; tip = d.date + ': ' + ({ b: 'bounced', k: 'broke through', u: 'touched, no clear move', n: 'not reached' }[k]); }
    h += `<a class="dot-${k}" title="${tip}" data-i="${i}"></a>`;
  });
  el.innerHTML = h; el.querySelectorAll('a').forEach(a => a.onclick = () => replay(SEL, +a.dataset.i, t));
}
async function replay(p, i, focus) {
  const d = (await loadRepl(p))[i]; if (!d) return;
  const W = 1100, H = 430, L = 12, Rr = 250, T = 14, B = 26, n = d.c.length, ps = [...d.h, ...d.l];
  let lo = Math.min(...ps), hi = Math.max(...ps); const near = d.levels.filter(l => Math.abs(l.price - d.spot) <= 2.2 * d.sigma); near.forEach(l => { lo = Math.min(lo, l.price); hi = Math.max(hi, l.price); });
  const pad = (hi - lo) * 0.05; lo -= pad; hi += pad; const X = j => L + j / (n - 1) * (W - L - Rr), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const dec = d.spot > 500 ? 1 : d.spot > 50 ? 2 : 5, f = v => v.toFixed(dec);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="background:#080b10;border-radius:10px">`;
  const lab = [];
  near.filter(l => SHOWX || !(LINES[l.type] && LINES[l.type].x)).sort((a, b) => b.price - a.price).forEach(l => {
    const c = (LINES[l.type] || {}).c || '#888', y = Y(l.price), e = l.ev, big = focus ? l.type === focus : true;
    s += `<line x1="${L}" x2="${W - Rr}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="${big ? 1.6 : 1}" opacity="${big ? .85 : .35}" ${['exp_hi', 'exp_lo'].includes(l.type) ? 'stroke-dasharray="6 5"' : ''}/>`;
    if (e && e.touched) { const x = X(Math.min(n - 1, Math.round(e.min / 5))); s += `<circle cx="${x}" cy="${y}" r="6" fill="none" stroke="${e.race === 1 ? '#46b87a' : e.race === -1 ? '#e8615f' : '#c9a23a'}" stroke-width="2.5"/>`; }
    lab.push([y, `${(LINES[l.type] || {}).n || l.type} ${f(l.price)}${e && e.touched ? (e.race === 1 ? ' · bounced' : e.race === -1 ? ' · broke' : ' · touched') : e ? '' : ''}`, c, big]);
  });
  let last = -99; lab.forEach(([y, t, c, big]) => { const yy = Math.max(y, last + 12); last = yy; s += `<text x="${W - Rr + 8}" y="${yy + 3}" fill="${c}" font-size="10.5" opacity="${big ? 1 : .55}">${t}</text>`; });
  s += `<polyline fill="none" stroke="#e6edf6" stroke-width="1.6" points="${d.c.map((v, j) => X(j).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ')}"/>`;
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; s += `<text x="${L + 2}" y="${Y(v) - 2}" fill="#6b7585" font-size="9.5">${f(v)}</text>`; }
  const hrs = [7, 9, 12, 15, 18, 21]; // UTC-ish labels from t0
  hrs.forEach(h2 => { const idx = Math.round(((h2 * 3600) - (d.t0 % 86400)) / 300); if (idx > 0 && idx < n) s += `<text x="${X(idx)}" y="${H - 8}" fill="#6b7585" font-size="9.5" text-anchor="middle">${String(h2).padStart(2, '0')}:00 UTC</text>`; });
  s += '</svg>';
  const rows = d.levels.filter(l => SHOWX || !(LINES[l.type] && LINES[l.type].x)).sort((a, b) => b.price - a.price).map(l => { const e = l.ev; return `<tr><td>${(LINES[l.type] || {}).n || l.type}</td><td class="num">${f(l.price)}</td><td class="num">${(l.strength * 100).toFixed(0)}%</td><td>${!e ? 'start on it' : !e.touched ? '<span class="note">not reached</span>' : e.race === 1 ? '<span class="v-up">bounced</span>' : e.race === -1 ? '<span class="v-dn">broke through</span>' : '<span class="v-lo">touched, no clear move</span>'}${e && e.touched ? ` <span class="note">${e.hb || ''}</span>` : ''}</td></tr>`; }).join('');
  $('#mbody').innerHTML = `<h2 style="margin:0 0 4px;font-size:15px">${p} · ${d.date}</h2><p class="sub">Regime <b>${d.regime}</b> · volatility running <b>${d.rvRatio == null ? '–' : d.rvRatio < 0.8 ? 'calm' : d.rvRatio > 1.25 ? 'hot' : 'normal'}</b> · travel <b>${d.travel || '–'}</b> · hedge flow <b>${d.hf === 'damp' ? 'damping' : d.hf === 'reinf' ? 'reinforcing' : '–'}</b> · strongest expiry <b>${d.book}</b> · implied move ±${f(d.sigma)} (${(d.sigma / d.spot * 100).toFixed(2)}%) · the day's range was <b>${d.hl.toFixed(2)}×</b> that. Line colours follow the cards; the ring marks the first touch (green bounced, red broke, gold no clear move). Early-session bars only start from the capture, about 06:30 London.</p>${s}
  <table style="margin-top:10px"><tr><th>Line</th><th class="num">price</th><th class="num">strength</th><th>what happened</th></tr>${rows}</table>`;
  $('#mbody').insertAdjacentHTML('beforeend', `<p class="note"><label style="cursor:pointer"><input type="checkbox" id="xbox" ${SHOWX ? 'checked' : ''}> also draw the all-expiry walls, open-interest peaks and vanna peaks</label></p>`);
  $('#xbox').onchange = e => { SHOWX = e.target.checked; replay(p, i, focus); };
  $('#modal').style.display = 'block';
}
$('#mx').onclick = () => $('#modal').style.display = 'none';
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').style.display = 'none'; };

(async () => {
  try { R = await (await fetch(BASE + 'results.json')).json(); }
  catch (e) { $('#app').textContent = 'Could not load results.json: ' + e.message; return; }
  try { R2 = await (await fetch(BASE + 'results2.json')).json(); } catch (_) { R2 = null; }
  try { R3 = await (await fetch(BASE + 'results3.json')).json(); } catch (_) { R3 = null; }
  rail(); stats(); render();
})();
