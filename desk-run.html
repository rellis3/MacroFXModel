<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desk Run — analysts and the Head of Desk book</title>
<style>
:root{--bg:#0b0d10;--bg2:#12161c;--bg3:#181d24;--line:#262c35;--line2:#333b46;--tx:#eef1f5;--tx2:#a8b1bd;--tx3:#71798a;--acc:#e0a339;--up:#3fb27f;--dn:#e5534b;--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 80px}
a{color:var(--acc)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 0 16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.top h1{margin:0;font-size:22px;font-weight:650;letter-spacing:.1em;text-transform:uppercase}
.top h1 span{color:var(--acc)}
.top .sub{color:var(--tx2);font-size:13px}
.top .right{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.btn{background:var(--bg3);border:1px solid var(--line2);color:var(--tx2);padding:8px 14px;border-radius:5px;font-size:13px;font-family:var(--mono);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--acc);color:var(--tx)}
select.btn{padding:7px 10px}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:18px;overflow-x:auto}
.panel h2{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:650}
.untested{display:inline-block;font:11px var(--mono);color:var(--acc);border:1px solid var(--acc);border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:middle}
.headline{font-size:18px;font-weight:600;margin:0 0 6px}
.muted{color:var(--tx3);font-size:12.5px}
.ccys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ccy{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.ccy b{font-family:var(--mono)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
th{text-align:left;color:var(--tx3);font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:0 8px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--mono);font-weight:650;white-space:nowrap}
.r{font:12px var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap}
.STRONG_LONG{background:#1d4d36;color:#8ff0bf}.LONG{background:#173326;color:var(--up)}.FLAT{background:var(--bg3);color:var(--tx2)}
.SHORT{background:#3a1a19;color:var(--dn)}.STRONG_SHORT{background:#5a1f1c;color:#ffb3ad}.REVIEW{background:#3b3014;color:var(--acc)}
.grp td{color:var(--acc);font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding-top:14px}
details{border-top:1px solid var(--line);padding:8px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600}
summary .muted{font-weight:400;margin-left:6px}
.pt{margin:6px 0 0 14px;font-size:13.5px}
.pt code{font:12px var(--mono);color:var(--tx3)}
.imp{font:12px var(--mono);margin-left:6px}
.pos{color:var(--up)}.neg{color:var(--dn)}
.fail{color:var(--dn)}
.size{font:12px var(--mono);color:var(--tx2)}
.plan{font-size:12.5px;color:var(--tx2);margin-top:3px}
.rank{font:13px var(--mono);letter-spacing:.04em}
.case{margin:6px 0 0 14px;font-size:13.5px}
.case b{color:var(--tx2);font-weight:600}
h3{margin:14px 0 6px;font-size:14px}
.empty{color:var(--tx2);padding:30px 0;text-align:center}
.running{border-color:var(--acc);text-align:center;padding:26px 18px}
.running .big{font-size:18px;font-weight:600;color:var(--tx);margin-bottom:6px}
.running .bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin:14px auto 0;max-width:420px}
.running .bar i{display:block;height:100%;width:30%;background:var(--acc);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
.up{color:#19d3a0}.dn{color:#ff5d73}
.tvx{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tvx select.btn{max-width:100%}
#tvTxt{width:100%;height:200px;margin-top:10px;background:var(--bg3);color:var(--tx);border:1px solid var(--line2);border-radius:6px;font:12px var(--mono)}
.desc{display:inline-block;font:11px var(--mono);color:var(--tx2);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:middle}
.pp-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0}
.pp-tiles div{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.pp-tiles b{display:block;font:600 16px var(--mono)}
.pp-tiles span{color:var(--tx3);font-size:11.5px}
table.pp{min-width:620px;font-size:12.5px}
table.pp td{font-family:var(--mono);white-space:nowrap;padding:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Desk <span>Run</span></h1>
    <div class="sub">global → currency → asset · analysts, then the Head of Desk · <span class="untested">context, untested</span></div>
    <div class="right">
      <select id="day" class="btn" aria-label="Day"></select>
      <button id="run" class="btn" type="button" title="Full run: analysts, the global and currency debates, asset desks, risk desk, then the Head (~32 calls, about $1.50-2)">Run now</button>
      <button id="quick" class="btn" type="button" title="Analysts and the Head only (~12 calls, about $1)">Quick run</button>
      <a class="btn" href="desk-office.html">Desk Office →</a>
    </div>
  </div>
  <div id="status" class="muted"></div>
  <div id="out"></div>
</div>
<script>
const GROUPS = [['fx_majors', 'FX majors'], ['fx_crosses', 'FX crosses'], ['indices', 'Indices'], ['metals', 'Metals'], ['energy', 'Energy'], ['ags', 'Ags'], ['crypto', 'Crypto']];
const LAYERS = ['global', 'currency', 'asset', 'evidence'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sgn = v => v > 0 ? `<span class="pos">+${v}</span>` : v < 0 ? `<span class="neg">${v}</span>` : `<span>${v ?? '–'}</span>`;
const $ = id => document.getElementById(id);

async function getJson(url, opts) { const r = await fetch(url, opts); return r.json(); }

function render(run, universe) {
  const h = run.head, parts = [];
  if (h?.ok) {
    const b = h.book;
    parts.push(`<div class="panel"><p class="headline">${esc(b.headline)}</p>
      <div class="muted">Global tone: <b>${esc(b.global.tone.replace('_', '-'))}</b> · ${esc(run.date)} · pack ${esc(run.packHealth?.ok)} ok of ${esc(run.packHealth?.total)} feeds</div>
      <p>${esc(b.global.summary)}</p>
      ${b.risks.length ? `<div class="muted">Risks: ${b.risks.map(esc).join(' · ')}</div>` : ''}
      ${b.gaps.length ? `<div class="muted">Could not see: ${b.gaps.map(esc).join(' · ')}</div>` : ''}</div>`);
    parts.push(`<div class="panel"><h2>Currencies</h2><div class="ccys">${Object.entries(b.currencies).map(([c, v]) =>
      `<div class="ccy"><b>${c}</b> ${sgn(v.bias)}<div class="muted">${esc(v.why)}</div></div>`).join('')}</div></div>`);
    if (b.exposure) {
      const e = b.exposure, cell = k => `<div class="ccy"><b>${k}</b> ${sgn(e.after[k])}${e.before[k] !== e.after[k] ? ` <span class="muted">(was ${e.before[k]})</span>` : ''}</div>`;
      parts.push(`<div class="panel"><h2>Net exposure by currency · cap ${e.cap}</h2><div class="ccys">${Object.keys(e.after).map(cell).join('')}</div>
        <p class="muted">Each card's size, signed, added to the currencies it touches (a pair is long its base and short its quote; commodities and crypto count against USD; indices are left out). ${e.cuts.length ? `Over the cap: ${e.cuts.map(x => `${x.ccy} ${x.net} → cards on that side scaled ×${x.factor}`).join('; ')}.` : 'Nothing was over the cap.'}</p></div>`);
    }
    const rows = GROUPS.map(([g, label]) => {
      const names = universe?.[g] ?? [];
      if (!names.length) return '';
      return `<tr class="grp"><td colspan="4">${label}</td></tr>` + names.map(n => { const c = b.instruments[n] ?? { rating: 'REVIEW' };
        const plan = c.plan && (c.plan.zone || c.plan.timing) ? `<div class="plan">Plan: ${esc(c.plan.zone)}${c.plan.timing ? ` · ${esc(c.plan.timing)}` : ''}${c.plan.invalidation ? ` · wrong if ${esc(c.plan.invalidation)}` : ''}</div>` : '';
        return `<tr><td class="n">${n}</td><td><span class="r ${c.rating}">${c.rating.replace('_', ' ')}</span><div class="muted">${esc(c.conviction)}</div>${c.size != null ? `<div class="size">size ${c.size}${c.sizeBeforeCap != null ? ` <span class="muted">(was ${c.sizeBeforeCap}, ${esc((c.cappedBy ?? []).join('/'))} cap)</span>` : ''}</div>` : ''}</td><td>${esc(c.why) || '<span class="muted">no card</span>'}${plan}</td><td class="muted">${esc(c.invalidation)}</td></tr>`; }).join('');
    }).join('');
    parts.push(`<div class="panel"><h2>Instruments · five-step scale</h2><table><thead><tr><th>Instrument</th><th>Rating</th><th>Why</th><th>Wrong if</th></tr></thead><tbody>${rows}</tbody></table>
      ${h.notes?.length ? `<p class="muted">Repairs: ${h.notes.map(esc).join(' · ')}</p>` : ''}</div>`);
    parts.push(exportPanel(b));
    parts.push(`<div class="panel" id="paper"><h2>Paper trades (the alerts' own rules)<span class="desc">description</span></h2><div class="muted">Loading…</div></div>`);
  } else {
    parts.push(`<div class="panel fail">The Head of Desk did not produce a book: ${esc((h?.errors ?? []).join('; '))}</div>`);
  }
  if (run.newsletter) parts.push(renderNewsletter(run));
  if (run.debate) parts.push(renderDebate(run.debate));
  const an = Object.values(run.analysts).sort((a, b) => LAYERS.indexOf(a.layer) - LAYERS.indexOf(b.layer));
  parts.push(`<div class="panel"><h2>Analysts</h2>${an.map(a => a.ok ? `<details><summary>${esc(a.id)}<span class="muted">${esc(a.layer)} · ${esc(a.report.confidence)} · ${a.input?.usable ?? '?'} of ${a.input?.feeds ?? '?'} feeds</span><div style="font-weight:400">${esc(a.report.headline)}</div></summary>
      ${a.report.points.map(p => `<div class="pt">${esc(p.claim)} <code>${esc(p.evidence)}</code>${Object.entries(p.impact).map(([k, v]) => `<span class="imp">${k} ${sgn(v)}</span>`).join('')}</div>`).join('')}
      ${a.report.gaps.length ? `<div class="pt muted">Gaps: ${a.report.gaps.map(esc).join(' · ')}</div>` : ''}</details>`
    : `<details><summary class="fail">${esc(a.id)} failed</summary><div class="pt muted">${esc(a.errors.join('; '))}</div></details>`).join('')}</div>`);
  parts.push(`<p class="muted">Tokens: in ${run.usage?.in ?? '?'} · out ${run.usage?.out ?? '?'} · finished ${esc(run.finishedAt)} · ${esc(run.trigger ?? '')}${run.resumed ? ` · resumed after a server restart (${run.resumed.stages} finished stages kept, not paid for twice)` : ''}. This book is context from the analyst pipeline (plans/DESK_ANALYST_PIPELINE.md). It is not a tested signal: it is scored each evening under forge/DESK_ANALYST_PIPELINE_PREREG.md and judged only at the end of that test.</p>`);
  $('out').innerHTML = parts.join('');
  CUR = run;
  if (h?.ok) { wireExport(run); loadPaper(run.date); }
  const cmp = document.getElementById('nlCmp');
  if (cmp) cmp.onclick = () => { const box = document.getElementById('nlCmpBox'); const show = box.style.display === 'none'; box.style.display = show ? 'grid' : 'none'; if (show) box.querySelectorAll('iframe').forEach(f => { if (f.src === 'about:blank') f.src = f.dataset.src; }); };
}

// ── Export to TradingView (js/deskBookPine.js): the day's lines, zone, invalidation and first target as a Pine script ──
let CUR = null, PINE = null;
const pineMod = () => (PINE ??= import('./js/deskBookPine.js'));
const PAPER_NOTE = "Description of trading the watcher's alerts, not the pre-registered test; few days so far.";
function exportPanel(b) {
  const names = Object.keys(b.instruments ?? {}).sort(), live = names.filter(n => /LONG|SHORT/.test(b.instruments[n].rating) && b.instruments[n].size > 0);
  const opt = n => `<option value="${esc(n)}">${esc(n)} · ${esc(String(b.instruments[n].rating).replace('_', ' ').toLowerCase())}</option>`;
  return `<div class="panel"><h2>Export to TradingView<span class="desc">description, not the scored test (prereg H1)</span></h2>
    <div class="tvx"><select id="tvInst" class="btn" aria-label="Market"><option value="__all">All markets · one script</option>
      ${live.length ? `<optgroup label="Cards with a position">${live.map(opt).join('')}</optgroup>` : ''}<optgroup label="Every market">${names.map(opt).join('')}</optgroup></select>
      <button class="btn" type="button" id="tvCopy">Copy Pine</button><button class="btn" type="button" id="tvDl">Download .pine</button><button class="btn" type="button" id="tvCsv">Download CSV</button></div>
    <p class="muted" id="tvHow">Draws this day only, on any timeframe: the open and the up and down p50 / p75 / p90 lines, the entry zone as a box from 08:00 to 21:00 London, the invalidation in red and the first target (the p50 line on the card's side) heavier, with a label giving the rating, size, conviction and why. "All markets" draws whichever card matches the chart's symbol; pick one by hand in the indicator's settings if it does not match.</p>
    <textarea id="tvTxt" readonly spellcheck="false" style="display:none" aria-label="Pine script"></textarea></div>`;
}
function saveFile(name, text, type) {
  const a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type }));
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function pineNow(run) {
  const m = await pineMod(), b = run.head.book, inst = $('tvInst').value;
  return { inst, text: inst === '__all' ? m.pineForBook(b, { date: run.date }) : m.pineForCard(inst, b.instruments[inst], { date: run.date }), oanda: inst === '__all' ? null : m.oandaOf(inst) };
}
function wireExport(run) {
  const show = (p, copied) => {
    $('tvTxt').value = p.text; $('tvTxt').style.display = '';
    $('tvHow').innerHTML = `${copied ? 'Copied. ' : 'Select all in the box and copy. '}In TradingView: Pine Editor → new indicator → paste over everything → Save → Add to chart${p.oanda ? `, on the <b>OANDA:${esc(p.oanda.replace('_', ''))}</b> chart` : ''}. The prices are OANDA's; a futures chart trades at a small basis to them. It is a snapshot of ${esc(run.date)}: make a fresh copy each morning.`;
  };
  $('tvCopy').onclick = async () => { const p = await pineNow(run); let ok = false; try { await navigator.clipboard.writeText(p.text); ok = true; } catch {} show(p, ok); };
  $('tvDl').onclick = async () => { const p = await pineNow(run); saveFile(`desk-${p.inst === '__all' ? 'book' : p.inst}-${run.date}.pine`, p.text, 'text/plain'); show(p, false); };
  $('tvCsv').onclick = async () => { const m = await pineMod(); saveFile(`desk-book-${run.date}.csv`, m.csvForBook(run.head.book, { date: run.date }), 'text/csv'); };
}

// ── Paper trades on the watcher's own rules (GET /api/desk-paper, js/deskPaperTrades.js) ──
const fx = (v, dp = 2) => (v == null || !Number.isFinite(+v) ? '–' : `${+v > 0 ? '+' : ''}${(+v).toFixed(dp)}`);
const lt = iso => (iso ? new Date(iso).toLocaleTimeString('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit' }) : '–');
async function loadPaper(date) {
  const box = $('paper'); if (!box) return;
  const [d, hist] = await Promise.all([getJson(`/api/desk-paper?date=${date}`).catch(e => ({ ok: false, error: e.message })), getJson('/api/desk-paper/history').catch(() => null)]);
  if (CUR?.date !== date || !document.body.contains(box)) return;
  const head = `<h2>Paper trades (the alerts' own rules)<span class="desc">description</span></h2><p class="muted"><b>${esc(PAPER_NOTE)}</b></p>`;
  const tot = hist?.total, totHtml = tot?.days ? `<p class="muted">Running total over ${tot.days} day${tot.days === 1 ? '' : 's'} (${esc(tot.from)} to ${esc(tot.to)}): ${tot.trades} trades, ${tot.wins} won${tot.hitRate != null ? ` (${Math.round(tot.hitRate * 100)}%)` : ''}, mean ${fx(tot.meanR)} u a trade, size × R ${fx(tot.sumSizeR)} after costs (${fx(tot.sumGrossSizeR)} before).</p>` : '<p class="muted">No finished day is stored yet: the first is saved after the evening score (21:10 London).</p>';
  if (!d?.ok) { box.innerHTML = `${head}<p class="muted">${esc(d?.error ?? 'Could not load the paper trades.')}</p>${totHtml}`; return; }
  const s = d.summary, why = { target: 'first target', invalid: 'invalidation', close: '21:00 close', 'no-entry': 'not entered' };
  const rows = d.trades.slice().sort((a, b) => (a.reason === 'no-entry') - (b.reason === 'no-entry') || a.inst.localeCompare(b.inst)).map(t => t.reason === 'no-entry'
    ? `<tr><td>${esc(t.inst)}</td><td class="${t.dir > 0 ? 'up' : 'dn'}">${t.dir > 0 ? 'long' : 'short'}</td><td>${t.size}</td><td colspan="6" class="muted">not entered: ${esc(t.note ?? '')}</td></tr>`
    : `<tr><td>${esc(t.inst)}</td><td class="${t.dir > 0 ? 'up' : 'dn'}">${t.dir > 0 ? 'long' : 'short'}</td><td>${t.size}</td><td>${lt(t.entryAt)} ${t.entry}${t.entryMode === 'open-08:00' ? ' <span class="muted">(08:00, no zone)</span>' : ''}</td><td>${lt(t.exitAt)} ${t.exit}</td><td>${why[t.reason]}</td><td class="${t.R > 0 ? 'pos' : t.R < 0 ? 'neg' : ''}">${fx(t.R)}</td><td>${fx(t.pct, 3)}%</td><td>${fx(t.sizeR)}</td></tr>`).join('');
  box.innerHTML = `${head}<div class="muted">${esc(d.date)} · ${d.complete ? 'the day is over' : 'live so far (the day ends 21:00 London)'} · in at the entry zone (or the 08:00 London open when the card names no zone), out at the first target, the invalidation or 21:00 London; a bar touching both counts as the invalidation. Cards that a session update flipped or flattened are left out, as the watcher drops them. Costs: one spread per trade.</div>
    <div class="pp-tiles"><div><b>${s.trades}</b><span>trades (${s.noEntry} not entered)</span></div><div><b>${s.wins}</b><span>won${s.hitRate != null ? ` · ${Math.round(s.hitRate * 100)}%` : ''}</span></div>
      <div><b>${fx(s.meanR)}</b><span>mean R (u) after costs</span></div><div><b>${fx(s.sumSizeR)}</b><span>size × R after costs</span></div><div><b>${fx(s.sumGrossSizeR)}</b><span>size × R before costs</span></div>
      <div><b>${s.byReason.target}/${s.byReason.invalid}/${s.byReason.close}</b><span>target / invalid / 21:00</span></div></div>
    ${d.trades.length ? `<div style="overflow-x:auto"><table class="pp"><thead><tr><th>Market</th><th>Side</th><th>Size</th><th>In (London)</th><th>Out</th><th>Why out</th><th>R (u)</th><th>% of price</th><th>Size × R</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="muted">The watcher had no sized card to trade on this day.</p>'}
    <p class="muted">R is the move in the day's unit u (the average distance from the open to the two p50 lines), after costs; % of price is the same move as a percentage of the entry.</p>${totHtml}`;
}

// The desk edition of The Chain, beside today's regular issue (owner, 2026-11-03: compare before anything is replaced).
function renderNewsletter(run) {
  const n = run.newsletter;
  if (!n.ok) return `<div class="panel"><h2>Newsletter · desk edition</h2><div class="fail">The writer failed: ${esc((n.errors ?? []).join('; '))}</div></div>`;
  const desk = n.archiveId ? `/api/newsletter/issue?id=${encodeURIComponent(n.archiveId)}` : null, reg = `/api/newsletter/issue?id=${encodeURIComponent(`daily-${run.date}`)}`;
  return `<div class="panel"><h2>Newsletter · desk edition, beside the regular issue</h2>
    <p class="headline">${esc(n.issue.subject)}</p><p>${esc(n.issue.standfirst)}</p>
    ${n.notes?.length ? `<p class="muted">Writer notes: ${n.notes.map(esc).join(' · ')}</p>` : ''}
    <p style="display:flex;gap:8px;flex-wrap:wrap">${desk ? `<a class="btn" href="${desk}" target="_blank" rel="noopener">Open the desk edition</a>` : '<span class="muted">not saved to the archive</span>'}
      <a class="btn" href="${reg}" target="_blank" rel="noopener">Open today's regular issue</a>
      ${desk ? `<button class="btn" type="button" id="nlCmp">Compare side by side</button>` : ''}</p>
    <div id="nlCmpBox" style="display:none;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px;margin-top:10px">
      <iframe title="Desk edition" src="about:blank" data-src="${desk ?? ''}" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:6px;background:#fff"></iframe>
      <iframe title="Regular issue" src="about:blank" data-src="${reg}" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:6px;background:#fff"></iframe>
    </div>
    <p class="muted">The full desk edition is your regular issue with the desk's pages and charts added. Build it on <a href="atlas.html">Atlas</a> (Build daily newsletter builds both). Until then, the desk edition here is a short text version, and today's regular issue shows "not found".</p></div>`;
}

function caseHtml(label, stage, subj) {
  if (!stage?.ok) return `<div class="case fail">${esc(label)}: failed (${esc((stage?.errors ?? []).join('; '))})</div>`;
  const c = stage.view.cases[subj];
  return `<div class="case"><b>${esc(label)}</b> (${esc(c?.strength ?? '–')}): ${esc(c?.argument ?? 'no argument')}${subj === 'GLOBAL' && stage.view.rebuttal ? `<div class="muted">Rebuttal: ${esc(stage.view.rebuttal)}</div>` : ''}</div>`;
}
function renderDebate(d) {
  const out = ['<div class="panel"><h2>The debate · global → currency → asset → risk</h2>'];
  const g = d.global;
  out.push('<h3>Global ruling</h3>');
  if (g.ok) out.push(`<div><b>${esc(g.view.tone.replace('_', '-'))}</b> · ${esc(g.view.conviction)} conviction</div><p>${esc(g.view.summary)}</p>
    ${g.view.drivers.length ? `<div class="muted">Decided by: ${g.view.drivers.map(esc).join(' · ')}</div>` : ''}${g.view.flip.length ? `<div class="muted">Would flip if: ${g.view.flip.map(esc).join(' · ')}</div>` : ''}`);
  else out.push(`<div class="fail">The Global Manager failed: ${esc(g.errors.join('; '))}</div>`);
  out.push(`<details><summary>The cases<span class="muted">Risk-On vs Risk-Off</span></summary>${caseHtml('Risk-On', g.debate?.risk_on, 'GLOBAL')}${caseHtml('Risk-Off', g.debate?.risk_off, 'GLOBAL')}</details>`);
  const c = d.currency;
  out.push('<h3>Currency ruling</h3>');
  if (c.ok) {
    out.push(`<div class="rank">Strongest → weakest: ${c.view.ranking.join(' › ')}</div>`);
    out.push(Object.entries(c.view.currencies).map(([k, v]) => `<details><summary>${k} ${sgn(v.bias)}<span class="muted">${esc(v.conviction)} · ${esc(v.why)}</span></summary>
      ${caseHtml('Strengthen', c.debate?.ccy_strengthen, k)}${caseHtml('Weaken', c.debate?.ccy_weaken, k)}${v.flip ? `<div class="case muted">Would change if: ${esc(v.flip)}</div>` : ''}</details>`).join(''));
  } else out.push(`<div class="fail">The Currency Manager failed: ${esc(c.errors.join('; '))}</div>`);
  out.push('<h3>Asset desks</h3>' + Object.entries(d.assets).map(([grp, a]) => `<div class="case"><b>${esc(grp.replace('_', ' '))}</b>: ${a.ok ? esc(a.view.summary) : `<span class="fail">failed (${esc(a.errors.join('; '))})</span>`}</div>`).join(''));
  out.push('<h3>Risk desk</h3>' + Object.entries(d.risk).map(([k, r]) => r.ok ? `<details><summary>${esc(k.replace('risk_', ''))}<span class="muted">${esc(r.view.headline)}</span></summary>
      ${r.view.adjustments.map(a => `<div class="case">${esc(a.target)}: size ${a.size}${a.veto ? ' · <b class="fail">veto</b>' : ''} · ${esc(a.reason)}</div>`).join('')}
      ${r.view.warnings.length ? `<div class="case muted">Warnings: ${r.view.warnings.map(esc).join(' · ')}</div>` : ''}</details>` : `<div class="case fail">${esc(k)} failed</div>`).join(''));
  if (d.failed.length) out.push(`<p class="muted">Stages that failed: ${d.failed.map(esc).join(', ')}</p>`);
  out.push('</div>');
  return out.join('');
}

async function load(date) {
  $('status').textContent = 'Loading…';
  const [run, feeds] = await Promise.all([getJson(`/api/desk-run${date ? `?date=${date}` : ''}`), getJson('/api/desk-pack/feeds').catch(() => null)]);
  if (!run.ok) { $('status').textContent = ''; $('out').innerHTML = `<div class="panel empty">${esc(run.error)}</div>`; return; }
  $('status').textContent = '';
  render(run, feeds?.universe ?? null);
}

async function loadDays() {
  const idx = await getJson('/api/desk-run/index').catch(() => ({ days: [] }));
  const days = (idx.days ?? []).slice().reverse();
  $('day').innerHTML = days.length ? days.map(d => `<option value="${d.date}">${d.date}${d.headOk ? '' : ' (head failed)'}</option>`).join('') : '<option value="">no runs yet</option>';
}

// What each stage means to the reader, and roughly how long the run has left.
const STAGE_TEXT = s => /desk pack/.test(s) ? 'Collecting this morning\'s data (the Desk Pack): about 1-2 minutes'
  : /analysts/.test(s) ? `The analysts are reading their data: ${s.replace(/^analysts\s*/, '') || 'starting'}`
  : /debate/.test(s) ? `The advocates are arguing (${s})` : /ruling/.test(s) ? `The manager is ruling (${s})`
  : /asset desks/.test(s) ? `The asset desks are rating their groups (${s})` : /risk desk/.test(s) ? 'The risk desk is sizing the book'
  : /resuming/.test(s) ? 'Picking the run up again after a server restart'
  : /newsletter/.test(s) ? 'Writing the desk edition of the newsletter' : /head/.test(s) ? 'The Head of Desk is writing the book' : s;
function showRunning(j) {
  const mins = Math.floor((Date.now() - j.startedAt) / 60000), secs = Math.floor((Date.now() - j.startedAt) / 1000) % 60;
  $('status').textContent = '';
  $('out').innerHTML = `<div class="panel running"><div class="big">Desk run in progress</div>
    <div>${esc(STAGE_TEXT(j.stage ?? ''))}</div>${j.resumes ? `<div class="muted">The server restarted during this run (a deploy), so it picked up where it stopped${j.resumedStages ? `: ${j.resumedStages} finished stages kept, only the rest are being run` : ''}.</div>` : ''}<div class="muted">${mins}m ${String(secs).padStart(2, '0')}s so far · a full run takes about 20-35 minutes (51 markets; the Head and the control each write a card for every one), a quick run about 10-15 · this page updates by itself</div>
    <div class="bar"><i></i></div></div>`;
}
let pollTimer = null;
async function poll() {
  clearTimeout(pollTimer);
  const s = await getJson('/api/desk-run/status');
  const j = s.job;
  if (j?.status === 'running') { showRunning(j); pollTimer = setTimeout(poll, 5000); return; }
  pollTimer = null;   // the run is over: stop following it
  if (j?.status === 'error') { $('status').textContent = ''; $('out').innerHTML = `<div class="panel fail">The run failed: ${esc(j.error)}</div>`; return; }
  await loadDays(); await load();
}

async function start(mode) {
  $('run').disabled = $('quick').disabled = true;
  $('out').innerHTML = '<div class="panel running"><div class="big">Starting the desk run…</div><div class="bar"><i></i></div></div>';
  const r = await getJson(`/api/desk-run${mode === 'quick' ? '?mode=quick' : ''}`, { method: 'POST' });
  $('run').disabled = $('quick').disabled = false;
  if (!r.ok && !r.job) { $('out').innerHTML = `<div class="panel fail">${esc(r.error)}</div>`; return; }
  poll();   // 409 (already running) also lands here and shows the run in progress
}
$('run').addEventListener('click', () => start('full'));
$('quick').addEventListener('click', () => start('quick'));
$('day').addEventListener('change', e => load(e.target.value));
// Phones pause a page that is not on screen, so a run can finish while the page still shows "1 of 11" from when it
// was last visible (2026-11-03). Coming back to the page checks again at once.
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) return;
  const s = await getJson('/api/desk-run/status').catch(() => null);
  if (s?.job?.status === 'running' || pollTimer != null) poll();   // pollTimer is set only while a run is being followed
});

// On open: a run in progress takes the page over; otherwise show the latest saved run.
getJson('/api/desk-run/status').then(async s => { await loadDays(); if (s.job?.status === 'running') poll(); else load(); });
</script>
</body>
