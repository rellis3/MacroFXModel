// they add up to. This is the plain-English answer to "what is this report telling
// me", with one sub-read per panel so every number is already interpreted before you
// scroll to it. Nothing here is a second opinion — it reads the same fields the
// panels do and says them in English. Modelled on the OI dashboard's "Today's read"
// deliberately, so the two desks explain themselves the same way.
//
// Traffic lights are NOT directional, same convention as the OI page. Green = nothing
// here argues against your plan. Amber = something is changing, or needs care. Red =
// this contradicts a trade you might be about to take. Direction comes from your own
// system; this only says how far to trust it.
function _rd(light, panel, headline, detail){
  const col = light==='ok' ? 'var(--ok)' : light==='warn' ? 'var(--warn)'
            : light==='bad' ? 'var(--long)' : 'var(--tx3)';
  return '<div class="rd"><div class="rd-h"><span class="rdot" style="background:'+col+'"></span>'+panel+'</div>'
    + '<div class="rd-v">'+headline+'</div>'+(detail?'<div class="rd-d">'+detail+'</div>':'')+'</div>';
}

function thisWeeksRead(){
  const all = (DATA && DATA.instruments) || [];
  if(!all.length) return '';
  const ranked = all.filter(x => pctOf(x) != null);
  const ext    = extremes();
  const longs  = ext.filter(x => pctOf(x) >= 90), shorts = ext.filter(x => pctOf(x) <= 10);
  const rdate  = (all[0] && all[0].reportDate) || DATA.reportDate;
  const ageD   = rdate ? Math.round((Date.now()-Date.parse(rdate))/864e5) : null;
  const nm     = x => esc(dispSym(x));

  // ── headline ─────────────────────────────────────────────────────────────
  // How much of the board is stretched at once. A single crowded market is a story
  // about that market; a quarter of the board crowded at once is usually one macro
  // theme wearing several costumes, and those are read differently.
  const share = ranked.length ? ext.length/ranked.length : 0;
  const reg = !ranked.length ? 'NOT ENOUGH HISTORY'
    : !ext.length            ? 'CALM — nothing is stretched'
    : share >= 0.25          ? 'STRETCHED — much of the board is crowded'
    : share >= 0.10          ? 'PATCHY — a handful of crowded markets'
                             : 'QUIET — one or two crowded markets';
  const regCol = !ranked.length ? 'var(--tx3)' : !ext.length ? 'var(--ok)'
    : share >= 0.25 ? 'var(--warn)' : 'var(--tx2)';
  const verdict = !ranked.length
    ? 'No market has enough trailing history behind it to rank yet.'
    : !ext.length
      ? 'Nothing on the board sits at a 90th/10th-percentile extreme of its own history. <b>Positioning is not the constraint this week</b> — whatever you trade, the crowd is not obviously already in the way.'
      : '<b>'+ext.length+' of '+ranked.length+'</b> ranked markets sit at a 90th/10th-percentile extreme &mdash; <b>'
        + longs.length+'</b> crowded long, <b>'+shorts.length+'</b> crowded short. '
        + (share >= 0.25
            ? 'That is a lot at once, which usually means <b>one shared macro theme</b> rather than that many separate stories &mdash; read the asset-class line below before treating any single one as idiosyncratic.'
            : 'That is a normal number, so read each on its own rather than as a board-wide theme.');

  let top = '<div class="rd-top"><div class="rd-reg" style="color:'+regCol+'">'+reg+'</div>'
    + '<div class="rd-say">'+verdict+'</div>';

  if(ext.length){
    const top3 = ext.slice(0,3).map(x => '<b>'+nm(x)+'</b> ('+ord(pctOf(x))+(pctOf(x)>=90?', long':', short')+')').join(' &middot; ');
    top += '<div class="rd-say"><b>Most stretched right now:</b> '+top3
      + '. Those are the readings furthest from their own historical middle, so they are where an unwind would have the least standing in its way.</div>';
  }

  // Which asset classes lean as a block. This is the question the old group-median
  // table existed to answer, said in a sentence instead of left as a number to read.
  const leans = [...new Set(ranked.map(x => x.group))].map(g => {
    const srt = ranked.filter(x => x.group===g).map(pctOf).sort((a,b)=>a-b);
    return { g, n: srt.length, med: srt[srt.length>>1] };
  }).filter(x => x.n >= 2 && (x.med >= 70 || x.med <= 30)).sort((a,b) => Math.abs(50-b.med)-Math.abs(50-a.med));
  top += '<div class="rd-say"><b>Where the crowd is as a block:</b> '
    + (leans.length
        ? leans.map(x => '<b>'+esc(GRP_NAME[x.g]||x.g)+'</b> leans '+(x.med>=70?'long':'short')+' (median '+ord(x.med)+' across '+x.n+')').join(' &middot; ')
          + '. A whole class leaning one way is one macro position, not '+leans.length+' independent ones — sizing them as separate trades understates the risk actually being carried.'
        : 'no asset class has a median past the 70th/30th percentile, so nothing is leaning as a block — each crowded market below is its own story.')
    + '</div>';

  top += '<div class="rd-say"><b>What this can and cannot tell you:</b> COT is a <b>Tuesday</b> snapshot published <b>Friday</b>'
    + (ageD != null ? ', so what is below is <b>'+ageD+' days old</b>' : '')
    + '. Positioning moved inside that gap and you cannot see how. Every number here is a <b>crowding conditioner</b> — it says how much fuel is left for more of the same, never when it turns. Nothing on this page is a timing signal or an entry.</div></div>';

  // ── sub-reads, one per panel below ───────────────────────────────────────
  const sub = [];

  // Spotlight
  const mostLong = longs[0], mostShort = shorts[0];
  sub.push(_rd(!ext.length ? 'ok' : share>=0.25 ? 'warn' : 'ok', 'Spotlight',
    !ext.length ? 'Nothing at an extreme'
      : (mostLong ? 'Most crowded long <b>'+nm(mostLong)+'</b> ('+ord(pctOf(mostLong))+')' : 'No crowded longs')
        + ' &middot; ' + (mostShort ? 'most crowded short <b>'+nm(mostShort)+'</b> ('+ord(pctOf(mostShort))+')' : 'no crowded shorts'),
    !ext.length ? 'No market is near the edge of its own range. There is nothing here to fade, and nothing warning you off a trend trade either.'
      : 'These are the two ends of the board. Sitting at the 100th percentile does not mean expensive or wrong — it means the position is already on, so the marginal buyer who would push it further has mostly already bought.'));

  // Positioning ledger
  sub.push(_rd(leans.length ? 'warn' : 'ok', 'Positioning ledger',
    leans.length ? '<b>'+leans.length+'</b> asset class'+(leans.length===1?'':'es')+' leaning as a block'
                 : 'No asset class leaning as a block',
    leans.length
      ? 'When a whole class sits on one side, the crowded markets inside it are not independent bets — they unwind together. The ledger shows whether your market is the outlier in its group or one of the herd.'
      : 'Every group has markets on both sides of its own middle, so a crowded market below is idiosyncratic rather than part of a theme. Nothing here argues against a single-market view.'));

  // Confluence
  const conf = ext.filter(hasConfluence);
  sub.push(_rd(conf.length ? 'warn' : 'ok', 'Confluence',
    conf.length ? '<b>'+conf.length+'</b> market'+(conf.length===1?'':'s')+' with commercials confirming: '
      + conf.slice(0,4).map(nm).join(' &middot; ') + (conf.length>4 ? ' &hellip;' : '')
      : 'No market has commercials at the opposite extreme',
    conf.length
      ? 'Specs stretched one way and commercials — the hedgers who take the other side — independently at their own opposite extreme. This is the strongest version of the crowding read this data supports. It says the setup is textbook, <b>not</b> that it resolves now.'
      : 'Commercials sit roughly opposite specs as a matter of course, so this only fires when both hit their own extreme at once. Without it, a crowded reading below is one dataset saying one thing rather than two independently agreeing.'));

  // Positioning flow
  const flowOf = x => (!Number.isFinite(x.specShareChg) || x.specShare == null || x.specShareChg === 0) ? null
    : (Math.sign(x.specShareChg) === Math.sign(x.specShare) ? 'ext' : 'par');
  const fl = ext.map(flowOf).filter(Boolean);
  const nExt = fl.filter(v => v==='ext').length, nPar = fl.filter(v => v==='par').length;
  const mover = all.filter(x => Number.isFinite(x.specShareChg))
    .sort((a,b) => Math.abs(b.specShareChg)-Math.abs(a.specShareChg))[0];
  sub.push(_rd(!fl.length ? 'off' : nExt > nPar ? 'warn' : 'ok', 'Positioning flow',
    !fl.length ? 'No weekly flow data on the extremes'
      : '<b>'+nExt+'</b> still extending &middot; <b>'+nPar+'</b> already paring back',
    (!fl.length ? 'Weekly change is missing for the crowded markets, so building cannot be told from unwinding this week. '
      : nExt > nPar
        ? 'Most crowded markets are still <b>getting more crowded</b>. A stretched reading that is still building has not begun to unwind — the extreme can go further before it matters. '
        : 'More crowded markets are <b>paring back</b> than extending. Positions are being reduced, which is what the start of an unwind looks like — though it looks identical to a pause. ')
    + (mover ? 'Biggest mover on the whole board: <b>'+nm(mover)+'</b> at '+sgn(mover.specShareChg)+mover.specShareChg+'pp of open interest this week.' : '')));

  // Extreme persistence
  ext.forEach(x => loadHistFor(x.sym));
  const streaks = ext.map(x => {
    const hd = HIST[x.sym];
    if(hd === undefined || hd === 'loading' || !hd) return null;
    const s = extremeStreak(hd, pctOf(x) >= 90);
    return s == null ? null : { x, s };
  }).filter(Boolean).sort((a,b) => b.s - a.s);
  const fresh = streaks.filter(r => r.s <= 1);
  sub.push(_rd(!ext.length || !streaks.length ? 'off' : 'ok', 'Extreme persistence',
    !ext.length ? 'Nothing at an extreme to measure'
      : !streaks.length ? 'Measuring — histories still loading'
      : 'Longest-standing <b>'+nm(streaks[0].x)+'</b> at <b>'+streaks[0].s+'</b> week'+(streaks[0].s===1?'':'s')
        + (fresh.length ? ' &middot; <b>'+fresh.length+'</b> arrived this week' : ''),
    !ext.length ? ''
      : !streaks.length ? 'Each crowded market’s own weekly series has to load before its streak can be walked back week by week.'
      : 'A percentile cannot tell a freshly-hit extreme from one held for months, and they are different situations: a long-running extreme means the crowd has had time to be proved right, a fresh one has not been tested at all. Both are worth knowing; neither is a signal.'));

  // Event-risk overlay
  const upc = upcomingEvents();
  const risky = ext.map(x => { const c = ccyOf(x); if(!c) return null;
      const e = upc.find(v => v.ccy === c); if(!e) return null;
      return { x, e, hrs: (e.ms-Date.now())/36e5 }; })
    .filter(Boolean).sort((a,b) => a.hrs-b.hrs);
  const soon = risky[0];
  sub.push(_rd((EVENTS === null || EVENTS === 'loading' || EVENTS === false) ? 'off'
      : !soon ? 'ok' : soon.hrs <= 24 ? 'bad' : 'warn', 'Event-risk overlay',
    (EVENTS === null || EVENTS === 'loading') ? 'Loading the calendar'
      : EVENTS === false ? 'Calendar unavailable'
      : !soon ? 'No crowded market has a release in the next 3 days'
      : '<b>'+nm(soon.x)+'</b> into <b>'+esc(soon.e.event||'a release')+'</b> in '
        + (soon.hrs < 24 ? Math.round(soon.hrs)+'h' : Math.round(soon.hrs/24)+'d'),
    (EVENTS === null || EVENTS === 'loading' || EVENTS === false) ? ''
      : !soon ? 'Nothing scheduled is about to force a crowded position to move, so the readings below have no known catalyst on the clock.'
      : 'A crowded position walking into a scheduled release for its own currency is exposed to a fast move — a one-sided book has nobody left to absorb a surprise. This flags the <b>exposure</b>, not which way the number breaks. '
        + (soon.hrs <= 24 ? 'Inside 24 hours: if you are about to take this side, that is the thing to size around.' : '')));

  // Reinforcing FX pairs
  const bySym = {}; ext.filter(x => x.group==='fx').forEach(x => bySym[x.sym] = x);
  const usdR = usdDerivedReading();
  if(usdR && (pctOf(usdR) >= 90 || pctOf(usdR) <= 10)) bySym.USD = usdR;
  const combos = FX_PAIRS.filter(p => { const A = bySym[p[0]], B = bySym[p[1]];
      if(!A || !B) return false;
      return (pctOf(A) >= 90) !== (pctOf(B) >= 90); })
    .map(p => p[0]+p[1]);
  sub.push(_rd(combos.length ? 'warn' : 'ok', 'Reinforcing FX pairs',
    combos.length ? '<b>'+combos.length+'</b> cross'+(combos.length===1?'':'es')+' with both legs stretched: '
        + combos.slice(0,4).map(esc).join(' &middot; ') + (combos.length>4 ? ' &hellip;' : '')
      : 'No cross has both legs stretched the same way',
    combos.length
      ? 'Two different currencies, each crowded, and crowded in the direction that <b>reinforces</b> on the cross between them — so the thin fuel sits on both sides of that one rate at once. Untested here: context to combine with price, never a rule to trade.'
      : 'Crowded currencies may exist below, but none pair into a cross where both legs push the same way. Read each currency on its own.'));

  // Specs vs commercials
  const paired = ranked.filter(x => commOf(x) != null);
  const broken = paired.filter(x => Math.abs(pctOf(x) + commOf(x) - 100) > 40);
  sub.push(_rd(!paired.length ? 'off' : broken.length ? 'warn' : 'ok', 'Specs vs commercials',
    !paired.length ? 'No paired commercial data'
      : broken.length ? '<b>'+broken.length+'</b> market'+(broken.length===1?'':'s')+' off the usual mirror: '
          + broken.slice(0,4).map(nm).join(' &middot; ') + (broken.length>4 ? ' &hellip;' : '')
        : 'All '+paired.length+' markets sit near the usual mirror',
    !paired.length ? ''
      : broken.length
        ? 'Commercials normally sit roughly opposite specs, so the two percentiles should add to about 100. Where they do not, the usual relationship has broken — often because hedging demand itself changed rather than because anyone took a view. Worth checking before leaning on a crowding read for those names.'
        : 'Specs and hedgers are lined up the way they normally are, so the crowding readings below rest on the relationship this data assumes.'));

  // Ranking basis disagreement
  const gaps = all.filter(x => x.specSharePct != null && x.specPct != null)
    .map(x => ({ x, gap: Math.abs(x.specSharePct-x.specPct) })).sort((a,b) => b.gap-a.gap);
  const thin = gaps.filter(r => r.gap >= 20);
  sub.push(_rd(!gaps.length ? 'off' : thin.length ? 'warn' : 'ok', 'Ranking basis',
    !gaps.length ? 'OI-normalised ranks not in this payload yet'
      : thin.length ? '<b>'+thin.length+'</b> market'+(thin.length===1?' ranks':'s rank')+' very differently by basis, worst <b>'+nm(thin[0].x)+'</b> ('+thin[0].gap+' points)'
        : 'The two ranking bases broadly agree',
    !gaps.length ? 'They appear after the next COT refresh; until then the page ranks on raw contract counts.'
      : thin.length
        ? 'Ranking the raw contract count conflates "more crowded" with "bigger market". Where the two bases disagree by this much, open interest itself has moved — the same position is far more crowded in a thin market than the raw ranking admits. The page defaults to % of OI for exactly this reason; the toggle at the top switches it.'
        : 'Normalising by open interest barely changes the ranking this week, so the crowding read does not depend on which basis you pick.'));

  // COT vs options
  const oiPairs = (OISTORE && OISTORE !== 'loading' && OISTORE !== false) ? Object.keys(OISTORE) : [];
  const stale = oiPairs.filter(p => { const e = OISTORE[p];
    return e && e.savedAtMs && (Date.now()-e.savedAtMs)/36e5 > 36; }).length;
  sub.push(_rd((OISTORE === null || OISTORE === 'loading' || OISTORE === false || !oiPairs.length) ? 'off'
      : stale ? 'warn' : 'ok', 'COT vs options',
    (OISTORE === null || OISTORE === 'loading') ? 'Loading options positioning'
      : OISTORE === false ? 'Options positioning unavailable'
      : !oiPairs.length ? 'No options chain saved yet'
      : '<b>'+oiPairs.length+'</b> pair'+(oiPairs.length===1?'':'s')+' with a saved chain'
        + (stale ? ' &middot; <b>'+stale+'</b> over 36h old' : ''),
    (OISTORE === null || OISTORE === 'loading' || OISTORE === false) ? ''
      : !oiPairs.length ? 'Paste a CME chain on the OI Analytics page and this week’s futures positioning can be read beside dealer options walls for the same pair.'
      : 'Weekly futures positioning and dealer options flow are <b>different markets</b>, shown side by side rather than folded into one verdict — they can agree or disagree, and that itself is information. '
        + (stale ? 'Some of those chains are stale enough that their wall levels may already have moved.' : 'The saved chains are recent enough to read against.')));

  // 200-week history
  sub.push(_rd(SEL ? 'ok' : 'off', '200-week history',
    SEL ? 'Showing <b>'+esc(SEL==='US'?'US30Y':SEL)+'</b>' : 'No market selected',
    SEL ? 'The shape behind a percentile is what gives it meaning: the 90th reached by a steady eight-month climb and the 90th reached by a two-week spike are the same number and completely different situations.'
        : 'Click any market — a spotlight card, a ledger row, a table row — to load its weekly series at the bottom of the page.'));

  return '<div class="p c12"><h3><span class="grow">This week’s read'+h('read')+'</span></h3>'
    + '<div class="body" style="padding:0"><div style="padding:16px 18px 0">'+lesson('read')+'</div>'
    + top+'<div class="rd-grid">'+sub.join('')+'</div></div></div>';
}

async function pick(sym){
  SEL=sym;
  if(!HIST[sym]){
    HIST[sym]='loading'; render();
    try{
      const r=await fetch('/api/cot-extremes?history='+encodeURIComponent(sym),{cache:'no-store'});
      const j=await r.json();
      HIST[sym]=(j && j.ok && j.history && j.history.sym===sym) ? j.history : null;
    }catch(e){ HIST[sym]=null; }
  }
  render();
}

function render(){
  if(!DATA || !DATA.ok){
    document.getElementById('main').innerHTML='<div class="empty">Could not load COT data'
      +(DATA&&DATA.error?': '+esc(DATA.error):'')+'.</div>';
    document.getElementById('sub').textContent='load failed';
    return;
  }
  document.getElementById('basisBtn').textContent='Ranking: '+(BASIS==='share'?'% OF OI':'RAW CONTRACTS');
  document.getElementById('explainBtn').innerHTML='&#128214; Explain: '+(EXPLAIN?'ON':'OFF');
  const rd=(DATA.instruments&&DATA.instruments[0]&&DATA.instruments[0].reportDate)||DATA.reportDate;
  const age=rd?Math.round((Date.now()-Date.parse(rd))/864e5):null;
  document.getElementById('sub').textContent=
    (DATA.count||(DATA.instruments||[]).length)+' markets · report '+(rd||'—')+(age!=null?' · '+age+'d old':'');
  document.getElementById('stale').innerHTML=
    '<div class="staleban">'+h('what')+' <b>This is a Tuesday snapshot released Friday</b>'
    +(age!=null?' — the data below is '+age+' days old':'')
    +'. Positioning changes inside that gap and you cannot see it, so treat every number here as a '
    +'<b>crowding / regime conditioner</b>, never as a timing signal.</div>';
  // Reading order, top to bottom: what does this add up to (the read), what is
  // stretched (spotlight), where does everything sit (ledger), then the granular
  // panels each of the read's sub-cards points at, then the raw table last.
  document.getElementById('main').innerHTML = '<div class="grid">'
    + '<div class="p c12"><h3><span class="grow">Start here \u2014 what COT is, and how to read this page'+h('what')+'</span></h3>'
    + '<div class="body">'+primer()+'</div></div></div>'
    + '<div class="grid">' + cotAiPanel() + '</div>'
    + thisWeeksRead() + '<div class="grid">'
    + panel('c12','spot','Spotlight \u2014 what is stretched right now','spot',spotlight,true)
    + panel('c12','ledger','Positioning ledger \u2014 every market, by asset class','ledger',ledger,true)
    + panel('c12','digest','At a glance \u2014 how many reads agree, per market','digest',digest,true)
    + panel('c7','confl','Confluence (specs vs. commercials, same market)','confl',confluence,true)
    + panel('c5','persist','Extreme persistence','persist',persistence,true)
    + panel('c7','flow','Positioning flow \u2014 week over week','flow',flow,true)
    + panel('c5','evr','Event-risk overlay','evrisk',eventRisk,true)
    + panel('c12','alerts','Reinforcing FX pairs (specs vs. specs, cross-currency)','paira',crowdingCards,true)
    + panel('c7','scat','Specs vs commercials','scatter',scatter)
    + panel('c5','dis','Where the two rankings disagree','basis',disagree,true)
    + panel('c12','oix','COT vs options positioning','oixchk',oiCrossCheck,true)
    + panel('c12','hist','200-week history'+(SEL?' \u2014 '+esc(SEL==='US'?'US30Y':SEL):''),'hist',history)
    + panel('c12','all','All markets','spec',allTable,true)
    + '</div>';
}

document.getElementById('explainBtn').onclick=()=>{
  EXPLAIN=!EXPLAIN;
  try{ localStorage.setItem('cotExplain', EXPLAIN?'1':'0'); }catch(e){}
  LSN_OPEN.clear();   // the global switch wins; per-panel overrides start clean again
  render();
};
document.getElementById('basisBtn').onclick=()=>{BASIS=(BASIS==='share')?'raw':'share';render();};
document.getElementById('reload').onclick=()=>boot();
// The lean payload is cached for 7 days and the series lives in its own key. If that key
// predates the series existing, history stays empty until something forces a recompute —
// this is that button. Slow (a real CFTC fetch), so it is explicit rather than automatic.
document.getElementById('freshBtn').onclick=async()=>{
  const b=document.getElementById('freshBtn'), was=b.textContent;
  b.textContent='fetching CFTC…';
  try{
    const r=await fetch('/api/cot-extremes?refresh=1',{cache:'no-store'});
    DATA=await r.json(); HIST={};
  }catch(err){ DATA={ok:false,error:err.message}; }
  b.textContent=was; render();
};

// Factor-test history backfill (MD files/COT_POSITIONING_FACTOR_TEST.md). Pulls
// the FULL Socrata history for the 8 test contracts — not the 156-week display
// cache — and stores the OI-normalised, publication-lagged series. Kick-and-poll
// like the FOMC backfill: ~8 sequential CFTC fetches outlive a proxy timeout.
document.getElementById('factorBtn').onclick=async()=>{
  const b=document.getElementById('factorBtn'), was=b.textContent, sub=document.getElementById('sub');
  if(!confirm('Pull full CFTC history (2006→) for the 8 factor-test contracts?\n\n'
    +'• ~1 minute, 8 sequential Socrata fetches\n'
    +'• writes the frozen INPUT for the pre-registered positioning-factor test\n'
    +'• does not touch the dashboard\'s own COT cache')) return;
  b.disabled=true; b.textContent='backfilling…';
  // A route that doesn't exist yet 404s to the SPA fallback, i.e. HTML — so a
  // bare .json() would throw an opaque parse error and read like a server fault
  // when the real cause is "this deploy hasn't picked up the route yet".
  const jfetch=async(url,opts)=>{
    const r=await fetch(url,opts);
    const ct=r.headers.get('content-type')||'';
    if(!ct.includes('application/json')) throw new Error(r.status===404||!r.ok
      ? 'route not live yet (HTTP '+r.status+') — is the latest deploy up?'
      : 'unexpected non-JSON response (HTTP '+r.status+')');
    return r.json();
  };
  try{
    const kick=await jfetch('/api/cot-backfill/run',{method:'POST'});
    if(kick.alreadyRunning) sub.textContent='A COT backfill is already running…';
    let last=null;
    for(let i=0;i<60;i++){
      await new Promise(r=>setTimeout(r,3000));
      const st=await jfetch('/api/cot-backfill/status',{cache:'no-store'});
      last=st.last;
      if(last) sub.textContent='Factor backfill: '+last.phase+(last.log&&last.log.length?' · '+last.log[last.log.length-1]:'');
      if(!st.running) break;
    }
    const s=await jfetch('/api/cot-backfill/series',{cache:'no-store'});
    if(s.ok){
      const insts=Object.values(s.instruments||{});
      const okN=insts.filter(x=>x.qualifies).length;
      sub.textContent='Factor history ready: '+okN+'/'+insts.length+' instruments qualify (≥260 scored weeks) · '
        +insts.map(x=>x.sym+':'+(x.scoredWeeks||0)).join(' ');
    } else if(last){
      sub.textContent='Factor backfill: '+last.phase+' · no series written — see /api/cot-backfill/status';
    }
  }catch(err){ sub.textContent='Factor backfill error: '+err.message; }
  finally{ b.disabled=false; b.textContent=was; }
};

async function boot(){
  document.getElementById('sub').textContent='loading…';
  try{
    const r=await fetch('/api/cot-extremes',{cache:'no-store'});
    DATA=await r.json();
  }catch(err){ DATA={ok:false,error:err.message}; }
  render();
}
boot();
</script>
