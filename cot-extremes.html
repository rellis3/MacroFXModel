<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COT Positioning — Commitments of Traders</title>
<style>
/* Same visual system as the OI dashboard so the two read as one desk: legible type, one
   accent, red/green only where direction means something, help on every metric, and
   tooltips in a body-level layer because panel overflow clipped them on the OI page. */
:root{
  --bg:#0b0d10; --bg2:#12161c; --bg3:#181d24; --line:#262c35; --line2:#333b46;
  --tx:#eef1f5; --tx2:#a8b1bd; --tx3:#71798a;
  --acc:#e0a339; --long:#e8615f; --short:#46b87a; --neu:#54a8de;
  --warn:#e8963c; --ok:#46b87a;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1680px;margin:0 auto;padding:0 22px 80px}
a{color:var(--acc)}

.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:20px 0 16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.top h1{margin:0;font-size:22px;font-weight:650;letter-spacing:.1em;text-transform:uppercase}
.top h1 span{color:var(--acc)}
.top .sub{color:var(--tx2);font-size:13px}
.top .right{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.btn{background:var(--bg3);border:1px solid var(--line2);color:var(--tx2);
  padding:9px 15px;border-radius:5px;cursor:pointer;font-size:13px;font-family:var(--mono);
  text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--acc);color:var(--tx)}

.h{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
  border-radius:50%;border:1px solid var(--line2);color:var(--tx3);font-size:10px;
  margin-left:7px;cursor:help;flex:none;font-style:normal;font-weight:700}
.h:hover{border-color:var(--acc);color:var(--acc)}
#tip{display:none;position:fixed;z-index:900;width:350px;max-width:80vw;background:#05070a;
  border:1px solid var(--acc);border-radius:7px;padding:13px 15px;font-size:13.5px;line-height:1.62;
  color:var(--tx);box-shadow:0 16px 40px rgba(0,0,0,.8);pointer-events:none}
#tip b{color:var(--acc)}
#tip em{color:var(--tx2);font-style:normal;display:block;margin-top:8px;font-size:12.5px}

.staleban{background:rgba(232,150,60,.1);border:1px solid var(--warn);color:var(--warn);
  border-radius:7px;padding:12px 16px;margin-bottom:18px;font-size:13.5px;line-height:1.6;
  display:flex;align-items:flex-start;gap:4px}
.staleban b{color:var(--acc)}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.p{background:var(--bg2);border:1px solid var(--line);border-radius:7px;overflow:hidden;min-width:0}
.p>h3{margin:0;padding:13px 17px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tx);border-bottom:1px solid var(--line);background:var(--bg3);
  display:flex;align-items:center;gap:8px;font-weight:600}
.p>h3 .grow{flex:1;display:flex;align-items:center}
.p>h3 .zoom{background:none;border:1px solid var(--line2);color:var(--tx3);cursor:pointer;
  border-radius:4px;padding:4px 10px;font-size:11.5px;font-family:var(--mono);letter-spacing:0;text-transform:none}
.p>h3 .zoom:hover{border-color:var(--acc);color:var(--acc)}
.p .body{padding:16px 17px}
.p .body.flush{padding:6px 0 2px}
.c12{grid-column:span 12}.c7{grid-column:span 7}.c5{grid-column:span 5}
@media(max-width:1250px){.c7,.c5{grid-column:span 12}}

table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:14px}
th{text-align:right;padding:9px 12px;color:var(--tx2);font-weight:600;font-size:11.5px;
  letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:8px 12px;border-bottom:1px solid rgba(38,44,53,.55);text-align:right}
tr:last-child td{border-bottom:0}
tr.sel td{background:rgba(224,163,57,.08)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:rgba(255,255,255,.03)}
.muted{color:var(--tx3)}
.pill{font-size:11px;padding:2px 7px;border-radius:4px;border:1px solid currentColor;margin-left:6px}
.bar{height:13px;border-radius:2px;display:inline-block;vertical-align:middle}

.pa-grid{display:flex;flex-wrap:wrap;gap:14px}
.pa-card{flex:1 1 220px;min-width:200px;background:var(--bg3);border:1px solid var(--line2);
  border-radius:8px;padding:14px 16px}
.pa-card.long{border-color:var(--long);background:rgba(232,97,95,.08)}
.pa-card.short{border-color:var(--short);background:rgba(70,184,122,.08)}
.pa-card.derived{border-style:dashed}
.pa-derived-tag{font-size:9px;font-weight:700;letter-spacing:.05em;color:var(--tx3);
  border:1px solid var(--line2);border-radius:3px;padding:1px 5px;vertical-align:middle;cursor:help}
.pa-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pa-pair{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.03em;color:var(--tx)}
.pa-badge{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:4px;
  border:1px solid currentColor;white-space:nowrap}
.pa-stats-row{display:flex;gap:18px}
.pa-stat{flex:1;min-width:0}
.pa-lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin-bottom:3px}
.pa-val{font-family:var(--mono);font-weight:700;font-size:15px}

svg{display:block;width:100%;height:auto;overflow:visible}
.lbl{fill:var(--tx2);font-family:var(--mono);font-size:12px}
.gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.axis{stroke:var(--line2);stroke-width:1.2}
.empty{color:var(--tx3);padding:36px 18px;text-align:center;font-size:14px;line-height:1.7}
.note{color:var(--tx2);font-size:13px;line-height:1.66;margin-top:13px;
  border-left:2px solid var(--line2);padding-left:13px}
/* Kicker: an always-visible one-line "what am I looking at" line at the TOP of a panel
   whose neighbour looks similar (crowding-alert-style badges) but checks something
   different — a hover tooltip alone didn't prevent that exact confusion before
   (Pair Lab, the US/USD ticker mix-up), so this repeats the distinction where it's
   impossible to miss, not just on hover. */
.kicker{color:var(--tx2);font-size:12.5px;line-height:1.5;margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
.kicker b{color:var(--acc)}

/* ── This week's read ───────────────────────────────────────────────────────
   Lifted wholesale from the OI dashboard's "Today's read" so the two desks
   explain themselves in the same shape: a headline verdict, then one
   plain-English sub-read per panel below, so every number is already
   interpreted before you scroll to it. Lights are NOT directional — green
   means nothing here argues against your plan, amber means something is
   changing, red means this contradicts a trade you might be about to take. */
.rd-top{padding:16px 18px;border-bottom:1px solid var(--line)}
.rd-reg{font-size:13px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;margin-bottom:8px}
.rd-say{font-size:14px;line-height:1.62;color:var(--tx2);margin-top:6px;max-width:104ch}
.rd-say b{color:var(--tx);font-weight:600}
.rd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:1px;background:var(--line)}
.rd{background:var(--bg2);padding:13px 16px}
.rd-h{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:7px}
.rdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.rd-v{font-size:14.5px;color:var(--tx);margin-top:5px;line-height:1.45}
.rd-v b{font-family:var(--mono);font-weight:600}
.rd-d{font-size:12.5px;color:var(--tx3);margin-top:5px;line-height:1.55}
.rd-d b{color:var(--tx2)}
@media(max-width:760px){.rd-grid{grid-template-columns:1fr}}

/* ── Spotlight: the extremes hoisted out of the ledger ──────────────────── */
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;color:var(--tx3);
  font-size:11.5px;margin-bottom:14px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px;
  vertical-align:-1px;font-style:normal}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(166px,1fr));gap:11px}
.sp{background:var(--bg3);border:1px solid var(--line2);border-left-width:3px;border-radius:6px;
  padding:11px 13px;cursor:pointer}
.sp:hover{border-color:var(--acc)}
.sp-top{display:flex;align-items:center;gap:6px}
.sp-sym{font-family:var(--mono);font-weight:700;font-size:12.5px;letter-spacing:.04em;color:var(--tx);
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-grp{color:var(--tx3);letter-spacing:.07em;text-transform:uppercase;font-size:9.5px}
.sp-dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:0 0 6px;cursor:help}
.sp-val{font-family:var(--mono);font-size:21px;font-weight:700;margin-top:8px;line-height:1}
.sp-lbl{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-top:6px}

/* ── Positioning ledger: every market as a percentile bar, grouped by asset
   class. The shaded bands at 0-10 and 90-100 are the extreme thresholds
   themselves, so "how close is this to counting as crowded" is readable off
   the bar and not only off the number next to it. */
.lg-sec{margin:0 0 26px}
.lg-sec:last-of-type{margin-bottom:8px}
.lg-h{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;padding-bottom:7px;
  border-bottom:1px solid var(--line);margin-bottom:9px}
.lg-h b{font-size:15px;font-weight:600;letter-spacing:.03em}
.lg-h span{color:var(--tx3);font-size:11.5px;font-family:var(--mono)}
.lg-row{display:grid;grid-template-columns:104px 1fr 76px 76px;align-items:center;gap:12px;
  padding:3px 0;border-radius:3px}
.lg-row.hd{color:var(--tx3);font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding-bottom:4px}
.lg-row.clk{cursor:pointer}
.lg-row.clk:hover{background:rgba(255,255,255,.035)}
.lg-nm{font-family:var(--mono);font-size:12px;color:var(--tx2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-row.clk:hover .lg-nm{color:var(--tx)}
.lg-tr{position:relative;height:15px;background:var(--bg3);border-radius:2px}
.lg-zn{position:absolute;top:0;bottom:0;border-radius:2px}
.lg-mid{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--line2)}
.lg-bar{position:absolute;top:2px;bottom:2px;border-radius:1px;opacity:.85}
.lg-tk{position:absolute;top:-2px;bottom:-2px;width:2px;border-radius:1px}
.lg-v,.lg-d{font-family:var(--mono);font-size:12px;text-align:right}
.lg-row.hd .lg-v,.lg-row.hd .lg-d{font-size:10px}
.lg-d{color:var(--tx3);font-size:11px}
.lg-ax{position:relative;height:12px}
.lg-ax span{position:absolute;transform:translateX(-50%);color:var(--tx3);font-size:9.5px;
  font-family:var(--mono);white-space:nowrap}
@media(max-width:700px){
  .lg-row{grid-template-columns:76px 1fr 58px}
  .lg-d{display:none}
}

#zoom{display:none;position:fixed;inset:0;background:rgba(4,6,9,.94);z-index:200;padding:34px;overflow:auto}
#zoom.open{display:block}
#zoomBox{max-width:1500px;margin:0 auto;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
#zoomBox h3{margin:0;padding:16px 20px;font-size:16px;background:var(--bg3);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px}
#zoomBox h3 .grow{flex:1}
#zoomBody{padding:24px 22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span>&#9670;</span> COT Positioning</h1>
    <div class="sub" id="sub">loading…</div>
    <div class="right">
      <button class="btn" id="basisBtn">Ranking: % OF OI</button>
      <button class="btn" id="reload">Reload</button>
      <button class="btn" id="freshBtn" title="Re-fetch from the CFTC, bypassing the 7-day cache. Needed once to populate the 200-week series.">Refresh CFTC</button>
      <button class="btn" id="factorBtn" title="Pull FULL CFTC history (2006→) for the 8 factor-test contracts, OI-normalised and publication-lagged, for the pre-registered positioning-factor test. Separate from the display cache above — this one is not capped at 156 weeks. Takes ~1 minute.">⏬ Factor history</button>
      <a class="btn" href="oi-dashboard.html">&#9670; OI Analytics</a>
      <a class="btn" href="index.html">Dashboard</a>
    </div>
  </div>
  <div id="stale"></div>
  <div id="main"></div>
</div>

<div id="tip"></div>
<div id="zoom"><div id="zoomBox">
  <h3><span class="grow" id="zoomTitle"></span><button class="btn" onclick="closeZoom()">Close &#10005;</button></h3>
  <div id="zoomBody"></div>
</div></div>

<script>
// CFTC Commitments of Traders. Weekly: a TUESDAY snapshot released FRIDAY, so it is always
// several days old. That is stamped across the top rather than left for the reader to work
// out, because every number here is a positioning conditioner and none is a timing signal.
let DATA = null, SEL = null, HIST = {}, BASIS = 'share', PANELS = {};

const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fN  = n => !Number.isFinite(n) ? '—' : Math.abs(n)>=1e6 ? (n/1e6).toFixed(2)+'M'
              : Math.abs(n)>=1000 ? (n/1000).toFixed(0)+'K' : String(Math.round(n));
const sgn = n => (Number.isFinite(n) && n>0 ? '+' : '');
// Percentiles here run 0-100 and single digits are common at the crowded-short end,
// where appending a bare 'th' printed "2th". 11/12/13 keep 'th'.
const ord = n => { const v = Math.abs(n) % 100, d = v % 10;
  return n + (v >= 11 && v <= 13 ? 'th' : d === 1 ? 'st' : d === 2 ? 'nd' : d === 3 ? 'rd' : 'th'); };

// Ranking basis. 'share' = net as % of open interest, then ranked — the read that survives
// open interest itself changing over the window. 'raw' = the old contract-count ranking,
// kept switchable because the two disagree materially (ES, MXN) and seeing that is useful.
const pctOf = x => BASIS==='share' ? (x.specSharePct ?? x.specPct) : x.specPct;
const zOf   = x => BASIS==='share' ? (x.specShareZ  ?? x.specZ)   : x.specZ;
const colFor = p => p==null ? 'var(--tx3)' : p>=90 ? 'var(--long)' : p<=10 ? 'var(--short)'
              : p>=70 ? 'rgba(232,97,95,.65)' : p<=30 ? 'rgba(70,184,122,.65)' : 'var(--tx3)';
const stat = (lbl, val, clr) => '<div class="pa-stat"><div class="pa-lbl">'+lbl+'</div><div class="pa-val" style="color:'+clr+'">'+val+'</div></div>';
// Display-only override: the 30Y T-BOND ticker is 'US' (CFTC's own symbol), which reads as
// an obvious abbreviation for the US Dollar right next to Pair Lab's derived 'USD' currency
// card — two unrelated instruments with near-identical labels. `pick()`/the API still use
// the real 'US' ticker; this only changes what's drawn on screen.
const dispSym = x => x.sym === 'US' ? 'US30Y' : x.sym;

const HELP = {
  what:['What COT is','A weekly CFTC report of who holds what in the futures market, split by trader type. It shows <b>positioning</b> — who is already committed — not price.','Read it as crowding: when one side is historically stretched, the fuel for further moves that way is thin and an unwind can be violent. It is not a timing tool.'],
  spec:['Speculators','Managed money and leveraged funds — the trend-followers. They are usually <b>with</b> the trend, so extreme spec positioning marks a crowded trade rather than a clever one.'],
  comm:['Commercials','Producers, merchants and hedgers with real exposure to the underlying. They sit on the <b>other</b> side of specs, so their net is roughly the mirror image and extremes tend to appear together.'],
  pct:['Crowding percentile','Where current positioning sits in its own <b>200-week</b> range. 100th = the most crowded long seen in that window, 0th = the most crowded short.','Ranked on net as a SHARE of open interest rather than raw contracts — see the ranking note.'],
  basis:['Ranking basis','<b>% of OI</b> divides net position by open interest, then ranks. <b>Raw</b> ranks the contract count directly.','Raw conflates "more crowded" with "bigger market". ES is the live case: the biggest absolute short on the board, but open interest sits at the 9th percentile of its own range, so the position is about 17% of a thin market while raw ranking calls it a middling 64th.'],
  z:['Z-score','How many standard deviations current positioning sits from its 200-week mean. Beyond plus or minus 2 is genuinely unusual.'],
  oi:['Open interest','Total contracts outstanding, and its own percentile. The same net position is far more crowded in a thin market than a busy one — which is exactly why the default ranking normalises by it.'],
  wk:['Weekly change','Net contracts added or removed since last week — the direction of travel. A stretched reading still <b>growing</b> is a different situation from one already unwinding.'],
  gross:['Gross L/S ratio','Speculative longs divided by shorts. Above 1 is net long. It ignores position size, so read it beside the net.'],
  scatter:['Specs vs commercials','Each dot is one market: speculative crowding across, commercial crowding up.','They should sit near a downward diagonal, because commercials take the other side. A market well <b>off</b> that line means the usual mirror has broken — worth a look, not a signal.'],
  hist:['200-week history','Net positioning over time, with the current reading marked.','A percentile means little without the shape behind it: the 90th after a steady climb is a different situation from the 90th after a spike.'],
  paira:['Reinforcing FX pairs','Flags an FX cross where BOTH legs sit at a 90th/10th-percentile crowding extreme, and the direction reinforces on the cross (e.g. the base crowded long, the quote crowded short) — TWO DIFFERENT currencies\' specs compared to each other.','This is a crowding read, not a trade signal: it says the fuel for more of the same is thin on both sides at once, not which way or when it unwinds. It has not been backtested — treat it as context to combine with price and your own risk process, not a rule to act on alone.'],
  flow:['Positioning flow','The crowding percentile is a level — where positioning sits right now. This is the week-over-week change instead: who added or reduced the most, ranked by size relative to open interest.','A market extending an already-stretched position and one paring back from it look identical on the percentile alone but mean very different things going forward.'],
  evrisk:['Event-risk overlay','Cross-references currently-crowded markets (90th/10th percentile+) against the live economic calendar for their own currency — FOMC, ECB, NFP and similar high/medium-impact releases in the next 3 days.','A stretched position walking into a scheduled catalyst is exposed to a fast move — this flags the exposure, not which way the release breaks. Scoped to FX plus the three Treasury tenors (all USD); other groups aren\'t mapped to a single country\'s calendar cleanly enough to include here.'],
  persist:['Extreme persistence','How many of the most recent weeks were also a 90th/10th-percentile extreme at the time — each ranked only against its own trailing up-to-156-week window, the same rolling method used for today\'s reading.','A percentile alone can\'t tell a freshly-hit extreme from one that has held for months. Needs at least 52 weeks of trailing history behind a week before ranking it, same floor as the main reading — a market too new to satisfy that just stops the count rather than guessing.'],
  confl:['Confluence','Flags a market where speculators are at a 90th/10th-percentile extreme AND commercials are independently at the opposite extreme, at the same time.','This is the textbook COT contrarian setup — commercials normally sit roughly opposite specs anyway (see the scatter panel), so both hitting their own extreme at once is the strongest version of a "crowded, low-fuel, exposed-to-reversal" read this data can give. Still not a timing signal — it says the setup is textbook, not that it resolves now.'],
  digest:['At a glance','For every currently-crowded market, checks whether commercials confirm it (Confluence) and whether this week\'s flow is still building the same way (Positioning Flow), and counts how many of those independent reads currently agree.','Not a new calculation — every fact shown is already on a panel below this one. This just answers "do the reads on this market agree or fight each other" without averaging that answer away. Never blends across DIFFERENT markets into one board-wide call; each market keeps its own count.'],
  read:['This week\u2019s read','Plain-English interpretation of every panel on this page, in one place: a headline saying how stretched the board is overall, then one sub-read per panel so each number is already interpreted before you scroll to it.','Reads the same fields the panels do \u2014 it is not a second opinion or a new calculation. The traffic lights are deliberately NOT directional: green means nothing here argues against your plan, amber means something is changing, red means this contradicts a trade you might be about to take. Direction comes from your own system.'],
  spot:['Spotlight','Every market currently at a 90th/10th-percentile extreme of its own trailing history, most stretched first, so you do not have to scan the full ledger to find them.','A dot marks a market where commercials are independently at their own opposite extreme too \u2014 the Confluence test. Click any card to load that market\u2019s 200-week series at the bottom of the page.'],
  ledger:['Positioning ledger','Every ranked market as a bar running from the 50th percentile out to where it sits in its OWN trailing range, grouped by asset class with each group\u2019s median in the header.','The shaded bands at each end are the 90th/10th thresholds this page treats as extreme. Grouping is the point: a crowded market inside a group that is all leaning the same way is a shared macro theme rather than an independent bet, and a flat board-wide ranking cannot show you that — it is what tells you whether one crowded market is idiosyncratic or part of a board-wide risk-on / risk-off stretch. Replaces the old crowding leaderboard and the separate by-asset-class median table, carrying the contents of both.'],
  oixchk:['COT vs options positioning','Two separate datasets shown side by side for any pair with saved options data: COT\'s weekly futures positioning per currency leg, and the nearest put/call open-interest wall from a manually-pasted CME options chain.','Deliberately not combined into one verdict — futures positioning and dealer options flow are different markets that can agree or disagree. Options data is only as fresh as the last paste on the OI Analytics page, so check the age column.'],
};
const h = k => HELP[k] ? '<i class="h" data-k="'+k+'">?</i>' : '';

document.addEventListener('mouseover', ev => {
  const ic = ev.target.closest && ev.target.closest('.h'); if(!ic) return;
  const d = HELP[ic.dataset.k]; if(!d) return;
  const t = document.getElementById('tip');
  t.innerHTML = '<b>'+d[0]+'</b><br>'+d[1] + (d[2] ? '<em>'+d[2]+'</em>' : '');
  t.style.display='block';
  const r = ic.getBoundingClientRect(), tr = t.getBoundingClientRect();
  const left = Math.max(10, Math.min(r.left + r.width/2 - tr.width/2, window.innerWidth - tr.width - 10));
  const top = (r.top - tr.height - 10 < 8) ? r.bottom + 10 : r.top - tr.height - 10;
  t.style.left = left+'px'; t.style.top = top+'px';
});
document.addEventListener('mouseout', ev => {
  if(ev.target.closest && ev.target.closest('.h')) document.getElementById('tip').style.display='none';
});

function openZoom(k){ const p=PANELS[k]; if(!p) return;
  document.getElementById('zoomTitle').innerHTML=p.title;
  document.getElementById('zoomBody').innerHTML=p.render(true);
  document.getElementById('zoom').classList.add('open'); }
function closeZoom(){ document.getElementById('zoom').classList.remove('open'); }
document.getElementById('zoom').addEventListener('click',e=>{ if(e.target.id==='zoom') closeZoom(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeZoom(); });
function panel(cls,key,title,helpKey,render,flush){
  PANELS[key]={title,render};
  return '<div class="p '+cls+'"><h3><span class="grow">'+title+h(helpKey)+'</span>'
    + '<button class="zoom" onclick="openZoom(\'' + key + '\')">&#10530; Enlarge</button></h3>'
    + '<div class="body'+(flush?' flush':'')+'">'+render(false)+'</div></div>';
}

// ── extreme crowding alerts: where BOTH legs of an FX cross are stretched, ──
// reinforcing the same direction on the pair (not just one currency alone).
// Pair list + base/quote ordering matches js/instrumentRegistry.js's canonical
// FX set exactly — this page is plain script (no ES modules), so the 25 pairs
// are mirrored here rather than imported; if the registry's FX list changes,
// update both.
const FX_PAIRS = [
  ['EUR','USD'],['GBP','USD'],['AUD','USD'],['NZD','USD'],['USD','CAD'],['USD','CHF'],
  ['EUR','GBP'],['EUR','AUD'],['EUR','CAD'],['EUR','CHF'],['EUR','NZD'],
  ['AUD','NZD'],['AUD','CAD'],['AUD','CHF'],['GBP','AUD'],['GBP','CAD'],['GBP','CHF'],['GBP','NZD'],
  ['USD','JPY'],['EUR','JPY'],['GBP','JPY'],['AUD','JPY'],['CAD','JPY'],['CHF','JPY'],['NZD','JPY'],
];

// 'long'/'short' at the existing 90th/10th percentile extreme threshold (same
// cutoff as colFor() elsewhere on this page); null = not stretched.
const crowdState = x => { const p = pctOf(x); return p==null ? null : p>=90?'long':p<=10?'short':null; };

// ── derived USD crowding read ──────────────────────────────────────────────
// This feed has no direct CFTC USD-index future, so there is no real specNet
// series to percentile-rank. today.html's currency-strength drawer already
// derives a USD SNAPSHOT by mirroring the other 7 majors (sum of -specNet,
// divided by their combined OI) — but that only covers "today", which can't be
// percentile/Z-scored against nothing. Extended here across time: fetch the
// 7 majors' own 200-week histories (same /api/cot-extremes?history= endpoint
// the drill-down chart already uses — no new backend route), aggregate the
// same mirror at every historical date, then percentile-rank/Z-score that
// derived series against ITS OWN history using the exact same math the
// backend applies to every real instrument (pctRank/zScore, copied verbatim
// from _worker.js). This is a DERIVED / SYNTHETIC read, not a real tracked
// position — labeled as such everywhere it surfaces.
const USD_MIRROR_CCYS = ['EUR','GBP','JPY','AUD','CAD','CHF','NZD'];
let usdDerived = null;   // null = not yet requested; 'loading'; or {dates,specNet,specShare}

// Verbatim from _worker.js's /api/cot-extremes handler (pctRank/zScore + the
// h()/clean() self-exclusion convention: rank today against history EXCLUDING
// today, same as the backend's `h = a => a.slice(1)` on its newest-first arrays).
const pctRankCalc = (hist, cur) => { if (!hist.length) return 50; return Math.round(hist.filter(v => v < cur).length / hist.length * 100); };
const zScoreCalc = (hist, cur) => {
  const n = hist.length; if (n < 2) return 0;
  const mean = hist.reduce((s, v) => s + v, 0) / n;
  const std = Math.sqrt(hist.reduce((s, v) => s + (v - mean) ** 2, 0) / n);
  return std > 0 ? +((cur - mean) / std).toFixed(2) : 0;
};

async function loadUsdMirror(){
  if (usdDerived !== null) return;   // already loading, succeeded, or permanently failed (false)
  usdDerived = 'loading';
  const results = await Promise.all(USD_MIRROR_CCYS.map(async ccy => {
    try {
      const r = await fetch('/api/cot-extremes?history=' + encodeURIComponent(ccy), { cache: 'no-store' });
      const j = await r.json();
      return (j && j.ok && j.history && j.history.sym === ccy) ? j.history : null;
    } catch (e) { return null; }
  }));
  // Aggregate net/OI by report date across whichever of the 7 majors reported
  // that date; require at least 4-of-7 present so the mirror isn't built from
  // just one or two currencies on a date some other market was missing/stale.
  const byDate = new Map();
  results.forEach(h => {
    if (!h || !Array.isArray(h.dates)) return;
    h.dates.forEach((d, i) => {
      const net = h.specNet?.[i], oi = h.oi?.[i];
      if (!Number.isFinite(net) || !Number.isFinite(oi)) return;
      const row = byDate.get(d) || { net: 0, oi: 0, n: 0 };
      row.net += -net; row.oi += oi; row.n += 1;
      byDate.set(d, row);
    });
  });
  const dates = [...byDate.keys()].sort().filter(d => byDate.get(d).n >= 4);
  const specNet = dates.map(d => byDate.get(d).net);
  const specShare = dates.map(d => { const r = byDate.get(d); return r.oi > 0 ? +(r.net / r.oi * 100).toFixed(3) : null; });
  usdDerived = (specNet.length >= 10) ? { dates, specNet, specShare } : false;   // false = tried, not enough data — don't retry
  render();
}

// Today's derived USD reading — percentile/Z of the mirror series' latest
// point against its own history (excluding itself), in the exact shape
// crowdState()/pctOf()/zOf() expect so it flows through the same card code.
function usdDerivedReading(){
  if (!usdDerived || usdDerived === 'loading') return null;
  const shares = usdDerived.specShare;
  if (!shares.length || !Number.isFinite(shares[shares.length - 1])) return null;
  const cur = shares[shares.length - 1];
  const hist = shares.slice(0, -1).filter(v => Number.isFinite(v));
  if (hist.length < 10) return null;
  const p = pctRankCalc(hist, cur), z = zScoreCalc(hist, cur);
  return { sym: 'USD', group: 'fx', specSharePct: p, specPct: p, specShareZ: z, specZ: z, specShare: +cur.toFixed(1), _derived: true };
}

// One card PER CURRENCY that is individually at a 90th/10th-percentile crowding
// extreme (not gated behind a second currency also being extreme) — this is the
// card unit itself; two of these read together is what makes a pair "doubly"
// crowded, called out as a text annotation underneath rather than requiring both
// at once just to show anything.
function crowdingCards(big){
  const kicker = '<div class="kicker">Compares <b>two different currencies\'</b> speculative positioning against each other on a real FX cross (e.g. EUR vs AUD, on EURAUD). For one market\'s specs checked against its <b>own</b> commercials instead, see Confluence below.</div>';
  if (usdDerived === null) loadUsdMirror();   // fire-and-forget; re-renders itself when ready
  const usd = usdDerivedReading();
  const list = (DATA.instruments||[]).filter(x => x.group === 'fx' && crowdState(x));
  if (usd && crowdState(usd)) list.push(usd);
  if (!list.length) return kicker + '<div class="empty">No currency is currently at a 90th/10th-percentile crowding extreme — nothing stretched enough to flag right now.</div>';
  list.sort((a, b) => Math.abs(50 - pctOf(b)) - Math.abs(50 - pctOf(a)));

  const cardsHtml = list.map(x => {
    const st = crowdState(x), clr = st === 'long' ? 'var(--long)' : 'var(--short)';
    const label = st === 'long' ? '&#9888; OVERCROWDED LONG' : '&#9661; HEAVILY SHORT';
    const z = zOf(x), p = pctOf(x), sh = x.specShare;
    return `<div class="pa-card ${st}${x._derived ? ' derived' : ''}">`
      + `<div class="pa-head"><span class="pa-pair">${esc(x.sym)}${x._derived ? ' <span class="pa-derived-tag" title="Derived: mirror of the other 7 majors’ positioning, not a real CFTC-tracked USD-index future — see the note below.">DERIVED</span>' : ''}</span>`
      + `<span class="pa-badge" style="color:${clr}">${label}</span></div>`
      + `<div class="pa-stats-row">`
      +   stat('Z-SCORE', z != null ? sgn(z) + z : '—', clr)
      +   stat('PCTILE', p ?? '—', clr)
      +   stat('NET % OI', sh != null ? sgn(sh) + sh + '%' : '—', clr)
      + `</div></div>`;
  }).join('');

  // Secondary read: two of the cards above, traded against each other, reinforcing
  // the same direction on a real FX cross (the "double extreme" framing) — text
  // only, since the cards themselves are the per-currency source of truth. USD's
  // derived reading is included here too, so USD-leg pairs can now show up.
  const bySym = {}; list.forEach(x => bySym[x.sym] = x);
  const combos = [];
  FX_PAIRS.forEach(([base, quote]) => {
    const A = bySym[base], B = bySym[quote];
    if (!A || !B) return;
    const sA = crowdState(A), sB = crowdState(B);
    let dir = null;
    if (sA === 'long' && sB === 'short') dir = 'long';
    else if (sA === 'short' && sB === 'long') dir = 'short';
    if (dir) combos.push(`<b>${esc(base)}${esc(quote)}</b>${(A._derived || B._derived) ? ' (USD leg derived)' : ''} (specs already max ${dir})`);
  });
  const comboLine = combos.length
    ? `Reinforcing pairs right now: ${combos.join(', ')} — both legs are stretched the same way on that cross.`
    : `None of the cards above currently pair into a reinforcing cross (i.e. no two are stretched in the direction that reinforces on their FX rate) — each is still worth reading on its own.`;
  const usdNote = (usdDerived === null || usdDerived === 'loading')
    ? ' USD has no direct CFTC USD-index future in this feed; a derived mirror-of-the-other-7-majors read is loading in the background (needs all 7 majors’ 200-week histories) and will appear here once it lands.'
    : usd
      ? ' USD\'s card (marked DERIVED) is a synthetic mirror of the other 7 majors’ positioning — sum of the opposite of their net specs, divided by their combined open interest, percentile/Z-scored against that derived series’ own 200-week history. This feed has no direct CFTC USD-index future to track directly, so treat the USD card as a looser read than the other 7 (real, individually tracked) currencies.'
      : usdDerived
        ? ' USD (derived mirror of the other 7 majors) isn\'t currently at a crowding extreme, so it has no card above — this feed still has no direct CFTC USD-index future to track directly either way.'
        : ' USD\'s derived mirror read couldn\'t be built (not enough overlapping history across the other 7 majors right now) — this feed has no direct CFTC USD-index future as a fallback.';
  return kicker + `<div class="pa-grid">${cardsHtml}</div>`
    + `<div class="note">${comboLine} This is a crowding read, not a trade signal — it says the fuel for more of the same is thin, not which way or when it unwinds. It has not been backtested; treat it as context to combine with price and your own risk process, not a rule to act on alone.${usdNote}</div>`;
}

// ── positioning flow: week-over-week change, ranked by size ────────────────
// The crowding percentile is a LEVEL — where positioning sits right now. It says
// nothing about which way it's moving. A market building further into an already
// stretched read is a different situation from one already unwinding from it, and
// that's invisible unless you already know to click into its 200-week history.
// Ranked on `specShareChg` — this week's OI-normalised net share minus last
// week's, in percentage points — not the raw contract count CFTC reports
// (`weeklyChg`, still shown alongside for reference). A 20K-contract move means
// very different things in a 300K-OI market and a 5M-OI one, and normalising by
// this week's OI-normalised share (rather than dividing the raw change by only
// today's open interest) is the reference-spec definition of positioning flow.
function flow(big){
  const rows = (DATA.instruments||[])
    .filter(x => Number.isFinite(x.specShareChg))
    .map(x => ({ ...x, wkPct: x.specShareChg }))
    .sort((a,b) => Math.abs(b.wkPct) - Math.abs(a.wkPct))
    .slice(0, big ? 30 : 16);
  if (!rows.length) return '<div class="empty">No weekly-change data available.</div>';
  // "Extending" = this week's flow pushed further the same way as the existing net
  // share (getting MORE crowded); "paring" = it moved back toward flat (getting
  // LESS crowded). Both specShareChg and specShare already carry the JPY/CAD/CHF
  // sign flip, so this compares cleanly without any extra sign handling.
  const traj = x => {
    if (!x.wkPct || x.specShare == null) return null;
    const dir = x.specShare >= 0 ? 'long' : 'short';
    return (Math.sign(x.wkPct) === Math.sign(x.specShare) ? 'extending ' : 'paring ') + dir;
  };
  return '<table><thead><tr><th>Market</th><th>Pct'+h('pct')+'</th><th>Wk chg</th><th>Net % OI (Δ this wk)</th><th style="text-align:left">Trajectory</th></tr></thead><tbody>'
    + rows.map(x => {
        const t = traj(x), p = pctOf(x), sh = x.specShare;
        const tClr = t == null ? 'var(--tx3)' : t.startsWith('extending') ? 'var(--warn)' : 'var(--ok)';
        return '<tr class="clk" onclick="pick(\''+esc(x.sym)+'\')"><td>'+esc(dispSym(x))+'</td>'
          + '<td style="color:'+colFor(p)+'">'+(p??'—')+'</td>'
          + '<td style="color:'+(x.weeklyChg>0?'var(--long)':x.weeklyChg<0?'var(--short)':'var(--tx3)')+'">'+sgn(x.weeklyChg)+fN(x.weeklyChg)+'</td>'
          + '<td style="color:'+(sh>0?'var(--long)':sh<0?'var(--short)':'var(--tx3)')+'">'+(sh!=null?sgn(sh)+sh+'%':'—')
          +   ' <span class="muted" style="color:'+(x.wkPct>0?'var(--long)':x.wkPct<0?'var(--short)':'var(--tx3)')+'">('+sgn(x.wkPct)+x.wkPct+'%)</span></td>'
          + '<td class="muted" style="text-align:left">'+(t??'—')+'</td></tr>';
      }).join('')
    + '</tbody></table><div class="note">Ranked by this week\'s change in the OI-normalised net share (the number in parens) — the biggest movers, not just the most crowded levels. The number before it is <b>where positioning sits right now</b> (net as % of open interest), so you can see the level a move is coming from, not just the size of the move. "Wk chg" is CFTC\'s own raw contract-count change, for reference. <b>Extending</b> = still building the same way (more crowded); <b>paring</b> = moving back toward flat (less crowded). Click a row for its 200-week history.</div>';
}

// ── event-risk overlay: crowded positions walking into a known catalyst ─────
// Cross-references currently-extreme markets against the live economic calendar
// already used elsewhere in this app (/api/events — Finnhub, next 3 days),
// flagging when a stretched position is heading into a high/medium-impact release
// for its own currency. Country→currency mapping mirrors today.html's CC_TO_CCY
// exactly, so both pages read the calendar the same way. Scoped to FX (direct
// match) plus the three Treasury tenors (all USD) — nothing else, because gold's
// or an equity index's link to any one country's calendar is too indirect to
// assert as a clean mapping here.
const CC_TO_CCY = { US:'USD', EU:'EUR', DE:'EUR', FR:'EUR', IT:'EUR', ES:'EUR', GB:'GBP', UK:'GBP', JP:'JPY', CH:'CHF', AU:'AUD', CA:'CAD', NZ:'NZD' };
let EVENTS = null;   // null = not yet requested; 'loading'; array; or false = failed

async function loadEvents(){
  if (EVENTS !== null) return;
  EVENTS = 'loading';
  try {
    const r = await fetch('/api/events', { cache: 'no-store' });
    const j = await r.json();
    EVENTS = Array.isArray(j) ? j : (Array.isArray(j?.events) ? j.events : false);
  } catch(e) { EVENTS = false; }
  render();
}

const ccyOf = x => x.group === 'fx' ? x.sym : (['TU','TY','US'].includes(x.sym) ? 'USD' : null);

function eventRisk(big){
  if (EVENTS === null) { loadEvents(); return '<div class="empty">Loading the economic calendar…</div>'; }
  if (EVENTS === 'loading') return '<div class="empty">Loading the economic calendar…</div>';
  if (EVENTS === false) return '<div class="empty">Could not load the economic calendar.</div>';

  const now = Date.now();
  const upcoming = upcomingEvents();

  const rows = (DATA.instruments||[]).map(x => {
    const p = pctOf(x), ccy = ccyOf(x);
    if (p == null || !(p>=90 || p<=10) || !ccy) return null;
    const nextEvt = upcoming.find(e => e.ccy === ccy);
    if (!nextEvt) return null;
    const hrs = (nextEvt.ms - now) / 3600000;
    return { x, p, dir: p>=90?'CROWDED LONG':'CROWDED SHORT', nextEvt, hrs,
      when: hrs < 24 ? Math.round(hrs)+'h' : Math.round(hrs/24)+'d' };
  }).filter(Boolean).sort((a,b) => a.hrs-b.hrs);

  if (!rows.length) return '<div class="empty">No currently-crowded market has a high/medium-impact release for its own currency in the next 3 days.</div>';

  return '<table><thead><tr><th>Market</th><th>Positioning</th><th style="text-align:left">Next event</th><th>In</th><th>Impact</th></tr></thead><tbody>'
    + rows.map(r => '<tr class="clk" onclick="pick(\''+esc(r.x.sym)+'\')"><td>'+esc(dispSym(r.x))+'</td>'
      + '<td style="color:'+colFor(r.p)+'"><b>'+r.dir+'</b></td>'
      + '<td class="muted" style="text-align:left">'+esc(r.nextEvt.event||'')+'</td>'
      + '<td>'+r.when+'</td>'
      + '<td style="color:'+((r.nextEvt.impact||'').toLowerCase()==='high'?'var(--warn)':'var(--tx3)')+'">'+esc(r.nextEvt.impact||'')+'</td></tr>').join('')
    + '</tbody></table><div class="note">A crowded position walking into a scheduled release for its own currency is exposed to a fast, catalyst-driven move — not necessarily in either direction. This is an <b>attention</b> flag, not a call on which way the release breaks.</div>';
}

// ── digest: roll the granular panels up into one glance-able summary ────────
// Not a new read — every fact in a row here is already computed by the
// Reinforcing FX Pairs / Confluence / Flow panels below; this just puts them
// side by side per market so you don't have to cross-reference three panels
// yourself. Deliberately per-MARKET, never blended ACROSS markets into one
// board-wide call — that's the exact thing removed in Pair Lab. Where the
// reads disagree, that disagreement is named, not averaged away.
function digest(big){
  const cOf = x => BASIS==='share' ? (x.commSharePct ?? x.commPct) : x.commPct;
  const list = (DATA.instruments||[]).filter(x => { const p = pctOf(x); return p != null && (p >= 90 || p <= 10); });
  if (!list.length) return '<div class="empty">Nothing at a 90th/10th percentile extreme right now — no market has enough of a read to summarise.</div>';

  if (EVENTS === null) loadEvents();   // fire-and-forget, same shared state as the event-risk panel
  const upcoming = upcomingEvents();

  const rows = list.map(x => {
    const p = pctOf(x), wantLong = p >= 90, c = cOf(x);
    const checks = [{ label: 'Spec crowding', agree: true, txt: (wantLong?'CROWDED LONG':'CROWDED SHORT')+' ('+ord(p)+' pct)' }];
    if (c != null) {
      const confirms = wantLong ? c <= 10 : c >= 90;
      checks.push({ label: 'Commercials', agree: confirms,
        txt: confirms ? 'confluence — also at the opposite extreme ('+ord(c)+' pct)' : 'don\'t confirm ('+ord(c)+' pct — not at the opposite extreme)' });
    }
    if (Number.isFinite(x.specShareChg) && x.specShare != null && x.specShareChg !== 0) {
      const extending = Math.sign(x.specShareChg) === Math.sign(x.specShare);
      checks.push({ label: 'This week\'s flow', agree: extending,
        txt: extending ? 'still extending (getting more crowded)' : 'paring back (unwinding, not extending)' });
    }
    const agreeCount = checks.filter(k => k.agree).length;
    const ccy = ccyOf(x), nextEvt = ccy ? upcoming.find(e => e.ccy === ccy) : null;
    return { x, p, wantLong, checks, agreeCount, total: checks.length, nextEvt };
  }).sort((a,b) => (b.agreeCount/b.total) - (a.agreeCount/a.total));

  const cardsHtml = rows.map(r => {
    const clr = colFor(r.p);
    const chips = r.checks.map(k => '<span class="pill" style="color:'+(k.agree?'var(--ok)':'var(--warn)')+'">'+(k.agree?'&#10003;':'&#10007;')+' '+esc(k.label)+': '+esc(k.txt)+'</span>').join(' ');
    const evtChip = r.nextEvt ? ' <span class="pill" style="color:var(--warn)">&#9200; '+esc(r.nextEvt.event)+' ('+esc(r.nextEvt.impact)+')</span>' : '';
    return '<div class="pa-card" style="margin-bottom:10px;cursor:pointer" onclick="pick(\''+esc(r.x.sym)+'\')">'
      + '<div class="pa-head"><span class="pa-pair">'+esc(dispSym(r.x))+'</span>'
      + '<span class="pa-badge" style="color:'+(r.agreeCount===r.total?clr:'var(--warn)')+'">'+r.agreeCount+' of '+r.total+' agree</span></div>'
      + '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">'+chips+evtChip+'</div></div>';
  }).join('');

  return '<div class="kicker">Every line below is already computed by the Reinforcing FX Pairs, Confluence, and Positioning Flow panels — this just lines them up per market instead of asking you to cross-reference three panels yourself. Still not a trade signal: a high agreement count means the reads reinforce each other, not that a move is coming.</div>'
    + cardsHtml
    + '<div class="note">Full agreement means every available read currently reinforces the same crowding direction — the cleanest version of this data\'s read. A lower count names exactly where they disagree (e.g. crowded on level but already unwinding on flow) rather than hiding it in one blended number. Click a card for its 200-week history.</div>';
}

// ── extreme persistence: how established is the crowd, not just how crowded ──
// A market that just touched a 90th-percentile extreme this week and one that has
// sat there for months are both "90th percentile" — identical on every panel above.
// Counts how many of the most recent weeks were ALSO an extreme at the time,
// each ranked only against the up-to-156 weeks trailing IT (never later weeks it
// couldn't have known about) — a true rolling percentile walked backward, the
// same method the backend uses for today's own reading (COT_LIMIT/COT_MIN_HISTORY
// above), not a fixed reference set. Reuses the HIST cache pick() already
// populates, so clicking a market elsewhere never re-fetches it here.
async function loadHistFor(sym){
  if (HIST[sym] !== undefined) return;
  HIST[sym] = 'loading';
  try {
    const r = await fetch('/api/cot-extremes?history=' + encodeURIComponent(sym), { cache: 'no-store' });
    const j = await r.json();
    HIST[sym] = (j && j.ok && j.history && j.history.sym === sym) ? j.history : null;
  } catch (e) { HIST[sym] = null; }
  render();
}

const PERSIST_WINDOW = 156, PERSIST_MIN_HISTORY = 52;
function extremeStreak(hd, wantLong){
  const vals = (hd.specShare || []).filter(v => Number.isFinite(v));
  if (vals.length < PERSIST_MIN_HISTORY + 1) return null;
  let streak = 0;
  for (let i = vals.length - 1; i >= 1; i--) {
    const hist = vals.slice(Math.max(0, i - PERSIST_WINDOW), i);   // trailing window ending just before week i
    if (hist.length < PERSIST_MIN_HISTORY) break;
    const p = pctRankCalc(hist, vals[i]);
    if (!(wantLong ? p >= 90 : p <= 10)) break;
    streak++;
  }
  return streak;
}

function persistence(big){
  const extremeList = (DATA.instruments || []).filter(x => { const p = pctOf(x); return p != null && (p >= 90 || p <= 10); });
  if (!extremeList.length) return '<div class="empty">Nothing at a 90th/10th percentile extreme right now.</div>';
  extremeList.forEach(x => loadHistFor(x.sym));

  const rows = extremeList.map(x => {
    const p = pctOf(x), wantLong = p >= 90, hd = HIST[x.sym];
    if (hd === undefined || hd === 'loading') return { x, p, wantLong, streak: null, state: 'loading' };
    if (!hd) return { x, p, wantLong, streak: null, state: 'unavailable' };
    return { x, p, wantLong, streak: extremeStreak(hd, wantLong), state: 'ok' };
  }).sort((a,b) => (b.streak ?? -1) - (a.streak ?? -1));

  return '<table><thead><tr><th>Market</th><th>Positioning</th><th>Weeks in this extreme</th></tr></thead><tbody>'
    + rows.map(r => {
        const clr = colFor(r.p);
        const wkTxt = r.state === 'loading' ? '<span class="muted">loading…</span>'
          : r.state === 'unavailable' ? '<span class="muted">—</span>'
          : r.streak == null ? '<span class="muted">—</span>'
          : '<b>' + r.streak + '</b>' + (r.streak === 1 ? ' wk (fresh)' : ' wks');
        return '<tr class="clk" onclick="pick(\''+esc(r.x.sym)+'\')"><td>'+esc(dispSym(r.x))+'</td>'
          + '<td style="color:'+clr+'"><b>'+(r.wantLong?'CROWDED LONG':'CROWDED SHORT')+'</b></td>'
          + '<td>'+wkTxt+'</td></tr>';
      }).join('')
    + '</tbody></table><div class="note">Both ends are worth noting for different reasons: a long-running extreme means the crowd has had a long time to prove itself right; a freshly-hit one (1 week) means it just arrived and hasn\'t been tested. Rolling calculation — see the panel help for how it\'s done.</div>';
}

// ── confluence: specs AND commercials independently at opposite extremes, ───
// on the SAME market — the textbook COT contrarian setup. Different from the
// "Extreme crowding alerts" panel above, which checks two DIFFERENT FX legs'
// SPEC readings against each other; this checks one market's spec reading
// against its OWN commercial reading, and applies board-wide, not just FX.
function confluence(big){
  const kicker = '<div class="kicker">Compares <b>one market\'s</b> speculators against its <b>own</b> commercials — not two different currencies against each other (that\'s the Reinforcing FX Pairs panel above). Applies to every market on the board, not just FX.</div>';
  const cOf = x => BASIS==='share' ? (x.commSharePct ?? x.commPct) : x.commPct;
  const rows = (DATA.instruments||[]).map(x => {
    const p = pctOf(x), c = cOf(x);
    if (p == null || c == null) return null;
    if (p >= 90 && c <= 10) return { x, p, c, dir: 'long' };
    if (p <= 10 && c >= 90) return { x, p, c, dir: 'short' };
    return null;
  }).filter(Boolean).sort((a,b) => (Math.abs(50-b.p)+Math.abs(50-b.c)) - (Math.abs(50-a.p)+Math.abs(50-a.c)));

  if (!rows.length) return kicker + '<div class="empty">No market currently has specs AND commercials independently at opposite 90th/10th-percentile extremes — the classic confluence setup isn\'t present on the board right now.</div>';

  return kicker + '<table><thead><tr><th>Market</th><th style="text-align:left">Specs</th><th style="text-align:left">Commercials</th></tr></thead><tbody>'
    + rows.map(r => '<tr class="clk" onclick="pick(\''+esc(r.x.sym)+'\')"><td>'+esc(dispSym(r.x))+'</td>'
      + '<td style="text-align:left;color:'+colFor(r.p)+'"><b>'+(r.dir==='long'?'CROWDED LONG':'CROWDED SHORT')+'</b> ('+ord(r.p)+')</td>'
      + '<td style="text-align:left;color:'+colFor(r.c)+'"><b>'+(r.dir==='long'?'CROWDED SHORT':'CROWDED LONG')+'</b> ('+ord(r.c)+')</td></tr>').join('')
    + '</tbody></table><div class="note">The classic COT contrarian setup: speculators stretched one way, and commercials — who normally take the other side of specs anyway — independently confirming it by sitting at their own opposite extreme too. It doesn\'t call which way or when it turns; it flags where a reversal setup is most textbook right now.</div>';
}

// ── COT vs options positioning: two separate datasets, read side by side ────
// oi-dashboard.html's data (/api/oi-store) is dealer OPTIONS open interest / gamma —
// a different market from the futures positioning COT tracks, populated by a manual
// CME chain paste per pair, so its age matters. Deliberately NOT blended into one
// verdict — same lesson as Pair Lab: two independent facts shown together, judged by
// the reader, not folded into a score.
let OISTORE = null;   // null = not requested; 'loading'; object; or false = failed

async function loadOiStore(){
  if (OISTORE !== null) return;
  OISTORE = 'loading';
  try {
    let r = await fetch('/api/oi-store', { cache: 'no-store' });
    if (!r.ok) r = await fetch('/api/kv/get?key=oi_store', { cache: 'no-store' });
    const j = await r.json();
    OISTORE = (j && typeof j === 'object') ? (j.data || j.value || {}) : false;
  } catch (e) { OISTORE = false; }
  render();
}

// Pairs like XAU/USD are priced legs, not currencies — map onto the nearest COT
// instrument this feed actually tracks. USD uses the same derived mirror as
// elsewhere on this page.
const OI_LEG_TO_COT = { XAU:'GOLD', XAG:'SILVER' };
function legCotRead(leg){
  const sym = OI_LEG_TO_COT[leg] || leg;
  if (sym === 'USD') { if (usdDerived === null) loadUsdMirror(); return usdDerivedReading(); }
  return (DATA.instruments || []).find(x => x.sym === sym) || null;
}

function oiCrossCheck(big){
  if (OISTORE === null) { loadOiStore(); return '<div class="empty">Loading options positioning…</div>'; }
  if (OISTORE === 'loading') return '<div class="empty">Loading options positioning…</div>';
  if (OISTORE === false) return '<div class="empty">Could not load options positioning.</div>';

  const nearestWall = (walls, spot) => {
    const valid = (walls || []).filter(w => Number.isFinite(w.strike));
    if (!valid.length || !Number.isFinite(spot)) return null;
    return valid.reduce((best, w) => Math.abs(w.strike - spot) < Math.abs(best.strike - spot) ? w : best);
  };
  const legBadge = x => !x ? '<span class="muted">—</span>'
    : '<span style="color:'+colFor(pctOf(x))+'">'+esc(dispSym(x))+' '+(pctOf(x) ?? '—')+'</span>';
  const distPct = (strike, spot) => (((strike - spot) / spot) * 100).toFixed(2) + '%';

  const rows = Object.keys(OISTORE).map(pair => {
    const e = OISTORE[pair];
    if (!e || !Number.isFinite(e.spot)) return null;
    const [base, quote] = pair.split('/');
    return { pair, A: legCotRead(base), B: legCotRead(quote),
      put: nearestWall(e.putWalls, e.spot), call: nearestWall(e.callWalls, e.spot),
      spot: e.spot, ageH: e.savedAtMs ? (Date.now() - e.savedAtMs) / 36e5 : null };
  }).filter(Boolean);

  if (!rows.length) return '<div class="empty">No options positioning saved yet — paste a CME chain on the <a href="oi-dashboard.html">OI Analytics</a> page first.</div>';

  // Plain-English breakdown of each row's actual numbers, not just a glossary of the
  // column headers — written for someone new to COT/options, so it spells out what
  // "crowded", "put wall" and "stale" concretely mean for THIS pair's numbers rather
  // than assuming the reader already knows.
  const legPhrase = x => {
    if (!x) return 'no COT data for this leg';
    const p = pctOf(x);
    if (p == null) return esc(dispSym(x))+' has no current COT reading';
    const word = p>=90 ? 'crowded <b>LONG</b> — speculators are stretched net long, a one-sided bet that\'s already mostly been made, leaving less fresh buying to push it further'
      : p<=10 ? 'crowded <b>SHORT</b> — speculators are stretched net short, a one-sided bet that\'s already mostly been made, leaving less fresh selling to push it further'
      : p>=70 ? 'leaning long, but not stretched enough to call it crowded'
      : p<=30 ? 'leaning short, but not stretched enough to call it crowded'
      : 'roughly neutral — no strong lean either way right now';
    return '<b>'+esc(dispSym(x))+'</b> is '+word+' ('+ord(p)+' percentile of its own 200-week range — 90+ or 10- is what counts as crowded on this page)';
  };
  const wallPhrase = (w, spot, kind) => {
    if (!w) return 'no '+kind+' wall was found in the saved options data for this pair';
    const side = kind === 'put' ? 'below' : 'above';
    const role = kind === 'put'
      ? 'a put wall often acts like a <b>floor</b>: it\'s the strike where the most put open interest sits, so dealers who sold those puts tend to buy as price nears it (they\'re hedging their own risk), which can slow or stall a decline — not guarantee one'
      : 'a call wall often acts like a <b>ceiling</b>: it\'s the strike where the most call open interest sits, so dealers who sold those calls tend to sell as price nears it, which can slow or stall a rally — not guarantee one';
    return 'the nearest <b>'+kind+' wall</b> sits at <b>'+w.strike+'</b>, '+distPct(w.strike,spot)+' '+side+' spot — '+role;
  };
  const explainers = rows.map(r => {
    const stale = r.ageH != null && r.ageH > 36
      ? ' This options data is '+Math.round(r.ageH)+'h old — stale enough that these wall levels may have already shifted since it was pasted, so treat them as a rough guide rather than current.'
      : '';
    return '<div class="note" style="margin-top:14px">'
      + '<b>'+esc(r.pair)+'</b> — ' + legPhrase(r.A) + '. ' + legPhrase(r.B) + '. '
      + 'On the options side, ' + wallPhrase(r.put, r.spot, 'put') + '. And ' + wallPhrase(r.call, r.spot, 'call') + '.'
      + stale + '</div>';
  }).join('');

  return '<table><thead><tr><th>Pair</th><th style="text-align:left">COT (base / quote)</th>'
    + '<th style="text-align:left">Put wall (support)</th><th style="text-align:left">Call wall (resistance)</th><th>Options data age</th></tr></thead><tbody>'
    + rows.map(r => {
        const ageTxt = r.ageH == null ? '—' : r.ageH < 1 ? Math.round(r.ageH*60)+'m' : Math.round(r.ageH)+'h';
        const ageClr = r.ageH == null ? 'var(--tx3)' : r.ageH > 36 ? 'var(--warn)' : 'var(--tx3)';
        return '<tr><td>'+esc(r.pair)+'</td>'
          + '<td style="text-align:left">'+legBadge(r.A)+' / '+legBadge(r.B)+'</td>'
          + '<td class="muted" style="text-align:left">'+(r.put ? r.put.strike+' ('+distPct(r.put.strike,r.spot)+')' : '—')+'</td>'
          + '<td class="muted" style="text-align:left">'+(r.call ? r.call.strike+' ('+distPct(r.call.strike,r.spot)+')' : '—')+'</td>'
          + '<td style="color:'+ageClr+'">'+ageTxt+'</td></tr>';
      }).join('')
    + '</tbody></table><div class="note">COT is weekly <b>futures</b> positioning (who\'s already committed); the walls are dealer <b>options</b> open interest (where hedging flow may cluster) — two separate markets, shown side by side rather than combined. A currency crowded on COT sitting right under a heavy wall is worth noting, not automatically anything.</div>'
    + explainers;
}

function scatter(big){
  const cOf = x => BASIS==='share' ? (x.commSharePct ?? x.commPct) : x.commPct;
  const list=(DATA.instruments||[]).filter(x=>pctOf(x)!=null && cOf(x)!=null);
  if(list.length<3) return '<div class="empty">Not enough paired data.</div>';
  const W=1000,H=big?460:340,P=48;
  const X=v=>P+(v/100)*(W-2*P), Y=v=>H-P-(v/100)*(H-1.75*P);
  let s='<svg viewBox="0 0 '+W+' '+H+'">';
  s+='<line x1="'+X(0)+'" y1="'+Y(100)+'" x2="'+X(100)+'" y2="'+Y(0)+'" stroke="var(--tx3)" stroke-width="1" stroke-dasharray="4 4"/>';
  [0,50,100].forEach(v=>{ s+='<line class="gl" x1="'+X(v)+'" y1="'+Y(0)+'" x2="'+X(v)+'" y2="'+Y(100)+'"/>'
    +'<line class="gl" x1="'+X(0)+'" y1="'+Y(v)+'" x2="'+X(100)+'" y2="'+Y(v)+'"/>';});
  list.forEach(x=>{
    s+='<circle cx="'+X(pctOf(x))+'" cy="'+Y(cOf(x))+'" r="'+(big?6:4.5)+'" fill="'+colFor(pctOf(x))+'" opacity=".8"/>';
    if(big||Math.abs(50-pctOf(x))>=35)
      s+='<text class="lbl" x="'+(X(pctOf(x))+7)+'" y="'+(Y(cOf(x))+4)+'" style="font-size:'+(big?11:9.5)+'px">'+esc(dispSym(x))+'</text>';
  });
  s+='<text class="lbl" x="'+(W/2)+'" y="'+(H-P+28)+'" text-anchor="middle">speculative crowding percentile &rarr;</text>'
    +'<text class="lbl" x="'+P+'" y="'+(P-14)+'">commercial percentile &uarr;</text></svg>';
  return s+'<div class="note">Commercials take the other side of specs, so markets should sit near the dashed '
    +'downward diagonal. A dot well <b>off</b> it means the usual mirror has broken.</div>';
}

function history(big){
  if(!SEL) return '<div class="empty">Pick a market from any table to load its 200-week positioning history.</div>';
  const hd=HIST[SEL];
  if(hd==='loading') return '<div class="empty">Loading history…</div>';
  if(!hd) return '<div class="empty">No history available for '+esc(SEL)+'.<br>'
    +'<button class="btn" style="margin-top:12px" onclick="pick(\''+esc(SEL)+'\')">Retry</button></div>';
  const ser = BASIS==='share' ? hd.specShare : hd.specNet;
  const vals=(ser||[]).map((v,i)=>({v,d:(hd.dates||[])[i]})).filter(x=>Number.isFinite(x.v));
  if(vals.length<5) return '<div class="empty">Series too short to chart.</div>';
  const W=1000,H=big?400:260,P=50;
  const lo=Math.min(...vals.map(x=>x.v)), hi=Math.max(...vals.map(x=>x.v));
  const X=i=>P+(i/(vals.length-1))*(W-2*P), Y=v=>H-P-((v-lo)/((hi-lo)||1))*(H-1.75*P);
  let s='<svg viewBox="0 0 '+W+' '+H+'">';
  if(lo<0&&hi>0) s+='<line class="axis" x1="'+P+'" y1="'+Y(0)+'" x2="'+(W-P)+'" y2="'+Y(0)+'"/>';
  s+='<path d="'+vals.map((x,i)=>(i?'L':'M')+X(i)+' '+Y(x.v)).join(' ')+'" fill="none" stroke="var(--neu)" stroke-width="1.8"/>';
  const cur=vals[vals.length-1];
  s+='<circle cx="'+X(vals.length-1)+'" cy="'+Y(cur.v)+'" r="5" fill="var(--acc)"/>'
    +'<text class="lbl" x="'+(X(vals.length-1)-9)+'" y="'+(Y(cur.v)-10)+'" text-anchor="end" style="fill:var(--acc)">now '
    +(BASIS==='share'?cur.v+'%':fN(cur.v))+'</text>';
  s+='<text class="lbl" x="'+(P-9)+'" y="'+(Y(hi)+4)+'" text-anchor="end">'+(BASIS==='share'?hi.toFixed(1)+'%':fN(hi))+'</text>'
    +'<text class="lbl" x="'+(P-9)+'" y="'+(Y(lo)+4)+'" text-anchor="end">'+(BASIS==='share'?lo.toFixed(1)+'%':fN(lo))+'</text>'
    +'<text class="lbl" x="'+P+'" y="'+(H-P+22)+'">'+esc(vals[0].d||'')+'</text>'
    +'<text class="lbl" x="'+(W-P)+'" y="'+(H-P+22)+'" text-anchor="end">'+esc(cur.d||'')+'</text></svg>';
  return s+'<div class="note"><b>'+esc(hd.label||SEL)+'</b> — '+vals.length+' weekly readings of '
    +(BASIS==='share'?'net position as % of open interest':'net speculative contracts')
    +'. The percentile alone hides this shape: the 90th after a steady climb is a different situation from the 90th after a spike.</div>';
}

function allTable(){
  const cOf = x => BASIS==='share' ? (x.commSharePct ?? x.commPct) : x.commPct;
  const rows=(DATA.instruments||[]).slice().sort((a,b)=>(pctOf(b)??0)-(pctOf(a)??0));
  return '<table><thead><tr><th>Market</th><th>Grp</th><th>Pct'+h('pct')+'</th><th>Z'+h('z')+'</th>'
    +'<th>Spec net'+h('spec')+'</th><th>% of OI</th><th>Comm'+h('comm')+'</th>'
    +'<th>OI</th><th>OI pct'+h('oi')+'</th><th>Wk chg'+h('wk')+'</th><th>L/S'+h('gross')+'</th></tr></thead><tbody>'
    + rows.map(x=>{const p=pctOf(x);
      return '<tr class="clk '+(SEL===x.sym?'sel':'')+'" onclick="pick(\''+esc(x.sym)+'\')">'
        +'<td>'+esc(dispSym(x))+'</td><td class="muted">'+esc(x.group)+'</td>'
        +'<td style="color:'+colFor(p)+'"><b>'+(p??'—')+'</b></td><td class="muted">'+(zOf(x)??'—')+'</td>'
        +'<td>'+fN(x.specNet)+'</td><td class="muted">'+(x.specShare!=null?x.specShare+'%':'—')+'</td>'
        +'<td class="muted">'+(cOf(x)??'—')+'</td>'
        +'<td class="muted">'+fN(x.openInterest)+'</td><td class="muted">'+(x.oiPct??'—')+'</td>'
        +'<td style="color:'+(x.weeklyChg>0?'var(--long)':x.weeklyChg<0?'var(--short)':'var(--tx3)')+'">'+sgn(x.weeklyChg)+fN(x.weeklyChg)+'</td>'
        +'<td class="muted">'+(x.grossRatio??'—')+'</td></tr>';}).join('')
    + '</tbody></table>';
}

// Where the two ranking bases disagree — the reason for normalising, shown rather than
// asserted so it can be checked against the numbers on the same page.
function disagree(){
  const rows=(DATA.instruments||[]).filter(x=>x.specSharePct!=null&&x.specPct!=null)
    .map(x=>({...x,gap:Math.abs(x.specSharePct-x.specPct)}))
    .sort((a,b)=>b.gap-a.gap).slice(0,8);
  if(!rows.length) return '<div class="empty">The OI-normalised percentiles are not in this payload yet —'
    +' they appear after the next COT refresh. Until then the ranking falls back to raw contracts.</div>';
  return '<table><thead><tr><th>Market</th><th>% of OI rank</th><th>Raw rank</th><th>Gap</th><th>OI pct</th></tr></thead><tbody>'
    + rows.map(x=>'<tr class="clk" onclick="pick(\''+esc(x.sym)+'\')"><td>'+esc(dispSym(x))+'</td><td><b>'+x.specSharePct+'</b></td>'
      +'<td class="muted">'+x.specPct+'</td>'
      +'<td style="color:'+(x.gap>=20?'var(--warn)':'var(--tx3)')+'">'+x.gap+'</td>'
      +'<td class="muted">'+(x.oiPct??'—')+'</td></tr>').join('')
    + '</tbody></table><div class="note">A large gap alongside a <b>low OI percentile</b> means a thin market: '
    +'the same contract count is far more crowded than the raw ranking admits.</div>';
}

// ── asset-class display order and labels ────────────────────────────────────
// The API's `group` values are lowercase internal keys; these are what a reader
// sees. Order is deliberately "what moves FX first" rather than alphabetical —
// FX, then the rates and equity complexes that drive it, then commodities.
const GRP_ORDER = ['fx','rates','equities','metals','energy','grains','softs','livestock','crypto'];
const GRP_NAME  = { fx:'FX', rates:'Rates', equities:'Equities', metals:'Metals', energy:'Energy',
                    grains:'Grains', softs:'Softs', livestock:'Livestock', crypto:'Crypto' };
const grpRank = g => { const i = GRP_ORDER.indexOf(g); return i < 0 ? 99 : i; };

// Commercial percentile on whichever ranking basis is selected — the same expression
// three panels below each defined privately as `cOf`. Hoisted so the summary read and
// those panels cannot drift apart on which basis they rank commercials by.
const commOf = x => BASIS==='share' ? (x.commSharePct ?? x.commPct) : x.commPct;

// Every market at the page-wide 90th/10th extreme threshold, most stretched first.
const extremes = () => (DATA.instruments||[])
  .filter(x => { const p = pctOf(x); return p != null && (p >= 90 || p <= 10); })
  .sort((a,b) => Math.abs(50-pctOf(b)) - Math.abs(50-pctOf(a)));

// The Confluence panel's exact test, reused rather than re-expressed: specs at one
// extreme AND commercials independently at the opposite one, same market.
const hasConfluence = x => { const p = pctOf(x), c = commOf(x);
  return p != null && c != null && ((p >= 90 && c <= 10) || (p <= 10 && c >= 90)); };

// Upcoming high/medium-impact releases mapped to a currency, soonest first. This filter
// was written out separately in the event-risk panel and in the digest; one copy so they
// and the summary read can never name a different "next event" for the same market.
function upcomingEvents(){
  if(!EVENTS || EVENTS === 'loading' || EVENTS === false) return [];
  const now = Date.now();
  return EVENTS
    .map(e => ({ ...e, ms: new Date(e.time).getTime(), ccy: CC_TO_CCY[e.country] }))
    .filter(e => e.ccy && !isNaN(e.ms) && e.ms >= now && ['high','medium'].includes((e.impact??'').toLowerCase()))
    .sort((a,b) => a.ms - b.ms);
}

// ── SPOTLIGHT ───────────────────────────────────────────────────────────────
// The ledger below answers "where does everything sit". This answers the question
// you actually have on opening the page — "what is stretched right now" — without
// making you scan 40 rows for it. Same numbers, ranked and hoisted.
function spotlight(big){
  const list = extremes();
  if(!list.length) return '<div class="empty">No market is at a 90th/10th-percentile positioning extreme right now — nothing crowded enough to spotlight.</div>';
  const shown = list.slice(0, big ? 60 : 12);
  const legend = '<div class="legend">'
    + '<span><i style="background:var(--long)"></i>Crowded long (90th percentile or above)</span>'
    + '<span><i style="background:var(--short)"></i>Crowded short (10th or below)</span>'
    + '<span><i style="background:var(--acc);border-radius:50%"></i>Commercials confirm — textbook reversal setup</span>'
    + '<span class="muted">Click a card to load its 200-week history at the bottom of the page</span></div>';
  const cards = shown.map(x => {
    const p = pctOf(x), lng = p >= 90, clr = lng ? 'var(--long)' : 'var(--short)';
    return '<div class="sp" style="border-left-color:'+clr+'" onclick="pick(\''+esc(x.sym)+'\')">'
      + '<div class="sp-top"><span class="sp-sym">'+esc(dispSym(x))+'</span>'
      + '<span class="sp-grp">'+esc(GRP_NAME[x.group]||x.group||'')+'</span>'
      + (hasConfluence(x) ? '<span class="sp-dot" title="Commercials are independently at their own opposite extreme — the textbook contrarian setup. See the Confluence panel."></span>' : '')
      + '</div><div class="sp-val" style="color:'+clr+'">'+p+'</div>'
      + '<div class="sp-lbl">'+(lng ? 'extreme long' : 'extreme short')+'</div></div>';
  }).join('');
  const ranked = (DATA.instruments||[]).filter(x => pctOf(x) != null).length;
  const more = (list.length > shown.length)
    ? ' <b>'+(list.length-shown.length)+'</b> more are also at an extreme — use Enlarge for the full set.' : '';
  return legend + '<div class="sp-grid">'+cards+'</div>'
    + '<div class="note"><b>'+list.length+' of '+ranked+'</b> ranked markets sit at a 90th/10th-percentile extreme of their '
    + '<b>own</b> trailing history — not versus each other — ordered most stretched first. Crowding says the fuel for more of '
    + 'the same is thin, not that it turns now.'+more+'</div>';
}

// ── POSITIONING LEDGER ──────────────────────────────────────────────────────
// Replaces the flat crowding leaderboard AND the separate group-median table,
// carrying both their contents: every market's percentile with the same colour
// coding, and each group's median in its header. Grouping is the point — a
// crowded market inside a group that is ALL leaning the same way is a macro
// theme, and the flat ranking could not show that without cross-referencing a
// second panel. The shaded bands at each end are the 90th/10th thresholds
// themselves, so "how close is this to counting as extreme" is readable off the
// bar rather than only off the number.
function ledger(big){
  const list = (DATA.instruments||[]).filter(x => pctOf(x) != null);
  if(!list.length) return '<div class="empty">No instrument has enough history to rank yet.</div>';

  const axis = [[0,'0'],[10,'10'],[50,'50th pctile'],[90,'90'],[100,'100']]
    .map(function(t){ return '<span style="left:'+t[0]+'%">'+t[1]+'</span>'; }).join('');

  const row = x => {
    const p = pctOf(x), clr = colFor(p), d4 = x.specShareChg4w, sh = x.specShare;
    const lo = Math.min(p,50), w = Math.abs(p-50);
    const dTxt = !Number.isFinite(d4) ? '<span class="muted">—</span>'
      : '<span style="color:'+(d4>0?'var(--long)':d4<0?'var(--short)':'var(--tx3)')+'">'
        + (d4>0?'&#9650;':d4<0?'&#9660;':'&ndash;')+sgn(d4)+d4.toFixed(1)+'pp</span>';
    const tip = dispSym(x)+' — '+ord(p)+' percentile'
      + (sh != null ? ', net '+sgn(sh)+sh+'% of open interest' : '')
      + (Number.isFinite(x.specShareChg) ? ', '+sgn(x.specShareChg)+x.specShareChg+'pp this week' : '')
      + '. Click for its 200-week history.';
    return '<div class="lg-row clk" title="'+esc(tip)+'" onclick="pick(\''+esc(x.sym)+'\')">'
      + '<div class="lg-nm">'+esc(dispSym(x))+'</div>'
      + '<div class="lg-tr">'
      +   '<div class="lg-zn" style="left:0;width:10%;background:rgba(70,184,122,.14)"></div>'
      +   '<div class="lg-zn" style="left:90%;width:10%;background:rgba(232,97,95,.14)"></div>'
      +   '<div class="lg-mid" style="left:50%"></div>'
      +   '<div class="lg-bar" style="left:'+lo+'%;width:'+(w || 0.35)+'%;background:'+clr+'"></div>'
      +   '<div class="lg-tk" style="left:calc('+p+'% - 1px);background:'+clr+'"></div>'
      + '</div>'
      + '<div class="lg-v" style="color:'+clr+'">'+p+'</div>'
      + '<div class="lg-d">'+dTxt+'</div></div>';
  };

  const secs = [...new Set(list.map(x => x.group))].sort((a,b) => grpRank(a)-grpRank(b)).map(g => {
    const rows = list.filter(x => x.group === g).sort((a,b) => pctOf(b)-pctOf(a));
    const srt = rows.map(pctOf).sort((a,b) => a-b), med = srt[srt.length>>1];
    // The old "By asset class" table's median, kept here where the markets it summarises
    // are actually visible — a median of 88 over ten markets and one of 88 over two say
    // very different things, and the standalone table could not show which you had.
    const lean = med >= 70 ? 'the whole group leans long' : med <= 30 ? 'the whole group leans short'
      : 'mixed across the group';
    return '<div class="lg-sec"><div class="lg-h"><b>'+esc(GRP_NAME[g]||g)+'</b>'
      + '<span>'+rows.length+' market'+(rows.length===1?'':'s')+' &middot; median '+ord(med)+' &middot; '+lean+'</span></div>'
      + '<div class="lg-row hd"><div></div><div class="lg-ax">'+axis+'</div>'
      + '<div class="lg-v">spec pctile</div><div class="lg-d">4wk &Delta;</div></div>'
      + rows.map(row).join('') + '</div>';
  }).join('');

  const noDelta = list.every(x => !Number.isFinite(x.specShareChg4w));
  return secs + '<div class="note">Every ranked market, grouped by asset class. The bar runs from the 50th '
    + 'percentile out to where that market sits in its <b>own</b> trailing history — not versus the other markets — '
    + 'on <b>'+(BASIS==='share'?'net position as % of open interest':'raw contract counts')+'</b>. The shaded bands '
    + 'are the 90th/10th thresholds this page treats as extreme; red = crowded long, green = crowded short. '
    + '<b>4wk &Delta;</b> is the change in that net share over four weeks, in percentage points — a month of drift, so '
    + 'a reading that arrived this week reads differently from one that has been grinding the same way since last '
    + 'month. Group medians answer whether a crowded market is on its own or part of a shared theme.'
    + (noDelta ? ' <b>The 4-week column is empty because the cached payload predates it</b> — press Refresh CFTC, or wait for the next weekly refresh.' : '')
    + '</div>';
}

// ── THIS WEEK'S READ ────────────────────────────────────────────────────────
// The page shows several hundred numbers across a dozen panels and never says what
// they add up to. This is the plain-English answer to "what is this report telling
// me", with one sub-read per panel so every number is already interpreted before you
// scroll to it. Nothing here is a second opinion — it reads the same fields the
// panels do and says them in English. Modelled on the OI dashboard's "Today's read"
// deliberately, so the two desks explain themselves the same way.
//
// Traffic lights are NOT directional, same convention as the OI page. Green = nothing
// here argues against your plan. Amber = something is changing, or needs care. Red =
// this contradicts a trade you might be about to take. Direction comes from your own
// system; this only says how far to trust it.
function _rd(light, panel, headline, detail){
  const col = light==='ok' ? 'var(--ok)' : light==='warn' ? 'var(--warn)'
            : light==='bad' ? 'var(--long)' : 'var(--tx3)';
  return '<div class="rd"><div class="rd-h"><span class="rdot" style="background:'+col+'"></span>'+panel+'</div>'
    + '<div class="rd-v">'+headline+'</div>'+(detail?'<div class="rd-d">'+detail+'</div>':'')+'</div>';
}

function thisWeeksRead(){
  const all = (DATA && DATA.instruments) || [];
  if(!all.length) return '';
  const ranked = all.filter(x => pctOf(x) != null);
  const ext    = extremes();
  const longs  = ext.filter(x => pctOf(x) >= 90), shorts = ext.filter(x => pctOf(x) <= 10);
  const rdate  = (all[0] && all[0].reportDate) || DATA.reportDate;
  const ageD   = rdate ? Math.round((Date.now()-Date.parse(rdate))/864e5) : null;
  const nm     = x => esc(dispSym(x));

  // ── headline ─────────────────────────────────────────────────────────────
  // How much of the board is stretched at once. A single crowded market is a story
  // about that market; a quarter of the board crowded at once is usually one macro
  // theme wearing several costumes, and those are read differently.
  const share = ranked.length ? ext.length/ranked.length : 0;
  const reg = !ranked.length ? 'NOT ENOUGH HISTORY'
    : !ext.length            ? 'CALM — nothing is stretched'
    : share >= 0.25          ? 'STRETCHED — much of the board is crowded'
    : share >= 0.10          ? 'PATCHY — a handful of crowded markets'
                             : 'QUIET — one or two crowded markets';
  const regCol = !ranked.length ? 'var(--tx3)' : !ext.length ? 'var(--ok)'
    : share >= 0.25 ? 'var(--warn)' : 'var(--tx2)';
  const verdict = !ranked.length
    ? 'No market has enough trailing history behind it to rank yet.'
    : !ext.length
      ? 'Nothing on the board sits at a 90th/10th-percentile extreme of its own history. <b>Positioning is not the constraint this week</b> — whatever you trade, the crowd is not obviously already in the way.'
      : '<b>'+ext.length+' of '+ranked.length+'</b> ranked markets sit at a 90th/10th-percentile extreme &mdash; <b>'
        + longs.length+'</b> crowded long, <b>'+shorts.length+'</b> crowded short. '
        + (share >= 0.25
            ? 'That is a lot at once, which usually means <b>one shared macro theme</b> rather than that many separate stories &mdash; read the asset-class line below before treating any single one as idiosyncratic.'
            : 'That is a normal number, so read each on its own rather than as a board-wide theme.');

  let top = '<div class="rd-top"><div class="rd-reg" style="color:'+regCol+'">'+reg+'</div>'
    + '<div class="rd-say">'+verdict+'</div>';

  if(ext.length){
    const top3 = ext.slice(0,3).map(x => '<b>'+nm(x)+'</b> ('+ord(pctOf(x))+(pctOf(x)>=90?', long':', short')+')').join(' &middot; ');
    top += '<div class="rd-say"><b>Most stretched right now:</b> '+top3
      + '. Those are the readings furthest from their own historical middle, so they are where an unwind would have the least standing in its way.</div>';
  }

  // Which asset classes lean as a block. This is the question the old group-median
  // table existed to answer, said in a sentence instead of left as a number to read.
  const leans = [...new Set(ranked.map(x => x.group))].map(g => {
    const srt = ranked.filter(x => x.group===g).map(pctOf).sort((a,b)=>a-b);
    return { g, n: srt.length, med: srt[srt.length>>1] };
  }).filter(x => x.n >= 2 && (x.med >= 70 || x.med <= 30)).sort((a,b) => Math.abs(50-b.med)-Math.abs(50-a.med));
  top += '<div class="rd-say"><b>Where the crowd is as a block:</b> '
    + (leans.length
        ? leans.map(x => '<b>'+esc(GRP_NAME[x.g]||x.g)+'</b> leans '+(x.med>=70?'long':'short')+' (median '+ord(x.med)+' across '+x.n+')').join(' &middot; ')
          + '. A whole class leaning one way is one macro position, not '+leans.length+' independent ones — sizing them as separate trades understates the risk actually being carried.'
        : 'no asset class has a median past the 70th/30th percentile, so nothing is leaning as a block — each crowded market below is its own story.')
    + '</div>';

  top += '<div class="rd-say"><b>What this can and cannot tell you:</b> COT is a <b>Tuesday</b> snapshot published <b>Friday</b>'
    + (ageD != null ? ', so what is below is <b>'+ageD+' days old</b>' : '')
    + '. Positioning moved inside that gap and you cannot see how. Every number here is a <b>crowding conditioner</b> — it says how much fuel is left for more of the same, never when it turns. Nothing on this page is a timing signal or an entry.</div></div>';

  // ── sub-reads, one per panel below ───────────────────────────────────────
  const sub = [];

  // Spotlight
  const mostLong = longs[0], mostShort = shorts[0];
  sub.push(_rd(!ext.length ? 'ok' : share>=0.25 ? 'warn' : 'ok', 'Spotlight',
    !ext.length ? 'Nothing at an extreme'
      : (mostLong ? 'Most crowded long <b>'+nm(mostLong)+'</b> ('+ord(pctOf(mostLong))+')' : 'No crowded longs')
        + ' &middot; ' + (mostShort ? 'most crowded short <b>'+nm(mostShort)+'</b> ('+ord(pctOf(mostShort))+')' : 'no crowded shorts'),
    !ext.length ? 'No market is near the edge of its own range. There is nothing here to fade, and nothing warning you off a trend trade either.'
      : 'These are the two ends of the board. Sitting at the 100th percentile does not mean expensive or wrong — it means the position is already on, so the marginal buyer who would push it further has mostly already bought.'));

  // Positioning ledger
  sub.push(_rd(leans.length ? 'warn' : 'ok', 'Positioning ledger',
    leans.length ? '<b>'+leans.length+'</b> asset class'+(leans.length===1?'':'es')+' leaning as a block'
                 : 'No asset class leaning as a block',
    leans.length
      ? 'When a whole class sits on one side, the crowded markets inside it are not independent bets — they unwind together. The ledger shows whether your market is the outlier in its group or one of the herd.'
