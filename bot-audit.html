<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Audit · live performance terminal</title>
<script src="js/botRegistry.js?v=1"></script>
<style>
  :root {
    --bg:#0a0d13; --panel:#11151d; --panel2:#161b26; --line:#232a38; --line2:#2f394b;
    --fg:#dfe6f0; --dim:#7c8798; --dim2:#5a6474;
    --good:#3fd07a; --bad:#f2555a; --warn:#e0a93b; --accent:#5eb0ff; --accent2:#c084fc;
    --s2:#1a1f2e; --border:#2b3245;
    --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  a { color:var(--accent); text-decoration:none; }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }

  /* ── command bar ── */
  .cmd { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
         padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  .cmd label { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.07em; }
  select, input { background:var(--bg); color:var(--fg); border:1px solid var(--line2);
                  border-radius:5px; padding:5px 9px; font-size:12px; font-family:var(--mono); }
  input[type=number] { width:110px; }
  button { background:var(--panel2); color:var(--fg); border:1px solid var(--line2);
           border-radius:5px; padding:5px 11px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--accent); }
  button.on { background:#0d2b22; border-color:var(--good); color:var(--good); }
  button.warnon { background:#2c2400; border-color:var(--warn); color:var(--warn); }
  .seg { display:flex; }
  .seg button { border-radius:0; margin-left:-1px; }
  .seg button:first-child { border-radius:5px 0 0 5px; margin-left:0; }
  .seg button:last-child { border-radius:0 5px 5px 0; }
  .spacer { flex:1; }

  /* ── tabs ── */
  .tabs { display:flex; gap:2px; padding:0 16px; background:var(--panel);
          border-bottom:1px solid var(--line); overflow-x:auto; }
  .tab { background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px;
         padding:9px 14px; font-size:12px; font-weight:600; color:var(--dim); cursor:pointer;
         white-space:nowrap; font-family:var(--mono); }
  .tab:hover { color:var(--fg); }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  .tab .tag { color:var(--dim2); font-size:10px; margin-right:5px; }
  .pane { display:none; padding:16px; }
  .pane.active { display:block; }

  /* ── panels ── */
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px;
           margin-bottom:14px; }
  .ph { display:flex; align-items:center; gap:8px; padding:8px 12px;
        border-bottom:1px solid var(--line); font-size:11px; font-weight:600;
        text-transform:uppercase; letter-spacing:.07em; color:var(--dim); font-family:var(--mono); }
  .ph .badge { background:var(--s2); border:1px solid var(--border); color:var(--accent);
               border-radius:3px; padding:1px 5px; font-size:10px; letter-spacing:0; }
  .ph .rt { margin-left:auto; color:var(--dim2); font-weight:400; text-transform:none; letter-spacing:0; }
  .pb { padding:12px; }

  /* ── metric tiles ── */
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr));
           gap:8px; margin-bottom:14px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
  .tile .k { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.07em;
             font-family:var(--mono); }
  .tile .v { font-size:19px; font-weight:700; margin-top:3px; font-family:var(--mono);
             font-variant-numeric:tabular-nums; }
  .tile .s { color:var(--dim2); font-size:10.5px; margin-top:2px; font-family:var(--mono); }
  .tile.thin .v { color:var(--dim); }
  .tile.thin::after { content:'thin sample'; display:block; color:var(--warn); font-size:9.5px;
                      margin-top:3px; font-family:var(--mono); }
  .tile.locked .v { color:var(--dim2); }
  .pos { color:var(--good); } .neg { color:var(--bad); } .neu { color:var(--fg); }

  /* ── tables ── */
  table { width:100%; border-collapse:collapse; font-size:12px; font-family:var(--mono);
          font-variant-numeric:tabular-nums; }
  th,td { padding:4px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th { color:var(--dim); font-weight:600; font-size:10.5px; text-transform:uppercase;
       letter-spacing:.05em; position:sticky; top:0; background:var(--panel); }
  th:first-child, td:first-child, th.l, td.l { text-align:left; }
  tbody tr:hover { background:var(--panel2); }
  .scroll { max-height:520px; overflow:auto; }

  .chip { display:inline-block; border-radius:3px; padding:1px 6px; font-size:10.5px;
          font-weight:600; font-family:var(--mono); }

  /* ── heatmap ── */
  .heat td { text-align:center; font-size:11px; padding:5px 4px; border:1px solid var(--bg); }
  .heat td.na { color:var(--dim2); background:var(--panel2); }
  .heat th { text-align:center; }


  /* ── terminal chrome ── */
  body { padding-bottom:30px; }
  .cmdline { display:flex; align-items:center; gap:8px; padding:7px 16px;
             background:#0c1017; border-bottom:1px solid var(--line); }
  .cmdline .prompt { color:var(--accent); font-family:var(--mono); font-size:12px; font-weight:700;
                     letter-spacing:.04em; white-space:nowrap; }
  .cmdline input { flex:1; background:transparent; border:none; color:var(--fg);
                   font-family:var(--mono); font-size:12px; padding:3px 0; outline:none; }
  .cmdline input::placeholder { color:#3f4859; }
  .cmdline .go { background:var(--panel2); border:1px solid var(--line2); color:var(--dim);
                 border-radius:3px; padding:3px 10px; font-size:10.5px; font-family:var(--mono);
                 letter-spacing:.08em; cursor:pointer; }
  .cmdline .go:hover { border-color:var(--accent); color:var(--accent); }
  .cmdhint { color:var(--bad); font-family:var(--mono); font-size:11px; white-space:nowrap; }

  /* Cost-mode banner — his FTMO COST-ADJUSTED VIEW bar. A view this different
     from the default must announce itself across the whole width, not hide in
     a toggle's active state. */
  .modebar { display:none; text-align:center; font-family:var(--mono); font-size:11px;
             letter-spacing:.14em; font-weight:700; padding:4px; text-transform:uppercase; }
  .modebar.on { display:block; }
  .modebar.gross { background:#3a1414; color:#ff8a8a; border-bottom:1px solid #6b1f1f; }

  /* Panel corner ticks — cheap, and the single strongest cue that a panel is an
     instrument readout rather than a card. */
  .panel { position:relative; }
  .panel::after, .panel::before { content:''; position:absolute; width:7px; height:7px; pointer-events:none; }
  .panel::before { right:0; bottom:0; border-right:1px solid var(--line2); border-bottom:1px solid var(--line2); }
  .panel::after  { left:0;  bottom:0; border-left:1px solid var(--line2);  border-bottom:1px solid var(--line2); }

  /* ── chart frame: HTML gutters around a stretched SVG plot ── */
  .chart { position:relative; padding-left:62px; cursor:crosshair; }
  .chart.nogut { padding-left:0; cursor:default; }
  .plot { position:relative; }
  .plot svg { display:block; width:100%; height:100%; }
  .ylab { position:absolute; left:0; width:56px; text-align:right; font-family:var(--mono); font-size:10px;
          color:#5a6474; transform:translateY(-50%); pointer-events:none; white-space:nowrap; }
  .xlab { position:absolute; bottom:3px; font-family:var(--mono); font-size:10px; color:#5a6474; pointer-events:none; }
  .xlab.l { left:62px; } .chart.nogut .xlab.l { left:0; } .xlab.r { right:0; }
  .xhair { position:absolute; top:0; bottom:0; width:1px; background:#6b7688; pointer-events:none; display:none; z-index:2; }
  .xdot  { position:absolute; width:7px; height:7px; margin:-4px 0 0 -4px; border-radius:50%;
           border:1.5px solid var(--bg); pointer-events:none; display:none; z-index:3; }
  .xbox  { position:absolute; top:2px; background:#11151d; border:1px solid var(--line2); color:var(--fg);
           font-family:var(--mono); font-size:10.5px; padding:1px 6px; white-space:nowrap; pointer-events:none; display:none; z-index:4; }
  .xdate { position:absolute; bottom:1px; background:#11151d; border:1px solid var(--line2); color:var(--dim);
           font-family:var(--mono); font-size:10px; padding:1px 6px; white-space:nowrap; pointer-events:none; display:none; z-index:4; }
  .hmark { position:absolute; top:0; bottom:0; width:2px; background:#e0a93b; pointer-events:none; }
  .hmarklab { position:absolute; top:4px; font-family:var(--mono); font-size:10px; color:#e0a93b; white-space:nowrap; pointer-events:none; }

  /* ── bot pills ── */
  .pills { display:flex; flex-wrap:wrap; gap:5px; padding:6px 16px; background:var(--panel);
           border-bottom:1px solid var(--line); align-items:center; }
  .pill { border:1px solid; border-radius:12px; padding:2px 9px; font-family:var(--mono); font-size:10.5px;
          cursor:pointer; opacity:.32; user-select:none; white-space:nowrap; }
  .pill.on { opacity:1; }
  .pill .n { opacity:.7; margin-left:4px; }
  .pill.paper { border-style:dashed; }
  .pills .quick { background:none; border:1px solid var(--line2); color:var(--dim); border-radius:4px;
                  padding:2px 8px; font-size:10px; font-family:var(--mono); }
  input[type=date] { padding:3px 6px; font-size:11px; }
  .seg button.on { background:#0d2b22; border-color:var(--good); color:var(--good); }

  /* ── keyboard hint rail ── */
  .rail { position:fixed; left:0; right:0; bottom:0; background:#0c1017;
          border-top:1px solid var(--line); color:var(--dim2); font-family:var(--mono);
          font-size:10px; padding:5px 16px; display:flex; gap:16px; flex-wrap:wrap; z-index:50; }
  .rail b { color:var(--dim); font-weight:600; }
  .rail .sp { flex:1; }

  /* ── breakdowns ── */
  .hw td { text-align:center; padding:0; height:22px; min-width:26px; border:1px solid var(--bg); font-size:9.5px; font-family:var(--mono); }
  .hw th { font-size:9.5px; padding:2px 0; text-align:center; }
  .hw th.l, .hw td.l { text-align:left; padding-left:6px; min-width:34px; }
  .hw td.z { color:var(--dim2); }
  .brkgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:14px; }
  .brkgrid table td.thin, .brkgrid table tr.thin td { color:var(--dim2); }
  .brkgrid table tr.thin td.l::after { content:' ·thin'; font-size:9px; color:var(--warn); }
  .win { display:inline-block; min-width:38px; }

  /* ── correlation matrix ── */
  .mx td { text-align:center; padding:3px 4px; min-width:44px; border:1px solid var(--bg); font-size:10.5px; }
  .mx th { font-size:9.5px; text-align:center; padding:3px 2px; max-width:64px; overflow:hidden; text-overflow:ellipsis; }
  .mx th.l, .mx td.l { text-align:left; padding-left:6px; white-space:nowrap; }
  .mx td.thin { color:var(--dim2); }
  .mx td.diag { color:var(--dim2); background:var(--panel2); }
  .bars .bar { display:grid; grid-template-columns:120px 1fr 90px; gap:8px; align-items:center; font-family:var(--mono); font-size:11px; padding:2px 0; }
  .bars .trk { position:relative; height:10px; background:var(--panel2); border-radius:2px; }
  .bars .fill { position:absolute; top:0; bottom:0; border-radius:2px; }
  .legs { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
  .legs .panel { margin:0; }
  .legs .ph { font-size:10px; }
  .prjin { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .prjin label { color:var(--dim); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; }
  .prjin input { width:64px; }

  /* ── distributions tab ── */
  .dstwrap { display:grid; grid-template-columns:minmax(220px,1fr) minmax(360px,2.2fr) minmax(150px,.7fr); gap:14px; align-items:start; }
  @media (max-width:1100px) { .dstwrap { grid-template-columns:1fr; } }
  .dstlist .mgrp { color:var(--dim2); font-size:9.5px; letter-spacing:.08em; font-family:var(--mono);
                   padding:10px 12px 4px; text-transform:uppercase; }
  .mrow { display:flex; justify-content:space-between; gap:10px; padding:3px 12px; font-size:11.5px;
          font-family:var(--mono); cursor:pointer; border-left:2px solid transparent; }
  .mrow:hover { background:var(--panel2); }
  .mrow.on { background:var(--panel2); border-left-color:var(--accent); color:var(--fg); }
  .mrow.off { cursor:default; color:var(--dim2); }
  .mrow.off:hover { background:none; }
  .dstpct table td { padding:2px 4px; border:none; font-size:11.5px; }

  /* ── notes ── */
  .note { background:var(--panel2); border:1px solid var(--line);
          border-left:3px solid var(--accent); border-radius:6px;
          padding:10px 13px; font-size:12px; color:var(--dim); margin-bottom:14px; }
  .note.warn { border-left-color:var(--warn); }
  .note b, .note strong { color:var(--fg); }
  .note code { background:var(--bg); padding:1px 4px; border-radius:3px; font-size:11px; }
  .empty { color:var(--dim); padding:28px 12px; text-align:center; }
  svg { display:block; width:100%; }
  .rd { font-size:12px; color:var(--dim); line-height:1.65; }
  .rd b { color:var(--fg); }
</style>
</head>
<body>

<div class="cmdline">
  <span class="prompt">B.AUDIT&gt;</span>
  <input id="cmd" autocomplete="off" spellcheck="false"
         placeholder="command or metric — try DST, SHARPE, MAXDD, 1Y, GROSS, FIB ATLAS">
  <span id="cmdErr" class="cmdhint"></span>
  <button class="go" onclick="runCmd()">GO</button>
</div>
<div id="modebar" class="modebar gross">Gross view — costs removed · not what the account received</div>

<div class="cmd">
  <strong style="font-family:var(--mono);color:var(--accent)">BOT.AUDIT</strong>
  <label>Book</label>
  <span id="selCount" class="mono" style="font-size:11px;color:var(--accent);min-width:110px"></span>
  <label>Range</label>
  <div class="seg" id="rangeSeg">
    <button data-d="30">30D</button><button data-d="90" class="on">90D</button><button data-d="180">6M</button><button data-d="365">1Y</button><button data-d="0">Custom</button>
  </div>
  <span id="customRange" style="display:none;align-items:center;gap:4px">
    <input type="date" id="dFrom"> <span style="color:var(--dim)">→</span> <input type="date" id="dTo">
  </span>
  <label>Costs</label>
  <div class="seg">
    <button id="btnNet"   class="on" onclick="setGross(false)">Net</button>
    <button id="btnGross" onclick="setGross(true)">Gross</button>
  </div>
  <label title="Declared notional behind this book. Not read from the account — bots share MT5 accounts, so a per-bot denominator has to be declared. Stored in this browser only.">Capital $</label>
  <input type="number" id="inCap" placeholder="none" min="0" step="1000">
  <button onclick="reload()">↺ Reload</button>
  <button id="btnBt" onclick="toggleBacktest()" title="Overlay this bot's backtest. Fetched on demand — the portfolio build reads stored trade blobs from R2 and is far too expensive to pay on every page load.">+ Backtest</button>
  <span id="btModeWrap" style="display:none">
    <div class="seg">
      <button id="btModeCone" class="on" onclick="setBtMode('cone')" title="Every window of this length in the backtest, as a percentile envelope, with live inside it. The honest comparison at short samples.">Cone</button>
      <button id="btModeDates" onclick="setBtMode('dates')" title="The backtest over exactly these calendar dates. One window out of hundreds — read it as an anecdote, not a verdict.">Same dates</button>
    </div>
  </span>
  <div class="spacer"></div>
  <span id="status" class="mono" style="color:var(--dim);font-size:11px"></span>
</div>

<div class="pills" id="botPills"></div>

<div class="tabs">
  <button class="tab active" data-p="ovw" onclick="tab('ovw')"><span class="tag">OVW</span>Overview</button>
  <button class="tab" data-p="edg" onclick="tab('edg')"><span class="tag">EDG</span>Edge</button>
  <button class="tab" data-p="brk" onclick="tab('brk')"><span class="tag">BRK</span>Breakdowns</button>
  <button class="tab" data-p="sys" onclick="tab('sys')"><span class="tag">SYS</span>Per-Bot</button>
  <button class="tab" data-p="leg" onclick="tab('leg')"><span class="tag">LEG</span>Legs</button>
  <button class="tab" data-p="mtx" onclick="tab('mtx')"><span class="tag">MTX</span>Correlation</button>
  <button class="tab" data-p="rsk" onclick="tab('rsk')"><span class="tag">RSK</span>Risk</button>
  <button class="tab" data-p="prj" onclick="tab('prj')"><span class="tag">PRJ</span>Projection</button>
  <button class="tab" data-p="dst" onclick="tab('dst')"><span class="tag">DST</span>Distributions</button>
  <button class="tab" data-p="exc" onclick="tab('exc')"><span class="tag">EXC</span>Excursions</button>
  <button class="tab" data-p="cst" onclick="tab('cst')"><span class="tag">CST</span>Costs</button>
  <button class="tab" data-p="trd" onclick="tab('trd')"><span class="tag">TRD</span>Trades</button>
</div>

<div id="ovw" class="pane active"></div>
<div id="edg" class="pane"></div>
<div id="brk" class="pane"></div>
<div id="sys" class="pane"></div>
<div id="leg" class="pane"></div>
<div id="mtx" class="pane"></div>
<div id="rsk" class="pane"></div>
<div id="prj" class="pane"></div>
<div id="dst" class="pane"></div>
<div id="exc" class="pane"></div>
<div id="cst" class="pane"></div>
<div id="trd" class="pane"></div>

<script type="module">
import {
  netOf, costOf, normalizeTrades, dailySeries, dailyEquity, equityByTrade,
  monthlyReturns, rollingReturn, groupBy, excursions, exitMix, summarize,
  botsMissingCommission, bootstrapNote, MIN_N_RATIOS,
  cumFromDaily, liveGrowthPct, growthCone, conePercentile, clipDaily,
  distributions, DIST_METRICS, METRIC_READING,
  rollingEdge, breakdowns, hourWeekdayGrid, MIN_N_CELL, DOW,
  dailyByGroup, correlationMatrix, effectiveBets, coincidentLoss, worstJointDays, MIN_BOTH_ACTIVE,
  netLegs, exposureSeries, drawdownEpisodes, concentration, projectPaths,
} from './js/botAuditEngine.js';
import { instrument as _instrument } from './js/instrumentRegistry.js';
import { histVaR, histCVaR } from './js/metricsCore.js';

// MT5 symbols often carry a broker suffix ("XAUUSD.x", "NAS100.x"). Strip it
// before the registry lookup; if that still fails, the leg engine files the
// symbol as its own unknown leg rather than guessing.
const resolveInstrument = sym => {
  const raw = String(sym || '');
  try { return _instrument(raw); } catch (e) {}
  return _instrument(raw.replace(/[._][A-Za-z0-9]+$/, ''));
};

const BOTS = window.POS_BOTS || [];
const botOf = k => BOTS.find(b => b.key === k) || { key: k, label: k, color: '#9ba3bf', paper: false };

let RAW = [], TRADES = [], GROSS = false, NORM = null;
// Which bots are in the book. A Set, so any combination is a portfolio — the
// old single select could only show one bot or all of them, and "these three"
// is the question that actually comes up.
let SEL = new Set();
const liveKeys = () => BOTS.filter(b => !b.paper).map(b => b.key);
const selectedKeys = () => [...SEL];
function selectionLabel() {
  const k = selectedKeys();
  if (!k.length) return 'nothing selected';
  if (k.length === 1) return botOf(k[0]).label;
  const live = liveKeys();
  if (k.length === live.length && k.every(x => live.includes(x))) return 'All live bots';
  if (k.length === BOTS.length) return 'All bots';
  return `${k.length} bots`;
}
async function setSel(keys) {
  SEL = new Set(keys);
  try { localStorage.setItem('botAuditSel', JSON.stringify(selectedKeys())); } catch (e) {}
  renderPills();
  BT = null;                                   // a different book means a different backtest
  if (BT_ON) await loadBacktest();
  render();
}
window.togglePill = k => { const n = new Set(SEL); n.has(k) ? n.delete(k) : n.add(k); setSel([...n]); };
window.quickSel = which => setSel(which === 'live' ? liveKeys() : which === 'all' ? BOTS.map(b => b.key) : []);

function renderPills() {
  const host = $('botPills');
  if (!host) return;
  const counts = new Map();
  for (const t of (NORM?.trades || [])) counts.set(t.bot_key, (counts.get(t.bot_key) || 0) + 1);
  host.innerHTML = `<button class="quick" onclick="quickSel('live')">live</button>`
    + `<button class="quick" onclick="quickSel('all')">all</button>`
    + `<button class="quick" onclick="quickSel('none')">none</button>`
    + BOTS.map(b => {
      const n = counts.get(b.key) || 0;
      return `<span class="pill${SEL.has(b.key) ? ' on' : ''}${b.paper ? ' paper' : ''}" onclick="togglePill('${b.key}')"
        style="border-color:${b.bd || b.color};color:${b.color};background:${b.bg || 'transparent'}" title="${b.paper ? 'paper — simulated P&L' : 'live'}${n ? ` · ${n} trades in range` : ' · no trades in range'}">${esc(b.label)}<span class="n">${n || '·'}</span></span>`;
    }).join('');
  const sc = $('selCount'); if (sc) sc.textContent = selectionLabel();
}
// Backtest overlay state. `BT_CACHE` is keyed by bot so flipping the toggle off
// and on, or switching bots and back, never re-pays the R2 cost.
let BT_ON = false, BT_MODE = 'cone', BT = null, BT_LOADING = false;
const BT_CACHE = new Map();
const $ = id => document.getElementById(id);
const cap = () => Math.max(0, +($('inCap').value || 0));

// ── formatting ───────────────────────────────────────────────────────────────
const money = (v, d = 2) => (v >= 0 ? '+' : '−') + '$' + Math.abs(v).toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct   = (v, d = 2) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d) + '%';
const num   = (v, d = 2) => (v == null || !isFinite(v)) ? '—' : v.toFixed(d);
const cls   = v => v > 0 ? 'pos' : v < 0 ? 'neg' : 'neu';
const esc   = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const dur   = s => s == null ? '—' : s < 3600 ? `${Math.round(s/60)}m` : s < 86400 ? `${(s/3600).toFixed(1)}h` : `${(s/86400).toFixed(1)}d`;
const ukTime = u => { const d = new Date(u * 1000); return d.toLocaleString('en-GB', { timeZone:'Europe/London', year:'2-digit', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false }); };

// ── data ─────────────────────────────────────────────────────────────────────
// /api/trade-history caps at 90 days per call (one KV read per bot × date), so a
// longer window is fetched as chained 90-day chunks. This is the shape that the
// rollup key in LIVE_BACKTEST_ALIGNMENT.md §4.2 exists to replace — at 1 year
// this is 4 calls × 23 bots × 90 days of KV reads, which is slow by design, not
// by accident.
// Range is a [from, to] pair. Presets compute it from today; custom sets it
// directly. Either way it is fetched as chained 90-day chunks, which is the
// shape /api/trade-history's one-KV-read-per-(bot × date) design forces.
let RANGE = { from: null, to: null, preset: 90 };
const isoDay = d => d.toISOString().slice(0, 10);
const addDays = (iso, k) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + k); return isoDay(d); };

function setPreset(days) {
  RANGE.preset = days;
  document.querySelectorAll('#rangeSeg button').forEach(b => b.classList.toggle('on', +b.dataset.d === days));
  $('customRange').style.display = days === 0 ? 'inline-flex' : 'none';
  if (days > 0) {
    RANGE.to = isoDay(new Date());
    RANGE.from = addDays(RANGE.to, -(days - 1));
    $('dFrom').value = RANGE.from; $('dTo').value = RANGE.to;
  } else {
    RANGE.from = $('dFrom').value || RANGE.from || addDays(isoDay(new Date()), -89);
    RANGE.to   = $('dTo').value   || RANGE.to   || isoDay(new Date());
    $('dFrom').value = RANGE.from; $('dTo').value = RANGE.to;
  }
  try { localStorage.setItem('botAuditRange', JSON.stringify(RANGE)); } catch (e) {}
}

async function fetchRange(from, to) {
  if (!from || !to || from > to) return [];
  const chunks = [];
  let end = to;
  while (end >= from) {
    const start = addDays(end, -89) < from ? from : addDays(end, -89);
    chunks.push([start, end]);
    end = addDays(start, -1);
  }
  const out = [];
  for (let i = 0; i < chunks.length; i++) {
    const [f, t] = chunks[i];
    $('status').textContent = `loading ${i + 1}/${chunks.length} · ${f} → ${t}`;
    try {
      const r = await fetch(`/api/trade-history?from=${f}&to=${t}`);
      const j = await r.json();
      if (j.trades) out.push(...j.trades);
    } catch (e) { /* a failed chunk shows up as a short row count, not a silent gap */ }
  }
  return out;
}

window.reload = async function reload() {
  $('status').textContent = 'loading…';
  RAW = await fetchRange(RANGE.from, RANGE.to);
  NORM = normalizeTrades(RAW);
  renderPills();
  render();
};

// ── charts (hand-rolled SVG — no dependency, no CDN) ──────────────────────────
//
// LAYOUT RULE: the SVG covers the PLOT AREA ONLY and is stretched to fill it
// (preserveAspectRatio="none"). Every piece of text — axis ticks, date labels,
// the crosshair readout — is HTML positioned around it. Text inside a stretched
// SVG stretches with it, which on a wide monitor turned "$8,998" into something
// twice as wide as it was tall. Paths carry vector-effect="non-scaling-stroke"
// so line weight does not scale either. Nothing here measures the container,
// so there is no resize handling to get wrong.
const W   = 1000;                      // viewBox width — arbitrary, it is stretched
const GUT = { l: 62, b: 20 };          // px gutters that hold the HTML labels
const CHARTS = new Map();              // frame id -> { pts, fmt, colour, lo, hi, h }
let _chartSeq = 0;

// Decimals that actually separate the ticks: precision follows the span the
// axis covers. Without this a low-volatility book prints identical labels.
function autoDp(span) {
  const x = Math.abs(span);
  return x >= 200 ? 0 : x >= 20 ? 1 : x >= 2 ? 2 : x >= 0.2 ? 3 : 4;
}

// Y scale with headroom so a series never sits on the frame edge.
function scaleOf(vals, { zero = false, padFrac = 0.06 } = {}) {
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (hi === lo) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * padFrac;
  return { lo: lo - pad, hi: hi + pad };
}

function fmtFor({ fmt, money, pct }, span) {
  if (fmt) return fmt;
  const dp = autoDp(span);
  if (money) return v => '$' + v.toLocaleString('en-GB', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  if (pct)   return v => v.toFixed(dp) + '%';
  return v => v.toFixed(dp);
}

/** The frame every chart renders into. Registers the series for the crosshair. */
function frame({ svg, h, lo, hi, fmt, ticks = true, gut = true, xFirst = '', xLast = '', pts = [], colour = '#3fd07a', extra = '' }) {
  const id = 'ch' + (++_chartSeq);
  CHARTS.set(id, { pts, fmt, colour, lo, hi, h });
  const y = v => (1 - (v - lo) / (hi - lo)) * h;
  const yl = ticks ? [0, .25, .5, .75, 1].map(f => {
    const v = lo + (hi - lo) * f;
    return `<div class="ylab" style="top:${y(v).toFixed(1)}px">${fmt(v)}</div>`;
  }).join('') : '';
  return `<div class="chart${gut ? '' : ' nogut'}" data-ch="${id}" style="height:${h + GUT.b}px">${yl}
    <div class="plot" style="height:${h}px">${svg}${extra}<div class="xhair"></div><div class="xdot"></div><div class="xbox"></div></div>
    <div class="xlab l">${esc(xFirst)}</div><div class="xlab r">${esc(xLast)}</div><div class="xdate"></div></div>`;
}

const gridSvg = (h, lo, hi, zero) => {
  const y = v => (1 - (v - lo) / (hi - lo)) * h;
  let g = [0, .25, .5, .75, 1].map(f => {
    const yy = y(lo + (hi - lo) * f);
    return `<line x1="0" x2="${W}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#232a38" vector-effect="non-scaling-stroke"/>`;
  }).join('');
  if (zero && lo < 0 && hi > 0) g += `<line x1="0" x2="${W}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="#3a4356" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`;
  return g;
};
const pathOf = (vals, x, y) => {
  let d = '', on = false;
  vals.forEach((v, i) => { if (v == null || !isFinite(v)) return; d += (on ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; on = true; });
  return d;
};

function lineChart(pts, { h = 190, fill = null, stroke = '#3fd07a', zero = false, fmt = null, money = false, pct = false } = {}) {
  const vals = pts.map(p => p.v).filter(v => v != null && isFinite(v));
  if (vals.length < 2) return `<div class="empty">Not enough points to plot.</div>`;
  const { lo, hi } = scaleOf(vals, { zero });
  const f = fmtFor({ fmt, money, pct }, hi - lo);
  const n = pts.length, x = i => (i / (n - 1)) * W, y = v => (1 - (v - lo) / (hi - lo)) * h;
  const d = pathOf(pts.map(p => p.v), x, y);
  const base = y(zero && lo < 0 && hi > 0 ? 0 : lo);
  const area = fill && d ? `<path d="${d} L${W} ${base.toFixed(1)} L0 ${base.toFixed(1)} Z" fill="${fill}" stroke="none"/>` : '';
  const svg = `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none">${gridSvg(h, lo, hi, zero)}${area}<path d="${d}" fill="none" stroke="${stroke}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
  const first = pts.find(p => p.v != null), last = [...pts].reverse().find(p => p.v != null);
  return frame({ svg, h, lo, hi, fmt: f, xFirst: first?.k ?? '', xLast: last?.k ?? '', pts, colour: stroke });
}

function histogram(vals, realised, { h = 170, bins = 34 } = {}) {
  if (!vals.length) return `<div class="empty">No distribution.</div>`;
  const lo = Math.min(...vals), hi = Math.max(...vals), w = (hi - lo) / bins || 1;
  const counts = new Array(bins).fill(0);
  vals.forEach(v => { counts[Math.min(bins - 1, Math.max(0, Math.floor((v - lo) / w)))]++; });
  const mx = Math.max(...counts), bw = W / bins;
  const bars = counts.map((c, i) => {
    const bh = (c / mx) * h;
    return `<rect x="${(i * bw).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${(bw * 0.92).toFixed(1)}" height="${bh.toFixed(1)}" fill="#2f394b"/>`;
  }).join('');
  let extra = '';
  if (realised != null && isFinite(realised)) {
    const fx = Math.min(1, Math.max(0, (realised - lo) / (hi - lo || 1))) * 100;
    extra = `<div class="hmark" style="left:${fx.toFixed(2)}%"></div>`
          + `<div class="hmarklab" style="left:calc(${fx.toFixed(2)}% + 5px)">realised ${realised.toFixed(2)}</div>`;
  }
  const dp = autoDp(hi - lo);
  return frame({ svg: `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none">${bars}</svg>`, h, lo, hi,
                 fmt: v => v.toFixed(dp), ticks: false, gut: false, xFirst: lo.toFixed(dp), xLast: hi.toFixed(dp), pts: [], extra });
}

// ── crosshair ────────────────────────────────────────────────────────────────
// Pixel -> index is a plain fraction of the plot's own width, because the plot
// has no internal margins any more — the gutters are HTML outside it.
function moveXhair(fr, clientX) {
  const c = CHARTS.get(fr.dataset.ch);
  if (!c || !c.pts.length) return;
  const plot = fr.querySelector('.plot'), r = plot.getBoundingClientRect();
  const n = c.pts.length;
  const f = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  const i = Math.round(f * (n - 1)), pt = c.pts[i];
  if (!pt) return;
  const px = (i / Math.max(1, n - 1)) * r.width;
  const hair = fr.querySelector('.xhair'), dot = fr.querySelector('.xdot'), box = fr.querySelector('.xbox'), date = fr.querySelector('.xdate');
  hair.style.display = 'block'; hair.style.left = px + 'px';
  if (pt.v != null && isFinite(pt.v)) {
    dot.style.display = 'block'; dot.style.left = px + 'px';
    dot.style.top = ((1 - (pt.v - c.lo) / (c.hi - c.lo)) * c.h) + 'px'; dot.style.background = c.colour;
    box.style.display = 'block'; box.textContent = c.fmt(pt.v);
    box.style.left = Math.min(r.width - box.offsetWidth - 2, Math.max(0, px + 8)) + 'px';
  } else { dot.style.display = 'none'; box.style.display = 'none'; }
  date.style.display = 'block'; date.textContent = pt.k ?? '';
  const gut = fr.classList.contains('nogut') ? 0 : GUT.l;
  date.style.left = (gut + Math.min(r.width - date.offsetWidth, Math.max(0, px - date.offsetWidth / 2))) + 'px';
}
document.addEventListener('mousemove', e => { const fr = e.target.closest?.('.chart'); if (fr) moveXhair(fr, e.clientX); });
document.addEventListener('mouseout', e => {
  const fr = e.target.closest?.('.chart');
  if (fr && !fr.contains(e.relatedTarget)) fr.querySelectorAll('.xhair,.xdot,.xbox,.xdate').forEach(el => { el.style.display = 'none'; });
});

// ── command line ─────────────────────────────────────────────────────────────
//
// Accepts what the reference terminal's does: a tab code, a metric name, a
// period, or a cost mode — one box instead of hunting for the right control.
// Unrecognised input says so rather than failing silently.
const TAB_CODES = { ovw: 'ovw', overview: 'ovw', edg: 'edg', edge: 'edg', decay: 'edg', brk: 'brk', breakdowns: 'brk', breakdown: 'brk', leg: 'leg', legs: 'leg', mtx: 'mtx', correlation: 'mtx', corr: 'mtx', exposure: 'mtx', rsk: 'rsk', risk: 'rsk', prj: 'prj', projection: 'prj', ftmo: 'prj', sys: 'sys', bots: 'sys', 'per-bot': 'sys',
                    dst: 'dst', dist: 'dst', distributions: 'dst', exc: 'exc', excursions: 'exc',
                    cst: 'cst', costs: 'cst', trd: 'trd', trades: 'trd' };
const PERIODS = { all: '365', '1y': '365', '365': '365', '6m': '180', '180': '180',
                  '3m': '90', '90': '90', '30d': '30', '30': '30', '1m': '30' };

window.runCmd = function () {
  const raw = ($('cmd').value || '').trim();
  if (!raw) return;
  const q = raw.toLowerCase();
  const err = m => { $('cmdErr').textContent = m; setTimeout(() => { $('cmdErr').textContent = ''; }, 2600); };

  if (TAB_CODES[q]) { tab(TAB_CODES[q]); $('cmd').value = ''; return; }
  if (PERIODS[q])   { setPreset(+PERIODS[q]); $('cmd').value = ''; reload(); return; }
  if (q === 'gross' || q === 'net') { setGross(q === 'gross'); $('cmd').value = ''; return; }
  if (q === 'bt' || q === 'backtest') { toggleBacktest(); $('cmd').value = ''; return; }

  // a metric -> jump to distributions with it selected
  const norm = t => t.toLowerCase().replace(/[^a-z]/g, '');
  const m = DIST_METRICS.find(x => norm(x.label) === norm(q) || norm(x.key) === norm(q))
         || DIST_METRICS.find(x => norm(x.label).startsWith(norm(q)) || norm(x.key).startsWith(norm(q)));
  if (m) { tab('dst'); setDstMetric(m.key); $('cmd').value = ''; return; }

  // a bot
  const b = BOTS.find(x => norm(x.label) === norm(q)) || BOTS.find(x => norm(x.label).startsWith(norm(q)));
  if (b) { setSel([b.key]); $('cmd').value = ''; return; }
  if (q === 'all' || q === 'portfolio' || q === 'live') { quickSel('live'); $('cmd').value = ''; return; }

  err(`? ${raw}`);
};

document.addEventListener('keydown', e => {
  const typing = e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT';
  if (e.key === 'Enter' && e.target.id === 'cmd') { runCmd(); return; }
  if (e.key === 'Escape') { $('cmd').value = ''; $('cmd').blur(); return; }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); $('cmd').focus(); return; }
  const tabs = ['ovw', 'edg', 'brk', 'sys', 'leg', 'mtx', 'rsk', 'prj', 'dst', 'exc'];
  if (/^[0-9]$/.test(e.key)) { tab(tabs[e.key === '0' ? 9 : +e.key - 1]); return; }
  if (e.key === 'g') { setGross(!GROSS); return; }
  if (e.key === 'b') { toggleBacktest(); return; }
  if (e.key === 'r') { reload(); return; }
  if (e.key === '[' || e.key === ']') {
    const avail = DIST_METRICS.filter(m => _LAST_DIST?.metrics[m.key]?.available);
    if (!avail.length) return;
    const i = avail.findIndex(m => m.key === DST_METRIC);
    const next = avail[(i + (e.key === ']' ? 1 : -1) + avail.length) % avail.length];
    tab('dst'); setDstMetric(next.key);
  }
});

  $('btnBt').classList.toggle('on', BT_ON);
  $('btnBt').textContent = BT_ON ? '− Backtest' : '+ Backtest';
  $('btModeWrap').style.display = BT_ON ? '' : 'none';
  if (BT_ON) await loadBacktest();
  renderBacktestPanel();
};

window.setBtMode = m => {
  BT_MODE = m;
  $('btModeCone').classList.toggle('on', m === 'cone');
  $('btModeDates').classList.toggle('on', m === 'dates');
  renderBacktestPanel();
};

async function loadBacktest() {
  const keys = selectedKeys();
  if (keys.length !== 1) {
    BT = { ok: true, available: false, reason: `A backtest corresponds to ONE strategy — select a single bot to overlay it (currently ${keys.length}).` };
    return;
  }
  const bot = keys[0];
  if (BT_CACHE.has(bot)) { BT = BT_CACHE.get(bot); return; }
  BT_LOADING = true; renderBacktestPanel();
  try {
    const r = await fetch(`/api/bot-audit/backtest-curve?bot=${encodeURIComponent(bot)}`);
    BT = await r.json();
  } catch (e) {
    BT = { ok: false, available: false, reason: 'Request failed: ' + e.message };
  }
  BT_CACHE.set(bot, BT);
  BT_LOADING = false;
}

/**
 * One chart, several stacked bands plus several lines on a shared y-scale.
 * Bands are painted first so the lines sit on top of them.
 *
 * The x-axis is ALWAYS the live window — either day-1..day-N (cone) or the live
 * calendar span (same dates). It never stretches to the backtest's own history,
 * which is the whole point: five years next to three months renders live as a
 * two-pixel wiggle at the right-hand edge and shows nothing.
 */
function overlayChart({ bands = [], lines = [], n, h = 260, xFirst = '', xLast = '', xLabels = [], zero = true, unit = '%' }) {
  const all = [];
  for (const b of bands) all.push(...b.lo.filter(isFinite), ...b.hi.filter(isFinite));
  for (const l of lines) all.push(...l.v.filter(v => v != null && isFinite(v)));
  if (all.length < 2 || n < 2) return `<div class="empty">Not enough overlapping data to plot.</div>`;
  const { lo, hi } = scaleOf(all, { zero });
  const x = i => (i / (n - 1)) * W, y = v => (1 - (v - lo) / (hi - lo)) * h;
  const bandPaths = bands.map(b => {
    let up = '', dn = '';
    for (let i = 0; i < n; i++) if (isFinite(b.hi[i])) up += (up ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(b.hi[i]).toFixed(1) + ' ';
    for (let i = n - 1; i >= 0; i--) if (isFinite(b.lo[i])) dn += 'L' + x(i).toFixed(1) + ' ' + y(b.lo[i]).toFixed(1) + ' ';
    return up && dn ? `<path d="${up}${dn}Z" fill="${b.fill}" stroke="none"/>` : '';
  }).join('');
  const linePaths = lines.map(l => {
    const d = pathOf(l.v.slice(0, n), x, y);
    return d ? `<path d="${d}" fill="none" stroke="${l.stroke}" stroke-width="${l.w || 1.8}"${l.dash ? ` stroke-dasharray="${l.dash}"` : ''} vector-effect="non-scaling-stroke"/>` : '';
  }).join('');
  const svg = `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none">${gridSvg(h, lo, hi, zero)}${bandPaths}${linePaths}</svg>`;
  const live = lines[lines.length - 1];
  const pts = (live?.v || []).slice(0, n).map((v, i) => ({ k: xLabels[i] ?? `${i + 1}`, v }));
  const dp = autoDp(hi - lo);
  return frame({ svg, h, lo, hi, fmt: v => v.toFixed(dp) + unit, xFirst, xLast, pts, colour: live?.stroke || '#3fd07a' });
}

const swatch = (c, label, dash) =>
  `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;color:var(--dim);font-size:11px">`
  + `<span style="display:inline-block;width:16px;height:0;border-top:2px ${dash ? 'dashed' : 'solid'} ${c}"></span>${label}</span>`;

function renderBacktestPanel() {
  const host = $('btPanel');
  if (!host) return;
  if (!BT_ON) { host.innerHTML = ''; return; }
  if (BT_LOADING) { host.innerHTML = `<div class="panel"><div class="pb"><div class="empty">Loading backtest…</div></div></div>`; return; }

  const botLabel = selectionLabel();

  if (!BT || !BT.available) {
    // Two different situations that must not read the same. "Not wired" is a
    // permanent fact about our plumbing and nothing to chase; "unavailable" is a
    // fault that can be fixed, and saying "not wired" for it sends the reader
    // looking for the wrong problem entirely.
    const body = BT?.scaleImplausible
      ? `<b>Reference rejected for ${esc(botLabel)} — its own numbers aren't believable.</b>
         The backtest builds fine (config: ${esc(BT.configLabel || 'production')}) but reports
         <b>Sharpe ${BT.refSharpe ?? '?'}</b>, <b>CAGR ${BT.refCagr != null ? BT.refCagr.toLocaleString('en-GB') + '%' : '?'}</b>,
         median day <b>${BT.medianDaily >= 0 ? '+' : ''}${BT.medianDaily}%</b>.
         <br><br>Laying a real book against a reference orders of magnitude above it pins live to the zero line and reports
         P0 forever — which would look like a finding about the bot and is actually a finding about the reference. So the
         overlay refuses, on the same rule that keeps unverified backtests off this page.
         <br><br><b>What still works against this backtest:</b> everything scale-free — trade counts per day, win rate, exit
         mix, hold time, MFE/MAE in pips. Those don't inflate, which is exactly why the Fib Atlas
         frequency card on bot-config already uses this same backtest for daily trade counts and is trustworthy.
         The equity comparison needs a reference whose absolute level survives inspection.`
      : BT?.wired
      ? `<b>Backtest unavailable for ${esc(botLabel)}.</b> ${esc(BT?.reason || BT?.error || 'The build returned nothing.')}
         <br><br>This bot IS wired to a backtest — the fetch or the build failed, so it is worth retrying. A 404 usually means
         the stored vote-trade blobs are unreachable (no R2 credentials on this host, or a cold cache).`
      : `<b>Not wired for ${esc(botLabel)}.</b> ${esc(BT?.reason || BT?.error || 'No backtest available.')}
         <br><br>Left blank on purpose rather than drawn from whatever backtest happens to exist: an overlay built from a
         different config than production runs looks authoritative and misleads in both directions
         (<code>LIVE_BACKTEST_ALIGNMENT.md</code> T2).`;
    host.innerHTML = `<div class="panel"><div class="ph"><span class="badge">BT</span>Backtest overlay</div><div class="pb">
      <div class="note warn" style="margin:0">${body}</div></div></div>`;
    return;
  }

  const C = cap();
  if (!(C > 0)) {
    host.innerHTML = `<div class="panel"><div class="ph"><span class="badge">BT</span>Backtest overlay</div><div class="pb">
      <div class="note warn" style="margin:0"><b>Set Capital to overlay the backtest.</b> The backtest is a percent return on
      NAV; the live book is dollars. With no declared capital there is no shared axis — and two series on independent scales
      can be made to agree or disagree at will, so this refuses rather than guesses.</div></div></div>`;
    return;
  }

  const S = summarize(TRADES, { capital: C, gross: GROSS, bootRuns: 100, mcRuns: 100 });
  if (!S.n) { host.innerHTML = ''; return; }
  const live = liveGrowthPct(S.series.dailyEquity, C);
  if (live.length < 2) { host.innerHTML = ''; return; }

  const rets  = BT.daily.map(d => d.ret);
  const N     = live.length;
  const liveV = live.map(p => p.cum);
  const first = live[0].date, last = live[live.length - 1].date;
  const liveEnd = liveV[liveV.length - 1];

  let body, caption;
  if (BT_MODE === 'cone') {
    const cone = growthCone(rets, N);
    const nn   = Math.min(N, cone.length);
    const rank = conePercentile(rets, N, liveEnd);
    body = overlayChart({
      n: nn, xFirst: 'day 1', xLast: `day ${nn}`,
      xLabels: Array.from({ length: nn }, (_, i) => `day ${i + 1}`),
      bands: [
        { lo: cone.map(c => c.p5),  hi: cone.map(c => c.p95), fill: 'rgba(94,176,255,.10)' },
        { lo: cone.map(c => c.p25), hi: cone.map(c => c.p75), fill: 'rgba(94,176,255,.16)' },
      ],
      lines: [
        { v: cone.map(c => c.p50), stroke: '#5eb0ff', dash: '5 4', w: 1.4 },
        { v: liveV.slice(0, nn),   stroke: '#3fd07a', w: 2.2 },
      ],
    });
    caption = `<div class="rd" style="margin-top:10px">
      ${swatch('#3fd07a', 'live')}${swatch('#5eb0ff', 'backtest median', true)}
      <span style="color:var(--dim);font-size:11px">
        <span style="display:inline-block;width:16px;height:8px;background:rgba(94,176,255,.16);margin-right:5px"></span>P25–P75 &nbsp;
        <span style="display:inline-block;width:16px;height:8px;background:rgba(94,176,255,.10);margin-right:5px"></span>P5–P95</span>
      <br><br>Every <b>${nn}-day</b> window in the backtest, compounded from 0 and stacked into a percentile envelope.
      ${rank ? `Live's ${nn}-day result of <b>${pct(liveEnd)}</b> sits at <b>P${rank.pct}</b> of <b>${rank.windows.toLocaleString('en-GB')}</b> such windows.` : ''}
      Inside P25–P75 is behaving normally for a window this short; outside P5–P95 is worth investigating.
      <b>This is not a verdict on edge</b> — it says whether live sits inside the range this strategy naturally produces over ${nn} days.</div>`;
  } else {
    const clipped = clipDaily(BT.daily, first, last);
    if (clipped.length < 2) {
      body = `<div class="empty">The backtest covers ${esc(BT.from)} → ${esc(BT.to)} and does not overlap the live window (${esc(first)} → ${esc(last)}).</div>`;
      caption = '';
    } else {
      // Both series are indexed on the LIVE calendar, so the axis is the live
      // window and the backtest's longer history cannot squash it.
      const byDate = new Map();
      let eq = 1;
      for (const d of clipped) { eq *= (1 + d.ret / 100); byDate.set(d.date, (eq - 1) * 100); }
      let carried = null;
      const btV = live.map(p => { if (byDate.has(p.date)) carried = byDate.get(p.date); return carried; });
      body = overlayChart({
        n: N, xFirst: first, xLast: last, xLabels: live.map(p => p.date),
        lines: [
          { v: btV,   stroke: '#5eb0ff', dash: '5 4', w: 1.6 },
          { v: liveV, stroke: '#3fd07a', w: 2.2 },
        ],
      });
      const btEnd = btV[btV.length - 1];
      caption = `<div class="rd" style="margin-top:10px">
        ${swatch('#3fd07a', 'live')}${swatch('#5eb0ff', 'backtest, same dates', true)}
        <br><br>The backtest over <b>exactly these ${clipped.length} trading days</b>, rebased to 0 at the window start:
        backtest <b>${btEnd == null ? '—' : pct(btEnd)}</b> vs live <b>${pct(liveEnd)}</b>.
        <b class="neg">Read this as an anecdote, not a verdict.</b> It is one window out of the hundreds in the cone view, and
        which one you get is mostly decided by when the bot happened to be switched on.</div>`;
    }
  }

  host.innerHTML = `<div class="panel"><div class="ph"><span class="badge">BT</span>Equity vs backtest
    <span class="rt">${esc(BT.source)} · ${esc(BT.from)} → ${esc(BT.to)} · ${BT.days.toLocaleString('en-GB')} days</span></div>
    <div class="pb">${body}${caption}
    <div class="rd" style="margin-top:10px;color:var(--dim2);font-size:11px;border-top:1px solid var(--line);padding-top:8px">
      Config pinned to production: ${esc(BT.configLabel)}. Resolved server-side from the same frozen constants the live path
      uses, so it cannot drift from what the bot actually runs.</div></div></div>`;
}

// ── render ───────────────────────────────────────────────────────────────────
function activeTrades() {
  const all = NORM ? NORM.trades : [];
  return all.filter(t => SEL.has(t.bot_key));
}

function render() {
  if (!NORM) return;
  TRADES = activeTrades();
  const C = cap(), G = { gross: GROSS };
  const S = summarize(TRADES, { capital: C, gross: GROSS });
  $('status').textContent = `${NORM.kept} rows · ${NORM.dupes} dupes dropped · ${NORM.droppedNoClose} no-close · showing ${TRADES.length}`;
  renderOvw(S, C, G);
  renderEdg(G);
  renderBrk(G);
  renderSys(C, G);
  renderLeg(C, G);
  renderMtx(G);
  renderRsk(C, G);
  renderPrj(C, G);
  renderDst(S);
  renderExc(G);
  renderCst(G);
  renderTrd();
  renderBacktestPanel();
  const rs = $('railState');
  if (rs) rs.textContent = `${selectionLabel()} · ${RANGE.from} → ${RANGE.to} · ${GROSS ? 'GROSS' : 'NET'} · ${TRADES.length} trades`;
}

function tile(k, v, sub, klass = '') {
  return `<div class="tile ${klass}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${sub || ''}</div></div>`;
}

function renderOvw(S, C, G) {
  const el = $('ovw');
  if (!S.n) { el.innerHTML = `<div class="empty">No closed trades in this window for this selection.</div>`; return; }
  const f = S.scaleFree, b = S.scaleBound;
  const thin = S.flags.thinSample ? 'thin' : '';
  const lock = 'locked';

  const tiles = [
    tile('Net P&amp;L', `<span class="${cls(f.totalPnl)}">${money(f.totalPnl)}</span>`, `${f.trades} trades · ${f.activeDays} active days`),
    b ? tile('Total Return', `<span class="${cls(b.totalReturnPct)}">${pct(b.totalReturnPct)}</span>`, `on $${C.toLocaleString('en-GB')} declared`)
      : tile('Total Return', '—', 'set Capital to unlock', lock),
    tile('Sharpe (ann)', num(f.sharpe), 'daily basis · √252', thin),
    tile('Sortino (ann)', num(f.sortino), 'downside only', thin),
    b ? tile('Max Drawdown', `<span class="neg">${pct(b.maxDDPct)}</span>`, `${money(f.maxDDAbs)} peak-to-trough`)
      : tile('Max Drawdown', `<span class="neg">${money(f.maxDDAbs)}</span>`, 'set Capital for %'),
    b ? tile('Calmar', num(b.calmar), 'CAGR ÷ |maxDD|', thin) : tile('Calmar', '—', 'needs Capital', lock),
    b ? tile('Return / Year', `<span class="${cls(b.cagr)}">${pct(b.cagr)}</span>`, 'annualised, compounded', thin)
      : tile('Return / Year', '—', 'needs Capital', lock),
    b ? tile('Volatility (ann)', pct(b.volAnn), 'daily sd × √252', thin)
      : tile('Volatility (ann)', '—', 'needs Capital', lock),
    tile('Win Rate', (f.winRate * 100).toFixed(1) + '%', `${Math.round(f.winRate * f.trades)}W / ${f.trades - Math.round(f.winRate * f.trades)}L`, thin),
    tile('Profit Factor', num(f.profitFactor), `payoff ${num(f.payoff)}`, thin),
    b ? tile('Time in DD', b.timeInDDPct.toFixed(1) + '%', `${f.tradingDays} calendar days`) : tile('Time in DD', '—', 'needs Capital', lock),
    tile('Expectancy', `<span class="${cls(f.expectancy)}">${money(f.expectancy)}</span>`, 'per trade, after costs'),
    tile('Costs', `<span class="neg">${money(f.totalCost)}</span>`, f.costPctOfGross != null ? `${f.costPctOfGross.toFixed(1)}% of gross` : 'swap + commission'),
    tile('Median Hold', dur(f.medHoldSec), `best ${money(f.bestTrade, 0)} / worst ${money(f.worstTrade, 0)}`),
  ].join('');

  const eq   = S.series.equityByTrade;
  const dEq  = S.series.dailyEquity;
  const roll = rollingReturn(dEq, Math.min(63, Math.max(5, Math.floor(dEq.length / 4))), C);
  const mg   = monthlyReturns(S.series.daily, C);
  const rollWin = Math.min(63, Math.max(5, Math.floor(dEq.length / 4)));

  const notes = [];
  if (S.flags.noCapital) notes.push(`<div class="note"><b>No capital declared</b> — return %, CAGR, Calmar, max-DD % and time-in-drawdown are hidden rather than computed against a guessed denominator. Bots share MT5 accounts, so account balance is not a per-bot base; type the notional you consider behind this book into <b>Capital</b> above. It is stored in this browser only, never pushed to config.</div>`);
  if (S.flags.thinSample) notes.push(`<div class="note warn"><b>Thin sample — ${S.n} trades.</b> Ratio metrics (Sharpe, Sortino, Calmar, PF, win rate) are greyed above because below ~${MIN_N_RATIOS} trades their confidence interval is wider than any difference you would act on. The P&amp;L totals are exact; the ratios are not yet estimates.</div>`);
  if (GROSS) notes.push(`<div class="note warn"><b>Gross view — costs removed.</b> This is the "before costs" book and is not what the account got. Flip back to Net before drawing any conclusion; the gap between the two views is the cost drag.</div>`);
  const mc = S.flags.missingCommission;
  if (mc.length && !GROSS) notes.push(`<div class="note warn"><b>${mc.length} bot${mc.length > 1 ? 's report' : ' reports'} no commission</b> — ${mc.map(k => esc(botOf(k).label)).join(', ')}. Their trades are counted with commission = 0, so this book's Net flatters them by however much they were actually charged.</div>`);

  el.innerHTML = notes.join('') + `<div class="tiles">${tiles}</div>` + `
    <div class="panel"><div class="ph"><span class="badge">EQ</span>Equity curve — by trade<span class="rt">${eq.length} trades · ${C > 0 ? 'from $' + C.toLocaleString('en-GB') : 'cumulative P&L from 0'}</span></div>
      <div class="pb">${lineChart(eq.map(p => ({ k: p.day, v: p.equity })), { fill: 'rgba(63,208,122,.10)', stroke: '#3fd07a', zero: C === 0, money: true })}</div></div>
    <div id="btPanel"></div>
    <div class="panel"><div class="ph"><span class="badge">DD</span>Drawdown from peak<span class="rt">max ${C > 0 ? pct(S.scaleBound.maxDDPct) : money(S.scaleFree.maxDDAbs)}</span></div>
      <div class="pb">${lineChart(dEq.map(p => ({ k: p.date, v: C > 0 ? p.ddPct : p.ddAbs })), { fill: 'rgba(242,85,90,.13)', stroke: '#f2555a', zero: true, pct: C > 0, money: C === 0 })}</div></div>
    <div class="panel"><div class="ph"><span class="badge">R${rollWin}</span>Rolling ${rollWin}-day return<span class="rt">${C > 0 ? '% of capital' : 'dollars'}</span></div>
      <div class="pb">${lineChart(roll.map(p => ({ k: p.date, v: p.value })), { stroke: '#5eb0ff', zero: true, pct: C > 0, money: C === 0 })}</div></div>
    <div class="panel"><div class="ph"><span class="badge">MRET</span>Monthly returns<span class="rt">${mg.pct ? '% of capital' : '$ P&L — set Capital for %'}</span></div>
      <div class="pb">${heat(mg)}</div></div>`;
}

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function heat(mg) {
  if (!mg.years.length) return `<div class="empty">No months.</div>`;
  const lim = Math.max(Math.abs(mg.min), Math.abs(mg.max)) || 1;
  const bg = v => {
    if (v == null) return '';
    const a = Math.min(1, Math.abs(v) / lim) * 0.62 + 0.08;
    return `background:rgba(${v >= 0 ? '63,208,122' : '242,85,90'},${a.toFixed(2)})`;
  };
  const dp = mg.pct ? (lim >= 20 ? 1 : lim >= 2 ? 2 : 3) : 0;
  const fmtc = v => v == null ? '·' : mg.pct
    ? (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(dp)
    : (v >= 0 ? '+' : '−') + '$' + Math.abs(Math.round(v)).toLocaleString('en-GB');
  return `<table class="heat"><thead><tr><th class="l">Year</th>${MON.map(m => `<th>${m}</th>`).join('')}<th>Year</th></tr></thead><tbody>` +
    mg.years.map(y => `<tr><td class="l"><b>${y.year}</b></td>` +
      y.months.map(v => `<td class="${v == null ? 'na' : ''}" style="${bg(v)}">${fmtc(v)}</td>`).join('') +
      `<td style="${bg(y.total)}"><b>${fmtc(y.total)}</b></td></tr>`).join('') +
    `</tbody></table>`;
}

// ── EDG · rolling edge ───────────────────────────────────────────────────────
let EDGE_WIN = 20;
window.setEdgeWin = w => { EDGE_WIN = w; try { localStorage.setItem('botAuditEdgeWin', String(w)); } catch (e) {} renderEdg({ gross: GROSS }); };

function renderEdg(G) {
  const el = $('edg');
  if (!TRADES.length) { el.innerHTML = `<div class="empty">No trades.</div>`; return; }
  const e = rollingEdge(TRADES, { window: EDGE_WIN, gross: GROSS });
  const winSel = `<div class="seg" style="margin-left:auto">${[10, 20, 30, 50].map(w =>
    `<button class="${w === EDGE_WIN ? 'on' : ''}" onclick="setEdgeWin(${w})">${w}</button>`).join('')}</div>`;

  if (!e.enough) {
    el.innerHTML = `<div class="panel"><div class="ph"><span class="badge">EDG</span>Rolling edge${winSel}</div><div class="pb">
      <div class="empty">${TRADES.length} trades in range — a ${EDGE_WIN}-trade window needs at least ${EDGE_WIN}. Widen the range or shorten the window.</div></div></div>`;
    return;
  }

  const n = e.rows.length;
  const labels = e.rows.map(r => r.day);
  const bandLines = (b, series, full, fmt) => overlayChart({
    n, xFirst: labels[0], xLast: labels[n - 1], xLabels: labels, zero: false,
    bands: [
      { lo: new Array(n).fill(b.p5),  hi: new Array(n).fill(b.p95), fill: 'rgba(94,176,255,.08)' },
      { lo: new Array(n).fill(b.p25), hi: new Array(n).fill(b.p75), fill: 'rgba(94,176,255,.14)' },
    ],
    lines: [
      { v: new Array(n).fill(full), stroke: '#5eb0ff', dash: '5 4', w: 1.3 },
      { v: series, stroke: '#3fd07a', w: 2 },
    ],
  });

  // overlayChart formats in %; expectancy is dollars, so give it its own frame.
  const wrChart = bandLines(e.band.winRate, e.rows.map(r => r.winRate), e.full.winRate);
  const exPts = e.rows.map(r => ({ k: r.day, v: r.expectancy }));
  const exChart = lineChart(exPts, { stroke: '#3fd07a', zero: true, money: true, h: 200 });

  const rk = e.read;
  const verdict = (rank, label) => rank <= 5
    ? `<b class="neg">P${rank} — below the 5th percentile.</b> The last ${EDGE_WIN} trades' ${label} is in the adverse tail of what a random ${EDGE_WIN}-trade draw from this book produces. That is a reason to look, not proof the edge is gone.`
    : rank >= 95
    ? `<b class="pos">P${rank} — above the 95th percentile.</b> The last ${EDGE_WIN} trades ran hot relative to the book. Enjoy it; do not size up on it.`
    : rank <= 25 || rank >= 75
    ? `<b>P${rank}</b> — a touch ${rank < 50 ? 'below' : 'above'} typical for a ${EDGE_WIN}-trade window from this book. Normal variation.`
    : `<b>P${rank}</b> — squarely in the middle of what this book produces over ${EDGE_WIN} trades. Business as usual.`;

  const worst = e.rows.reduce((a, r) => r.winRate < a.winRate ? r : a, e.rows[0]);
  const best  = e.rows.reduce((a, r) => r.winRate > a.winRate ? r : a, e.rows[0]);

  el.innerHTML = `
  <div class="note">The monitoring question: <b>is the book still doing what it did?</b> A ${EDGE_WIN}-trade window walks along the book;
    the shaded band is what a random ${EDGE_WIN}-trade draw from this same book produces (P5–P95 light, P25–P75 dark), and the dashed line
    is the full-sample figure. A latest window in the lower tail is the earliest, cleanest sign of trouble this data can give —
    earlier than P&amp;L, which is noise at these sample sizes.</div>

  <div class="tiles">
    ${tile('Last ' + EDGE_WIN + ' · win rate', `<span class="${e.last.winRate >= e.full.winRate ? 'pos' : 'neg'}">${e.last.winRate.toFixed(0)}%</span>`, `book ${e.full.winRate.toFixed(1)}% · rank P${rk.winRateRank}`)}
    ${tile('Last ' + EDGE_WIN + ' · expectancy', `<span class="${cls(e.last.expectancy)}">${money(e.last.expectancy)}</span>`, `book ${money(e.full.expectancy)} · rank P${rk.expectancyRank}`)}
    ${tile('Band · win rate', `${e.band.winRate.p5.toFixed(0)}–${e.band.winRate.p95.toFixed(0)}%`, 'P5–P95 of a random window')}
    ${tile('Band · expectancy', `${money(e.band.expectancy.p5, 0)} … ${money(e.band.expectancy.p95, 0)}`, 'P5–P95 of a random window')}
    ${tile('Worst window', `<span class="neg">${worst.winRate.toFixed(0)}%</span>`, `ending ${worst.day}`)}
    ${tile('Best window', `<span class="pos">${best.winRate.toFixed(0)}%</span>`, `ending ${best.day}`)}
  </div>

  <div class="panel"><div class="ph"><span class="badge">RWR</span>Rolling ${EDGE_WIN}-trade win rate<span class="rt">${n} windows · x = date the window closed</span>${winSel}</div>
    <div class="pb">${wrChart}
    <div class="rd" style="margin-top:8px">${swatch('#3fd07a', 'rolling')}${swatch('#5eb0ff', 'full sample', true)}
      <span style="color:var(--dim);font-size:11px"><span style="display:inline-block;width:16px;height:8px;background:rgba(94,176,255,.14);margin-right:5px"></span>P25–P75 &nbsp;
      <span style="display:inline-block;width:16px;height:8px;background:rgba(94,176,255,.08);margin-right:5px"></span>P5–P95</span></div></div></div>

  <div class="panel"><div class="ph"><span class="badge">REX</span>Rolling ${EDGE_WIN}-trade expectancy<span class="rt">per trade, after costs · band ${money(e.band.expectancy.p5, 0)} … ${money(e.band.expectancy.p95, 0)}</span></div>
    <div class="pb">${exChart}</div></div>

  <div class="panel"><div class="ph"><span class="badge">READ</span>Reading</div><div class="pb"><div class="rd">
    <b>Win rate.</b> ${verdict(rk.winRateRank, 'win rate')}<br><br>
    <b>Expectancy.</b> ${verdict(rk.expectancyRank, 'expectancy')}<br><br>
    <b>What this cannot see.</b> The band is drawn from the book's own history, so a slow regime change that has already lasted most of
    the sample is <i>inside</i> the band by construction. It catches a recent run that is unusual against the whole; it does not catch
    "the whole has quietly become worse". For that you need the backtest expectation this page still lacks
    (<code>LIVE_BACKTEST_ALIGNMENT.md</code> §4.3).
  </div></div></div>`;
}

// ── BRK · breakdowns ─────────────────────────────────────────────────────────
function renderBrk(G) {
  const el = $('brk');
  if (!TRADES.length) { el.innerHTML = `<div class="empty">No trades.</div>`; return; }
  const B = breakdowns(TRADES, G);
  const H = hourWeekdayGrid(TRADES, G);

  // hour × weekday heatmap — the most actionable single picture this data draws
  const lim = H.maxAbs || 1;
  const bg = c => {
    if (!c.n) return '';
    const a = Math.min(1, Math.abs(c.net) / lim) * 0.7 + 0.1;
    return `background:rgba(${c.net >= 0 ? '63,208,122' : '242,85,90'},${a.toFixed(2)})`;
  };
  const cellTxt = c => !c.n ? '·' : (Math.abs(c.net) >= 1000 ? (c.net / 1000).toFixed(1) + 'k' : Math.round(c.net));
  const heatHtml = `<div style="overflow-x:auto"><table class="hw"><thead><tr><th class="l">UK</th>${Array.from({ length: 24 }, (_, h) => `<th>${String(h).padStart(2, '0')}</th>`).join('')}<th>Day</th></tr></thead><tbody>` +
    H.grid.map((row, d) => {
      const dayNet = row.reduce((s, c) => s + c.net, 0), dayN = row.reduce((s, c) => s + c.n, 0);
      return `<tr><td class="l"><b>${DOW[d]}</b></td>` + row.map((c, h) =>
        `<td class="${c.n ? '' : 'z'}" style="${bg(c)}" title="${DOW[d]} ${String(h).padStart(2, '0')}:00 UK · ${c.n} trade${c.n === 1 ? '' : 's'}${c.n ? ` · ${Math.round(c.wins / c.n * 100)}% win · ${money(c.net)}` : ''}">${cellTxt(c)}</td>`).join('') +
        `<td style="${bg({ n: dayN, net: dayNet })}" title="${dayN} trades"><b>${cellTxt({ n: dayN, net: dayNet })}</b></td></tr>`;
    }).join('') + `</tbody></table></div>`;

  const table = (rows, title, labelFn = k => k) => {
    if (!rows.length) return '';
    return `<div class="panel"><div class="ph"><span class="badge">${title.slice(0, 4).toUpperCase()}</span>${title}<span class="rt">${rows.length} groups</span></div>
      <div class="scroll" style="max-height:420px"><table><thead><tr><th class="l">Group</th><th>n</th><th>Win%</th><th>Expect.</th><th>Net</th><th>Costs</th></tr></thead><tbody>` +
      rows.map(r => `<tr class="${r.n < MIN_N_CELL ? 'thin' : ''}">
        <td class="l">${labelFn(r.key)}</td><td>${r.n}</td>
        <td><span class="win">${(r.winRate * 100).toFixed(0)}%</span></td>
        <td class="${r.n < MIN_N_CELL ? '' : cls(r.expectancy)}">${money(r.expectancy)}</td>
        <td class="${r.n < MIN_N_CELL ? '' : cls(r.net)}">${money(r.net, 0)}</td>
        <td class="neg">${money(r.cost, 0)}</td></tr>`).join('') +
      `</tbody></table></div></div>`;
  };
  const botPairLabel = k => { const [b, sym] = k.split('|'); const bot = botOf(b);
    return `<span class="chip" style="background:${bot.bg || 'var(--s2)'};border:1px solid ${bot.bd || 'var(--border)'};color:${bot.color}">${esc(bot.label)}</span> ${esc(sym)}`; };

  el.innerHTML = `
  <div class="note">Every slice keyed on the <b>open</b> time in UK wall-clock — the moment the decision was made. Rows under ${MIN_N_CELL} trades are
    shown but greyed and marked <span style="color:var(--warn)">·thin</span>: a 3-trade cell that reads 100% is noise wearing a number.
    ${B.noOpenTime ? `<b class="neg">${B.noOpenTime} trade${B.noOpenTime > 1 ? 's have' : ' has'} no open time</b> and are excluded from the time-based slices only.` : ''}
    ${GROSS ? '<b class="neg">Gross view — costs removed.</b>' : ''}</div>

  <div class="panel"><div class="ph"><span class="badge">HXD</span>P&amp;L by hour × weekday<span class="rt">UK open hour · ${TRADES.length - H.skipped} trades · hover a cell</span></div>
    <div class="pb">${heatHtml}

  <div class="brkgrid">
